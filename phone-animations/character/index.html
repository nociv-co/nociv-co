<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Character Maker: NOCIV.CO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="description" content="Build a creator character: artist, DJ, curator, skater. Flat 2D with a punk print look. Save a sticker or a GIF. Free, nothing uploaded.">
<style>
  @font-face { font-family: NocivAnton; src: url('../../fonts/anton.woff') format('woff'); font-display: swap; }
  :root { --paper: #e9e6df; --note: #f2ecd6; --ink: #1a1a1a; --red: #c8412f; --gold: #f2c230; --muted: #6b665c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif; overflow: hidden; overscroll-behavior: none; position: fixed; inset: 0; width: 100%; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .app { height: 100%; display: flex; flex-direction: column; }
  .hdr { flex: none; display: flex; align-items: center; gap: 8px; padding: calc(8px + env(safe-area-inset-top)) 12px 6px; }
  .hdr a, .hdr button { all: unset; box-sizing: border-box; height: 36px; padding: 0 12px; display: flex; align-items: center; gap: 6px; border: 2px solid var(--ink); border-radius: 11px; background: var(--note); font-weight: 900; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; box-shadow: 0 3px 8px rgba(0,0,0,.14); cursor: pointer; }
  .hdr a:active, .hdr button:active { transform: translateY(1px); box-shadow: none; }
  .hdr .ttl { flex: 1; text-align: center; font-family: NocivAnton, Impact, "Arial Narrow", sans-serif; font-size: 1.25rem; letter-spacing: .06em; text-transform: uppercase; line-height: 1; }
  .hdr .ttl span { display: inline-block; background: var(--ink); color: #fff; padding: 3px 10px 2px; transform: rotate(-1.5deg); }
  .hdr svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .stage { flex: 0 0 auto; height: 36%; min-height: 200px; position: relative; margin: 0 12px; border: 2.5px solid var(--ink); border-radius: 16px; overflow: hidden; background: #d6dccf; touch-action: none; box-shadow: 4px 4px 0 var(--ink); }
  .stage.chk { background: repeating-conic-gradient(#e4e1d8 0 25%, #f4f1e8 0 50%) 0 0 / 22px 22px; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .stage .tag { position: absolute; left: 10px; bottom: 10px; padding: 4px 10px 3px; background: var(--note); border: 2px solid var(--ink); font-family: NocivAnton, Impact, sans-serif; letter-spacing: .05em; font-size: 1rem; text-transform: uppercase; line-height: 1; }
  .stage .play { position: absolute; right: 10px; bottom: 10px; width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--ink); background: var(--note); display: grid; place-items: center; box-shadow: 0 3px 8px rgba(0,0,0,.2); }
  .stage .play svg { width: 18px; height: 18px; fill: var(--ink); }
  .tabs { flex: none; display: flex; gap: 8px; overflow-x: auto; padding: 14px 12px 10px; scroll-snap-type: x proximity; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { all: unset; box-sizing: border-box; flex: none; scroll-snap-align: start; width: 62px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 2px solid var(--ink); border-radius: 13px; background: var(--note); box-shadow: 0 4px 10px rgba(0,0,0,.14); font-weight: 900; font-size: .56rem; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; transition: background .15s, color .15s; }
  .tabs button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tabs button[aria-selected="true"] { background: var(--ink); color: var(--note); box-shadow: inset 0 2px 6px rgba(0,0,0,.5); }
  .panel { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 2px 12px calc(16px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 4px 0 10px; }
  .chip { all: unset; box-sizing: border-box; height: 34px; padding: 0 13px; display: flex; align-items: center; border: 2px solid var(--ink); border-radius: 10px; background: var(--note); font-weight: 900; font-size: .68rem; letter-spacing: .09em; text-transform: uppercase; box-shadow: 0 3px 8px rgba(0,0,0,.12); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--note); box-shadow: inset 0 2px 5px rgba(0,0,0,.5); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 10px; }
  .opt { all: unset; box-sizing: border-box; position: relative; aspect-ratio: 1; border: 2px solid rgba(26,26,26,.28); border-radius: 12px; background: var(--note); display: grid; place-items: center; cursor: pointer; overflow: hidden; }
  .opt canvas { width: 100%; height: 100%; display: block; }
  .opt[aria-pressed="true"] { border: 3px solid var(--ink); box-shadow: 0 4px 10px rgba(0,0,0,.2); }
  .opt .nm { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; font-size: .5rem; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; padding: 2px 0; background: rgba(242,236,214,.92); }
  .grid.big { grid-template-columns: repeat(2, 1fr); } .grid.big .opt { aspect-ratio: 4/5; }
  .sw { display: flex; flex-wrap: wrap; gap: 9px; margin: 12px 0 2px; }
  .sw button { all: unset; box-sizing: border-box; width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--ink); box-shadow: 0 3px 7px rgba(0,0,0,.18); cursor: pointer; }
  .sw button[aria-pressed="true"] { outline: 3px solid var(--ink); outline-offset: 2px; }
  .lbl { margin: 14px 0 4px; font-weight: 900; font-size: .62rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .note { margin: 8px 0 0; font-size: .8rem; line-height: 1.4; color: var(--muted); }
  .btn { all: unset; box-sizing: border-box; display: grid; place-items: center; width: 100%; height: 50px; margin-top: 10px; background: var(--red); color: #fff; border: 2.5px solid var(--ink); border-radius: 12px; box-shadow: 3px 3px 0 var(--ink); font-weight: 900; letter-spacing: .14em; font-size: .85rem; text-transform: uppercase; cursor: pointer; }
  .btn.alt { background: var(--note); color: var(--ink); }
  .btn:active { transform: translate(3px, 3px); box-shadow: none; }
  .btn[disabled] { opacity: .5; }
  .modal { position: fixed; inset: 0; z-index: 20; background: rgba(26,26,26,.72); display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal.on { display: flex; }
  .card { width: 100%; max-width: 420px; max-height: 100%; overflow: auto; background: var(--note); border: 2.5px solid var(--ink); border-radius: 16px; padding: 14px; box-shadow: 5px 5px 0 var(--ink); }
  .card img { display: block; width: 100%; max-height: 52vh; object-fit: contain; border: 2px solid var(--ink); border-radius: 10px; background: repeating-conic-gradient(#e4e1d8 0 25%, #f4f1e8 0 50%) 0 0 / 18px 18px; }
  .card h3 { margin: 0 0 8px; font-family: NocivAnton, Impact, sans-serif; letter-spacing: .06em; font-weight: 400; font-size: 1.4rem; text-transform: uppercase; }
  .hide { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <a href="../?m=avatar" id="back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Menu</a>
    <div class="ttl"><span>CHARACTER</span></div>
    <button type="button" id="rand"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.3" fill="currentColor"/></svg>Mix</button>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="tag" id="tag"></div>
    <button type="button" class="play" id="play" aria-label="Play or pause"></button>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="panel" id="panel"></div>
</div>
<div class="modal" id="modal"><div class="card" id="mcard"></div></div>
<script>
(function () {
'use strict';
const TAU = Math.PI * 2, R = d => d * Math.PI / 180, INK = '#1a1a1a', $ = id => document.getElementById(id);
let ctx = null, PX = 1, PAT = null, DOT = null, LW = 4.2;

// ---------- color + path helpers ----------
function hex2(h) { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
function mix(a, b, t) { const A = hex2(a), B = hex2(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const dk = (h, t) => mix(h, '#000000', t == null ? .25 : t), lt = (h, t) => mix(h, '#ffffff', t == null ? .3 : t);
function mkDot() { DOT = document.createElement('canvas'); DOT.width = DOT.height = 32; const g = DOT.getContext('2d'); g.fillStyle = 'rgba(26,26,26,.36)'; [[8, 8], [24, 24]].forEach(([x, y]) => { g.beginPath(); g.arc(x, y, 5, 0, TAU); g.fill(); }); }
mkDot();
function shOff(k) { const m = ctx.getTransform(), v = m.inverse(), wx = -k * PX * .8, wy = -k * PX * .9; return { x: v.a * wx + v.c * wy, y: v.b * wx + v.d * wy }; }
function paint(p, fill, o) {
  o = o || {};
  if (fill) { ctx.fillStyle = fill; ctx.fill(p); }
  if (fill && !o.ns) {
    ctx.save(); ctx.clip(p); const off = shOff(o.sh || 5), r = new Path2D(); r.rect(-500, -600, 1000, 900); r.addPath(p, new DOMMatrix().translate(off.x, off.y));
    ctx.fillStyle = PAT; ctx.fill(r, 'evenodd'); ctx.restore();
  }
  if (!o.no) { ctx.lineWidth = o.lw || LW; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(p); }
}
function line(pts, w, col, closed) { const p = new Path2D(); pts.forEach((q, i) => i ? p.lineTo(q[0], q[1]) : p.moveTo(q[0], q[1])); if (closed) p.closePath(); ctx.lineWidth = w; ctx.strokeStyle = col || INK; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(p); }
function qline(x0, y0, cx, cy, x1, y1, w, col) { const p = new Path2D(); p.moveTo(x0, y0); p.quadraticCurveTo(cx, cy, x1, y1); ctx.lineWidth = w; ctx.strokeStyle = col || INK; ctx.lineCap = 'round'; ctx.stroke(p); }
function ell(cx, cy, rx, ry, rot) { const p = new Path2D(); p.ellipse(cx, cy, rx, ry, rot || 0, 0, TAU); return p; }
function rr(x, y, w, h, r) { const p = new Path2D(); r = Math.min(r, w / 2, h / 2); p.moveTo(x + r, y); p.lineTo(x + w - r, y); p.arcTo(x + w, y, x + w, y + r, r); p.lineTo(x + w, y + h - r); p.arcTo(x + w, y + h, x + w - r, y + h, r); p.lineTo(x + r, y + h); p.arcTo(x, y + h, x, y + h - r, r); p.lineTo(x, y + r); p.arcTo(x, y, x + r, y, r); p.closePath(); return p; }
function cap(x0, y0, x1, y1, w0, w1) {
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L, a = Math.atan2(dy, dx), p = new Path2D();
  p.moveTo(x0 + nx * w0, y0 + ny * w0); p.lineTo(x1 + nx * w1, y1 + ny * w1); p.arc(x1, y1, w1, a + Math.PI / 2, a - Math.PI / 2, true);
  p.lineTo(x0 - nx * w0, y0 - ny * w0); p.arc(x0, y0, w0, a - Math.PI / 2, a + Math.PI / 2, true); p.closePath(); return p;
}
function star(cx, cy, r, n) { const p = new Path2D(); for (let i = 0; i < n * 2; i++) { const a = -Math.PI / 2 + i * Math.PI / n, rr_ = i % 2 ? r * .45 : r; i ? p.lineTo(cx + Math.cos(a) * rr_, cy + Math.sin(a) * rr_) : p.moveTo(cx + Math.cos(a) * rr_, cy + Math.sin(a) * rr_); } p.closePath(); return p; }

// ---------- data ----------
const BODIES = { slim: { sw: 30, hw: 22, arm: 10.5, leg: 14, neck: 9, wst: 28 }, mid: { sw: 36, hw: 27, arm: 13, leg: 18, neck: 11, wst: 34 }, broad: { sw: 45, hw: 34, arm: 16.5, leg: 23, neck: 14, wst: 42 }, curvy: { sw: 33, hw: 35, arm: 12, leg: 20, neck: 9.5, wst: 23 }, athletic: { sw: 45, hw: 26, arm: 15, leg: 17, neck: 13, wst: 31 }, round: { sw: 38, hw: 37, arm: 14.5, leg: 21, neck: 12, wst: 41 } };
const SKINS = ['#f6d3b5', '#e8b98f', '#d9a273', '#c08552', '#a06a3f', '#7d4e2d', '#5a3520', '#3b2316'];
const HAIRC = ['#1a1a1a', '#3a2616', '#6b4423', '#d8b25a', '#a8422a', '#9a9a9a', '#f2ecd6', '#2f5d9e', '#e46fa6', '#4a8a52'];
const CLR = ['#1a1a1a', '#f2ecd6', '#c8412f', '#f2c230', '#d6dccf', '#8a6a4a', '#ffffff', '#2f5d9e', '#e3a3a0', '#3d4a26', '#8a8a8a', '#6a4c93'];
const EYEC = ['#1a1a1a', '#4a2e1a', '#7a5a2a', '#3f6b4a', '#2f5d9e', '#8a8a8a'];
const OPTS = {
  head: ['round', 'square', 'long'], eyes: ['round', 'almond', 'sleepy', 'wide', 'sharp', 'dot'], brow: ['flat', 'arch', 'angry', 'soft', 'none'], nose: ['line', 'round', 'wide'], mouth: ['smile', 'flat', 'smirk', 'open', 'shout'],
  beard: ['none', 'stubble', 'mustache', 'goatee', 'beard'], glasses: ['none', 'round', 'aviator', 'square', 'shades'],
  hair: ['bald', 'buzz', 'fade', 'highfade', 'waves', 'coily', 'afro', 'puff', 'curls', 'cornrows', 'fulani', 'braidbun', 'boxbraids', 'bobbraids', 'twists', 'locs', 'shortlocs', 'locbun', 'bantu', 'puffs', 'mohawk', 'long', 'bun'], hat: ['none', 'cap', 'beanie', 'bucket', 'phones', 'bandana'],
  top: ['tee', 'hoodie', 'jacket', 'tank', 'vest', 'apron'], bottom: ['jeans', 'joggers', 'cargo', 'shorts', 'skirt', 'slacks'], shoes: ['sneaker', 'skate', 'boot', 'hightop'],
  prop: ['none', 'spray', 'brush', 'record', 'camera', 'clipboard', 'frame', 'board', 'mic', 'scissors'],
  pose: ['idle', 'wave', 'walk', 'dance', 'hype', 'spray', 'scratch', 'point', 'ollie']
};
const TYPES = {
  artist: { name: 'Artist', top: 'apron', topC: '#e8e2cc', bottom: 'cargo', botC: '#3d4a26', shoes: 'sneaker', shoeC: '#c8412f', hat: 'beanie', hatC: '#f2c230', prop: 'spray', pose: 'spray', chain: false, lanyard: false, scarf: false, glasses: 'none' },
  dj: { name: 'DJ', top: 'hoodie', topC: '#c8412f', bottom: 'jeans', botC: '#1a1a1a', shoes: 'hightop', shoeC: '#f2ecd6', hat: 'phones', hatC: '#1a1a1a', prop: 'record', pose: 'scratch', chain: true, lanyard: false, scarf: false, glasses: 'shades' },
  curator: { name: 'Curator', top: 'vest', topC: '#3d4a26', bottom: 'slacks', botC: '#1a1a1a', shoes: 'boot', shoeC: '#8a6a4a', hat: 'none', hatC: '#1a1a1a', prop: 'clipboard', pose: 'point', chain: false, lanyard: true, scarf: false, glasses: 'round' },
  skater: { name: 'Skater', top: 'tee', topC: '#f2c230', bottom: 'jeans', botC: '#2f5d9e', shoes: 'skate', shoeC: '#f2ecd6', hat: 'cap', hatC: '#c8412f', prop: 'board', pose: 'ollie', chain: false, lanyard: false, scarf: false, glasses: 'none' }
};
const DEF = Object.assign({ type: 'artist', body: 'mid', skin: '#c08552', head: 'round', eyes: 'round', eyeC: '#1a1a1a', brow: 'flat', nose: 'line', mouth: 'smile', beard: 'none', hair: 'coily', hairC: '#1a1a1a', earrings: false, lashes: false, lipC: '', bg: 'sage', grit: true }, TYPES.artist);

// ---------- poses: every pose loops in T seconds ----------
const POSES = {
  idle: { T: 2.4, f: w => ({ bob: Math.sin(w) * 1.6, lean: Math.sin(w) * 1, head: Math.sin(w) * 1.5, aR: [9, 14], aL: [9, 14] }) },
  wave: { T: 1.2, f: w => ({ bob: Math.sin(w * 2) * 1, lean: -3, head: 5, aR: [128, 176 + Math.sin(w * 3) * 24], aL: [9, 14] }) },
  walk: { T: .9, f: w => { const s = Math.sin(w); return { bob: -Math.abs(Math.cos(w)) * 4, lean: s * 2.5, head: -s * 2, aR: [16 + s * 14, 22 + s * 18], aL: [16 - s * 14, 22 - s * 18], lR: { a: 3, lift: Math.max(0, s) }, lL: { a: 3, lift: Math.max(0, -s) } }; } },
  dance: { T: 1.6, f: w => { const b = Math.sin(w * 4), k = Math.sin(w * 2) > 0 ? 1 : -1; return { bob: -Math.abs(b) * 9, lean: Math.sin(w * 2) * 6, head: Math.sin(w * 2) * 7, aR: k > 0 ? [150 + b * 10, 168] : [60 + b * 8, 110], aL: k > 0 ? [60 + b * 8, 110] : [150 + b * 10, 168], lR: { a: 11, lift: k > 0 ? .25 : 0 }, lL: { a: 11, lift: k < 0 ? .25 : 0 } }; } },
  hype: { T: 1, f: w => { const b = Math.sin(w * 2); return { bob: -Math.abs(b) * 12, lean: 0, head: Math.sin(w) * 4, aR: [156 + b * 8, 162], aL: [156 + b * 8, 162], lR: { a: 8, lift: Math.abs(b) * .5 }, lL: { a: 8, lift: Math.abs(b) * .5 } }; } },
  spray: { T: 1.6, f: w => ({ bob: Math.sin(w * 2) * 1, lean: 5 + Math.sin(w) * 3, head: 6, aR: [86 + Math.sin(w * 6) * 2.5, 90 + Math.sin(w * 6) * 3], aL: [24, 46], lR: { a: 8, lift: 0 }, lL: { a: 10, lift: 0 } }) },
  scratch: { T: 1.2, f: w => { const s = Math.sin(w * 2); return { bob: Math.abs(Math.sin(w * 2)) * 2.4, lean: 0, head: s * 5, hy: Math.abs(s) * 2, aR: [20, -48 + s * 20], aL: [20, -48 - s * 20], lR: { a: 7, lift: 0 }, lL: { a: 7, lift: 0 } }; } },
  point: { T: 2, f: w => ({ bob: Math.sin(w) * 1.2, lean: -3, head: 6 + Math.sin(w) * 2, aR: [102, 100 + Math.sin(w) * 4], aL: [40, -42], lR: { a: 4, lift: 0 }, lL: { a: 7, lift: 0 } }) },
  ollie: { T: 1.4, f: w => { const u = (w / TAU) % 1, h = u < .6 ? Math.sin(u / .6 * Math.PI) : 0, c = u >= .6 ? Math.sin((u - .6) / .4 * Math.PI) * 5 : 0; return { bob: -h * 42 + c, lean: Math.sin(w) * 3, head: 0, aR: [62 + h * 14, 74 + h * 10], aL: [62 + h * 14, 74 + h * 10], lR: { a: 6 + h * 4, lift: h * .8 }, lL: { a: 6 + h * 4, lift: h * .8 }, board: { y: -h * 30, rot: Math.sin(u * TAU * 1) * .0 + h * -.22 * (u < .3 ? 1 : -1) } }; } }
};
function poseAt(name, t) {
  const d = POSES[name] || POSES.idle, base = { bob: 0, lean: 0, head: 0, hy: 0, aR: [9, 14], aL: [9, 14], lR: { a: 4, lift: 0 }, lL: { a: 4, lift: 0 }, board: null };
  return Object.assign(base, d.f(TAU * t / d.T));
}

// ---------- the draw ----------
function dirv(side, deg) { const a = R(deg); return { x: side * Math.sin(a), y: Math.cos(a) }; }
function drawChar(c, S, P, view, o) {
  o = o || {}; ctx = c; PX = c.canvas.width / view.w;
  PAT = ctx.createPattern(DOT, 'repeat'); try { PAT.setTransform(new DOMMatrix().scale(.25)); } catch (e) {}
  const B = BODIES[S.body] || BODIES.mid, hairC = S.hairC, skin = S.skin, sD = dk(skin, .12);
  ctx.save(); ctx.translate(c.canvas.width / 2, c.canvas.height / 2); ctx.scale(PX, PX); ctx.translate(-view.cx, -view.cy);
  LW = Math.max(3.2, 4.4 * (view.w > 200 ? 1 : view.w / 220 + .3));
  // ground shadow
  if (!o.noShadow) { ctx.fillStyle = 'rgba(26,26,26,.22)'; ctx.beginPath(); ctx.ellipse(0, 8, 58, 8, 0, 0, TAU); ctx.fill(); }
  const hipY = -110 + (P.bob || 0);
  // skateboard under feet
  if (S.pose === 'ollie' || (P.board && S.prop === 'board')) drawBoard(0, P.board ? P.board.y + 2 : 0, P.board ? P.board.rot : 0, S);
  ctx.save(); ctx.translate(0, hipY);
  // legs
  const legs = [1, -1].map(side => legGeom(side, B, side > 0 ? P.lR : P.lL));
  legs.forEach(g => drawLeg(g, B, S, skin));
  ctx.save(); ctx.rotate(R(P.lean || 0));
  const arms = [1, -1].map(side => armGeom(side, B, side > 0 ? P.aR : P.aL));
  drawHairBack(S, B, P);
  drawTorso(S, B, skin);
  drawExtrasTorso(S, B);
  // arms (left behind prop, right with prop)
  arms.forEach((g, i) => drawArm(g, i ? -1 : 1, B, S, skin));
  // head
  ctx.save(); ctx.translate(0, -134 + (P.hy || 0)); ctx.rotate(R(P.head || 0)); drawHead(S, B, P, o); ctx.restore();
  // props in the right hand
  drawProp(arms[0], S, P, o);
  ctx.restore(); ctx.restore(); ctx.restore();
}
