<!DOCTYPE html>
<html lang="en">
<head>
<!-- Site Created & Designed by Jasilyn A. Anderson | NOCIV.CO -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Case Zero Builder | NOCIV</title>
<meta name="robots" content="noindex">
<meta name="description" content="Pick your parts, arrange them, pick a shape, fit it to your printer. Free.">
<meta name="theme-color" content="#161616">
<link rel="apple-touch-icon" href="/icons/shop-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/shop-192.png">
<style>
:root{--ink:#1a1a1a;--paper:#f3efe6;--panel:#fbf9f4;--line:#d9d4c8;--mute:#6f6a60;--red:#c8412f;--green:#2f7a4b;--sys:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:500 15px/1.35 var(--sys);-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button,select{font:inherit;color:inherit}
.top{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:var(--ink);color:#fff}
.top a.back{color:#fff;text-decoration:none;font:800 22px/1 var(--sys);padding:4px 8px}
.top b{font:900 14px/1 var(--sys);letter-spacing:.1em;text-transform:uppercase}
.top .sp{flex:1}
.top .tb{all:unset;cursor:pointer;width:36px;height:36px;display:grid;place-items:center;border:1.5px solid #fff;border-radius:10px;font:900 17px/1 var(--sys)}
html.embedded .top{display:none}
.stage{flex:1 1 auto;min-height:0;position:relative;background:#e7e2d6;overflow:hidden}
.stage canvas#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.stage #v3{position:absolute;inset:0;touch-action:none}
.stage #v3[hidden]{display:none}
.stage #v3 canvas{display:block;width:100%;height:100%}
.stage .tag{position:absolute;left:8px;bottom:8px;padding:4px 8px;border-radius:8px;background:rgba(26,26,26,.82);color:#fff;font:700 11.5px/1.2 var(--sys);pointer-events:none;max-width:calc(100% - 16px)}
.stage .sb{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.stage .sb button{all:unset;cursor:pointer;padding:8px 11px;border:1.5px solid var(--ink);border-radius:10px;background:#fff;font:800 12px/1 var(--sys)}
.stage .sb button[aria-pressed=true]{background:var(--ink);color:#fff}
.stage .sb[hidden]{display:none}
.con{flex:none;height:318px;display:flex;flex-direction:column;background:var(--panel);border-top:1.5px solid var(--ink)}
.con.down{height:auto}.con.down .pane{display:none}
.pane{flex:1 1 auto;min-height:0;overflow-y:auto;padding:10px 12px}
.tabs{flex:none;display:flex;align-items:stretch;gap:4px;padding:6px 8px;border-top:1px solid var(--line)}
.con.down .tabs{border-top:0}
.tabs .tl{flex:1;min-width:0;display:flex;gap:4px}
.tabs .tl button{all:unset;cursor:pointer;flex:1 1 0;min-width:0;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:10px;color:#6f6a60;font:700 11px/1 var(--sys)}
.tabs .tl button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs .tl button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs .tl button[aria-pressed=true]{background:var(--ink);color:#fff}
.tabs .rb{all:unset;cursor:pointer;flex:0 0 38px;width:38px;height:38px;align-self:center;display:grid;place-items:center;border-radius:50%;border:1.5px solid var(--ink);background:#fff}
.tabs .rb svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.con.down .tabs .rb.drop svg{transform:rotate(180deg)}
.tabs .rb.q{background:var(--ink);color:#fff;font:900 18px/1 var(--sys)}
.bbar{flex:none;position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:#fff;border-top:1.5px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
.bbar i{position:absolute;top:-1.5px;left:0;height:4px;background:var(--red)}
.bbar button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;color:#8d887d;font:800 11px/1 var(--sys)}
.bbar button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bbar button[aria-current=step]{color:var(--ink)}
.h{margin:0 0 6px;font:800 11px/1 var(--sys);letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.grid{display:grid;gap:7px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.pick{all:unset;cursor:pointer;box-sizing:border-box;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;padding:6px 4px;min-height:44px;border:2px solid var(--ink);border-radius:12px;background:#fff;font:800 12px/1.15 var(--sys)}
.pick small{font-weight:600;font-size:10px;color:var(--mute)}
.pick svg{width:100%;height:36px;display:block}
.pick[aria-pressed=true]{background:var(--ink);color:#fff}.pick[aria-pressed=true] small{color:#d8d2c4}
.pick .n{position:absolute;top:-7px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font:900 11px/20px var(--sys)}
.pick .lk{position:absolute;top:3px;left:4px;font:900 8.5px/1 var(--sys);letter-spacing:.04em;padding:2px 4px;border-radius:4px;background:#e7e2d6;color:var(--ink)}
.pick .lk.plug,.pick .lk.pins{background:#cfe9d7}
.hrow{display:grid;grid-auto-flow:column;grid-auto-columns:96px;gap:7px;overflow-x:auto;scrollbar-width:none;padding:8px 2px 4px;scroll-snap-type:x proximity}
.hrow::-webkit-scrollbar{display:none}.hrow .pick{scroll-snap-align:start;min-height:96px}
.catsel{display:flex;align-items:center;gap:8px}
.catsel select{flex:1;height:40px;border:1.5px solid var(--ink);border-radius:10px;background:#fff;padding:0 10px;font:800 14px var(--sys);-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 17px) 17px,calc(100% - 12px) 17px;background-size:5px 5px;background-repeat:no-repeat}
.row{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.row > b{flex:0 0 74px;font:800 12px/1.15 var(--sys)}
.step{display:flex;align-items:center;flex:1;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff}
.step button{all:unset;cursor:pointer;width:42px;height:36px;display:grid;place-items:center;font:900 20px/1 var(--sys)}
.step output{flex:1;text-align:center;font:800 13.5px/1 var(--sys);border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink);padding:11px 2px}
.seg{display:flex;flex:1;min-width:0;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{all:unset;cursor:pointer;flex:1;text-align:center;padding:10px 2px;font:700 12px/1 var(--sys);background:#fff;white-space:nowrap}
.seg button + button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.btn{all:unset;cursor:pointer;box-sizing:border-box;display:block;text-align:center;padding:11px 8px;border:2px solid var(--ink);border-radius:12px;background:#fff;font:800 13px/1.15 var(--sys)}
.btn.dark{background:var(--ink);color:#fff}.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled,.btn[aria-disabled=true]{opacity:.4}
.note{margin:6px 0 0;font:500 12px/1.35 var(--sys);color:var(--mute)}
.note b{color:var(--ink)}
.bad{color:var(--red)!important}.ok{color:var(--green)!important}
.chosen{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chosen span{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border:1.5px solid var(--ink);border-radius:999px;background:#fff;font:800 11.5px/1 var(--sys)}
.chosen span i{font-style:normal;color:var(--red)}
.list{display:flex;flex-direction:column;gap:6px}
.list .it,.list a{display:block;padding:9px 11px;border:1.5px solid var(--ink);border-radius:11px;background:#fff;color:var(--ink);text-decoration:none;font:600 12.5px/1.35 var(--sys)}
.list b{display:block;font:800 13.5px/1.2 var(--sys);margin-bottom:2px}
.files{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.selbar{display:flex;gap:6px;align-items:center;margin:0 0 8px;padding:7px 8px;border:1.5px solid var(--ink);border-radius:12px;background:#fff}
.selbar b{flex:1;font:800 13px/1.2 var(--sys)}
.selbar button{all:unset;cursor:pointer;padding:8px 10px;border:1.5px solid var(--ink);border-radius:9px;font:800 12px/1 var(--sys)}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.sheet .in{width:100%;max-height:88dvh;overflow:auto;background:var(--panel);border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 8px;font:900 18px/1.1 var(--sys);text-transform:uppercase;letter-spacing:.04em}
.sheet .x{all:unset;cursor:pointer;float:right;width:36px;height:36px;display:grid;place-items:center;border:1.5px solid var(--ink);border-radius:50%;font:900 16px var(--sys)}
.sheet details{border:1.5px solid var(--ink);border-radius:12px;background:#fff;margin:0 0 8px;padding:0 12px}
.sheet summary{cursor:pointer;padding:12px 0;font:800 14.5px/1.2 var(--sys)}
.sheet details p,.sheet details li,.sheet td{font:500 13.5px/1.45 var(--sys);color:#2c2a26}
.sheet details ul,.sheet details ol{padding-left:18px;margin:0 0 12px}
.sheet table{border-collapse:collapse;width:100%;margin:0 0 12px}.sheet td{border-top:1px solid var(--line);padding:5px 4px;vertical-align:top}.sheet td:first-child{font-weight:800;white-space:nowrap}
.sheet a{color:var(--ink)}
@media(max-height:620px){.con{height:296px}}
.texg .pick{min-height:0;padding:4px 2px;font-size:11px}.texg .pick svg{height:22px}
.pane .row{margin-bottom:7px}
@media(min-width:900px){body{max-width:560px;margin:0 auto;border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink)}}
</style>
<script src="/vendor/clipper/clipper.js"></script>
<script src="parts.js?v=8"></script>
<script type="importmap">{ "imports": { "three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three/" } }</script>
</head>
<body>
<header class="top"><a class="back" href="/casezero/" aria-label="Back to Case Zero">&lsaquo;</a><b>Case Zero Builder</b><span class="sp"></span><button class="tb" id="helpTop" aria-label="Help and Learn">?</button></header>
<section class="stage" id="stage" aria-label="Your device">
  <canvas id="view"></canvas>
  <div id="v3" hidden></div>
  <div class="sb" id="sb" hidden></div>
  <div class="tag" id="tag">Start with the brain: the parts that make it work</div>
</section>
<section class="con" id="con">
  <div class="pane" id="pane"></div>
  <div class="tabs"><div class="tl" id="parts" role="tablist"></div><button class="rb drop" id="drop" aria-label="Hide the controls"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button><button class="rb q" id="help" aria-label="Help and Learn">?</button></div>
</section>
<nav class="bbar" id="bbar" aria-label="Steps"></nav>
<input type="file" id="snapIn" accept="image/*" capture="environment" hidden>
<div class="sheet" id="sheet" hidden><div class="in" id="sheetIn"></div></div>
<script type="module" src="builder.js?v=8"></script>
</body>
</html>
