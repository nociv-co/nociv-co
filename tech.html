<div class="wrap">
  <img src="tech-imagery-1.png" alt="The Attention Economy — Utopia/Dystopia. Make the rebellion of screens punk." style="width:100%; display:block;">

  <hr style="border:0; border-top:1px solid #333; margin:40px 0;">

  <div style="text-align:center;">
    <h2 style="font-size:1.6rem; font-weight:900; text-transform:uppercase;">
      Build your own devices — coming soon
    </h2>
    <p style="max-width:520px; margin:20px auto; font-size:1.1rem; line-height:1.7;">
      We deserve to be free from attention-consuming, subscription and
      paywall-based tech. Ownership is enough. It's simple.
    </p>
  </div>

  <hr style="border:0; border-top:1px solid #333; margin:40px 0;">

  <div style="text-align:center; margin-bottom:20px;">
    <h2 style="letter-spacing:3px; font-size:1.3rem;">PRODUCTS</h2>
  </div>

  <div id="productList" style="max-width:600px; margin:0 auto;"></div>
</div>

<script>
  // ===== TECH PRODUCTS — plug and play =====
  // Add a product any time. Leave buyLink empty to show "Available at
  // pop-ups" — once you have a Stripe Payment Link (or any buy link),
  // paste it in and a Buy button appears automatically.
  const techProducts = [
    // {
    //   name: "Product name",
    //   description: "Short description of what it is.",
    //   price: "$00",
    //   buyLink: "" // paste your Stripe Payment Link here when ready
    // },
  ];
  // ==========================================

  const productList = document.getElementById('productList');
  if (techProducts.length === 0) {
    productList.innerHTML = '<p style="opacity:.5; text-align:center;">Nothing listed yet — check back soon.</p>';
  } else {
    techProducts.forEach(p => {
      const card = document.createElement('div');
      card.style.cssText = 'border:1px solid #444; background:#1c1c1c; padding:18px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;';

      const info = document.createElement('div');
      info.innerHTML = `<div style="font-weight:900; font-size:1.05rem;">${p.name}</div>
                         <div style="font-size:0.85rem; opacity:.75; margin-top:4px;">${p.description}</div>
                         ${p.price ? `<div style="font-size:0.9rem; margin-top:6px; color:var(--gold);">${p.price}</div>` : ''}`;
      card.appendChild(info);

      if (p.buyLink) {
        const btn = document.createElement('a');
        btn.href = p.buyLink;
        btn.target = '_blank';
        btn.rel = 'noopener';
        btn.textContent = 'Buy';
        btn.style.cssText = 'background:var(--red); color:#fff; padding:10px 18px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; font-size:0.8rem; white-space:nowrap;';
        card.appendChild(btn);
      } else {
        const badge = document.createElement('span');
        badge.textContent = 'Available at pop-ups';
        badge.style.cssText = 'font-size:0.75rem; opacity:.6; white-space:nowrap; font-style:italic;';
        card.appendChild(badge);
      }
      productList.appendChild(card);
    });
  }
</script>
