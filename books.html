<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Books — NOCIV.CO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<style>
  .zine {
    border: 1px solid #333;
    margin-bottom: 30px;
    padding: 24px;
    background: #111;
  }
  .zine h2 {
    margin: 0 0 6px;
    font-size: 1.4rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .zine .zine-sub {
    opacity: .6;
    font-size: 0.85rem;
    margin-bottom: 20px;
  }
  .zine-parts {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .zine-parts button {
    background: #1c1c1c;
    color: #eee;
    border: 1px solid #444;
    padding: 10px 16px;
    cursor: pointer;
    font-size: 0.85rem;
    letter-spacing: 0.03em;
  }
  .zine-parts button.active { background: var(--red); border-color: var(--red); }
  .zine-parts a.download {
    background: var(--gold);
    color: #1a1a1a;
    border: none;
    padding: 10px 16px;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.03em;
  }
  .zine-viewer {
    margin-top: 20px;
    display: none;
  }
  .zine-viewer.show { display: block; }
  .zine-viewer embed, .zine-viewer object {
    width: 100%;
    height: 70vh;
    border: 1px solid #333;
    background: #fff;
  }
  .zine-viewer-note {
    font-size: 0.75rem;
    opacity: .6;
    margin-top: 8px;
  }
  .coming-soon {
    opacity: .5;
    font-style: italic;
    padding: 20px;
    text-align: center;
    border: 1px dashed #333;
  }
</style>
</head>
<body class="dark">

<header class="nociv-header">
  <a href="index.html"><img class="torn-header-img" src="header.png" alt="NOCIV.CO — Nothing Of Civilization"></a>
</header>

<nav class="tabs">
  <a href="about.html" class="img-tab"><img src="nav-about.png" alt="About"></a>
  <a href="clothing.html" class="img-tab"><img src="nav-clothing.png" alt="Clothing"></a>
  <a href="tech.html" class="img-tab"><img src="nav-tech.png" alt="Tech"></a>
  <a href="books.html" class="img-tab active"><img src="nav-books.png" alt="Books"></a>
  <a href="community.html" class="img-tab"><img src="community-button.png" alt="Community"></a>
</nav>

<div class="wrap">
  <div class="eyebrow">Free food for thought</div>
  <p style="opacity:.7; max-width:500px; margin-bottom:30px;">
    Zines, free to read and free to keep. No sign-up, no paywall.
  </p>

  <div id="zineList"></div>

  <div class="coming-soon">More zines coming soon.</div>
</div>

<footer class="nociv-footer">NOCIV.CO — Nothing Of Civilization</footer>

<script>
  // ===== ZINE LIBRARY — plug and play =====
  // Add a new zine by copying one of these objects.
  // Each "parts" entry needs a PDF file path — drop your PDFs in /zines/
  // TITLE BELOW IS A PLACEHOLDER — confirm the exact wording you want, then edit here.
  const zines = [
    {
      title: "How to Feel the Void of Life",
      sub: "Zine · 3 parts",
      parts: [
        { label: "Part 1", file: "zines/how-to-feel-the-void-of-life-part1.pdf" },
        { label: "Part 2", file: "zines/how-to-feel-the-void-of-life-part2.pdf" },
        { label: "Part 3", file: "zines/how-to-feel-the-void-of-life-part3.pdf" }
      ]
    }
  ];
  // ==========================================

  const zineList = document.getElementById('zineList');

  zines.forEach((zine) => {
    const wrap = document.createElement('div');
    wrap.className = 'zine';

    const h2 = document.createElement('h2');
    h2.textContent = zine.title;
    wrap.appendChild(h2);

    const sub = document.createElement('div');
    sub.className = 'zine-sub';
    sub.textContent = zine.sub;
    wrap.appendChild(sub);

    const partsRow = document.createElement('div');
    partsRow.className = 'zine-parts';

    const viewer = document.createElement('div');
    viewer.className = 'zine-viewer';
    viewer.innerHTML = `
      <embed src="" type="application/pdf">
      <div class="zine-viewer-note">
        If the reader doesn't load on your phone, use the download link
        for that part instead — some mobile browsers don't preview PDFs inline.
      </div>
    `;

    zine.parts.forEach((part) => {
      const btn = document.createElement('button');
      btn.textContent = 'Read ' + part.label;
      btn.onclick = () => {
        partsRow.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        viewer.querySelector('embed').src = part.file;
        viewer.classList.add('show');
      };
      partsRow.appendChild(btn);
    });

    const dl = document.createElement('a');
    dl.className = 'download';
    dl.href = zine.parts[0].file;
    dl.download = '';
    dl.textContent = 'Download';
    partsRow.appendChild(dl);

    wrap.appendChild(partsRow);
    wrap.appendChild(viewer);
    zineList.appendChild(wrap);
  });
</script>

</body>
</html>
