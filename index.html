<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NOCIV.CO — Nothing Of Civilization</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Nociv Enterprise — representing Black America, no ads, no algorithm, just being human. Buy. Build. Share.">
<link rel="stylesheet" href="style.css?v=3.0">
<style>
  /* Wall-to-wall banner for Arizona landing graphic */
  .landing-banner-full {
    width: 100%;
    margin: 0 auto;
  }
  .landing-banner-full img {
    width: 100%;
    display: block;
    height: auto;
  }

  /* Centered notebook graphic container */
  .landing-notebook {
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 20px 10px;
  }
  .landing-notebook img {
    width: 100%;
    display: block;
    height: auto;
  }

  .landing-about {
    max-width: 300px;
    margin: 20px auto 30px;
    padding: 0 20px;
    text-align: center;
  }
  .landing-about a {
    display: block;
    background: var(--grey-dark, #444);
    color: var(--white, #f2f2f2);
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-size: 0.85rem;
    padding: 14px 18px;
    border: 1px solid #333;
    transition: background 0.15s ease;
  }
  .landing-about a:hover {
    background: var(--gold, #d1a13e);
    color: #1a1a1a;
  }
</style>
</head>
<body>

<header class="nociv-header">
  <img class="torn-header-img" src="header.png" alt="NOCIV.CO — Nothing Of Civilization">
</header>

<!-- Main Nav matching your repository image tab assets -->
<nav class="tabs">
  <a href="about.html" class="img-tab"><img src="nav-about.png" alt="About"></a>
  <a href="shop.html" class="img-tab"><img src="nav-clothing.png" alt="Shop"></a>
  <a href="creator-tools.html" class="img-tab"><img src="nav-tech.png" alt="Tools"></a>
  <a href="community.html" class="img-tab"><img src="community-button.png" alt="Community"></a>
</nav>

<!-- Wall-to-Wall Arizona Graphic Banner -->
<div class="landing-banner-full">
  <img src="arizona-based.png" alt="Arizona Based Creator Brand That Uses Digital Space to Set The Condition for Physical Reality.">
</div>

<!-- Centered Buy/Build/Share Graphic -->
<div class="landing-notebook">
  <img src="buy-build-share.png" alt="Buy. Build. Share. Representing Black America. No socials, algorithm, or ads, just being human.">
</div>

<div class="landing-about">
  <a href="about.html">About</a>
</div>

<footer class="nociv-footer">NOCIV.CO — Nothing Of Civilization</footer>

<script src="supabase.js"></script>

</body>
</html>
