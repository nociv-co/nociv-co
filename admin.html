<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin — NOCIV.CO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<style>
  .admin-wrap { max-width: 700px; margin: 0 auto; padding: 30px 20px 60px; }
  .admin-login {
    max-width: 360px; margin: 60px auto; padding: 28px;
    background: rgba(255,255,255,0.55); backdrop-filter: blur(6px);
    border: 1px solid rgba(0,0,0,0.08); border-radius: 10px;
  }
  .admin-login input {
    width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #999; font-size: 1rem;
    box-sizing: border-box;
  }
  .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .logout-btn {
    background: none; border: 1px solid var(--grey-dark); color: var(--ink);
    padding: 8px 14px; font-size: 0.8rem; cursor: pointer; letter-spacing: 0.03em;
  }
  .admin-form {
    border: 1px solid rgba(0,0,0,0.08); padding: 20px; margin-bottom: 40px;
    background: rgba(255,255,255,0.55); backdrop-filter: blur(6px); border-radius: 10px;
  }
  .admin-form label { display: block; font-size: 0.8rem; opacity: .7; margin: 12px 0 4px; }
  .admin-form input, .admin-form select {
    width: 100%; padding: 10px; border: 1px solid #999; font-size: 1rem; box-sizing: border-box;
  }
  .admin-form-row { display: flex; gap: 12px; }
  .admin-form-row > div { flex: 1; }
  .admin-submit {
    width: 100%; margin-top: 16px; background: var(--red); color: #fff; border: none;
    padding: 12px; font-weight: 900; letter-spacing: 0.05em; text-transform: uppercase; cursor: pointer;
  }
  .admin-error { color: var(--red); font-size: 0.85rem; margin-top: 8px; display: none; }
  .admin-note { color: var(--green); font-size: 0.85rem; margin-top: 8px; display: none; }

  .product-row {
    display: flex; align-items: center; gap: 14px; border: 1px solid #ccc;
    padding: 12px; margin-bottom: 10px; background: #fff;
  }
  .product-row img { width: 56px; height: 56px; object-fit: cover; border: 1px solid #ccc; }
  .product-row .no-img {
    width: 56px; height: 56px; background: #eee; border: 1px solid #ccc;
    display: flex; align-items: center; justify-content: center; font-size: 0.6rem; opacity: .5; text-align: center;
  }
  .product-row .info { flex: 1; }
  .product-row .name { font-weight: 700; }
  .product-row .meta { font-size: 0.8rem; opacity: .7; }
  .product-row .votes { font-size: 0.8rem; font-weight: 700; color: var(--gold); }
  .product-row .del-btn {
    background: none; border: 1px solid var(--red); color: var(--red);
    padding: 6px 10px; font-size: 0.75rem; cursor: pointer;
  }
  .product-row .edit-btn {
    background: none; border: 1px solid var(--grey-dark); color: var(--ink);
    padding: 6px 10px; font-size: 0.75rem; cursor: pointer; margin-right: 6px;
  }
</style>
</head>
<body>

<header class="nociv-header">
  <a href="index.html"><img class="torn-header-img" src="header.png" alt="NOCIV.CO — Nothing Of Civilization"></a>
</header>

<div class="admin-wrap">

  <!-- LOGIN -->
  <div id="loginBox" class="admin-login">
    <h2 style="text-align:center;">Admin Login</h2>
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPassword" placeholder="Password">
    <button class="admin-submit" id="loginBtn">Log In</button>
    <p class="admin-error" id="loginError">Wrong email or password.</p>
  </div>

  <!-- DASHBOARD (hidden until logged in) -->
  <div id="dashboard" style="display:none;">
    <div class="admin-header">
      <h2 style="margin:0;">Product Dashboard</h2>
      <button class="logout-btn" id="logoutBtn">Log Out</button>
    </div>

    <div class="admin-form">
      <h3 style="margin-top:0;">Add a Product</h3>
      <label for="pName">Name</label>
      <input type="text" id="pName" placeholder="e.g. Ash Grey Tee">

      <div class="admin-form-row">
        <div>
          <label for="pPrice">Price ($, leave blank if unknown yet)</label>
          <input type="number" id="pPrice" step="0.01" placeholder="28.00">
        </div>
        <div>
          <label for="pCost">Your cost ($ — private, never shown publicly)</label>
          <input type="number" id="pCost" step="0.01" placeholder="11.00">
        </div>
      </div>

      <div class="admin-form-row">
        <div>
          <label for="pShop">Shop (which tab it shows on)</label>
          <select id="pShop">
            <option value="clothing">Clothing</option>
            <option value="tech">Tech</option>
            <option value="zines">Zines</option>
            <option value="art">Art</option>
          </select>
        </div>
        <div>
          <label for="pCategory">Category (type anything — new ones save automatically)</label>
          <input type="text" id="pCategory" list="categoryOptions" placeholder="e.g. Patches">
          <datalist id="categoryOptions"></datalist>
        </div>
      </div>

      <div class="admin-form-row">
        <div>
          <label for="pStatus">Status</label>
          <select id="pStatus">
            <option value="for_sale">For Sale</option>
            <option value="coming_soon">Coming Soon</option>
          </select>
        </div>
        <div>
          <label for="pInventory">Starting inventory (optional)</label>
          <input type="number" id="pInventory" min="0" placeholder="e.g. 5">
        </div>
      </div>

      <div class="admin-form-row">
        <div>
          <label for="pFulfillment">Fulfillment</label>
          <select id="pFulfillment">
            <option value="in_house">In-House (you make/ship it)</option>
            <option value="prodigi">Prodigi Print-on-Demand</option>
          </select>
        </div>
        <div id="prodigiSkuWrap" style="display:none;">
          <label for="pProdigiSku">Prodigi SKU (look this up on prodigi.com for the exact product)</label>
          <input type="text" id="pProdigiSku" placeholder="e.g. GLOBAL-CAN-16x20">
        </div>
      </div>

      <label for="pImage">Photo — upload a file...</label>
      <input type="file" id="pImage" accept="image/*">

      <label for="pImageUrl" style="margin-top:10px;">...or paste an image link instead (e.g. from Prodigi's Image Library) — skip the upload above if you use this</label>
      <input type="text" id="pImageUrl" placeholder="https://...">

      <button class="admin-submit" id="addProductBtn">Add Product</button>
      <p class="admin-note" id="addConfirm">Product added.</p>
      <p class="admin-error" id="addError"></p>
    </div>

    <h3>Your Products</h3>
    <div class="cat-pill-row" id="shopFilterRow" style="margin-bottom:16px;">
      <button class="cat-pill active" data-shop="all">All</button>
      <button class="cat-pill" data-shop="clothing">Clothing</button>
      <button class="cat-pill" data-shop="tech">Tech</button>
      <button class="cat-pill" data-shop="zines">Zines</button>
      <button class="cat-pill" data-shop="art">Art</button>
    </div>
    <div id="productList"></div>

    <h3 style="margin-top:40px;">Recent Orders</h3>
    <div id="orderList"></div>

    <h3 style="margin-top:40px;">Process Album (the "making of" photo gallery on Shop)</h3>
    <div class="admin-form">
      <label for="albumImage">Add a photo</label>
      <input type="file" id="albumImage" accept="image/*">
      <label for="albumCaption">Caption (optional)</label>
      <input type="text" id="albumCaption" placeholder="e.g. Cutting the first pattern piece">
      <button class="admin-submit" id="addAlbumBtn">Add to Album</button>
      <p class="admin-note" id="albumAddConfirm">Added.</p>
      <p class="admin-error" id="albumAddError"></p>
    </div>
    <div id="albumList"></div>
  </div>

</div>

<footer class="nociv-footer">NOCIV.CO — Nothing Of Civilization</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
  const loginBox = document.getElementById('loginBox');
  const dashboard = document.getElementById('dashboard');

  // ===== AUTH =====
  async function checkSession() {
    const { data } = await supabaseClient.auth.getSession();
    if (data.session) {
      loginBox.style.display = 'none';
      dashboard.style.display = 'block';
      loadProducts();
      loadOrders();
      loadAlbum();
    } else {
      loginBox.style.display = 'block';
      dashboard.style.display = 'none';
    }
  }
  checkSession();

  document.getElementById('loginBtn').onclick = async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    const errEl = document.getElementById('loginError');
    if (error) {
      errEl.textContent = error.message;
      errEl.style.display = 'block';
      return;
    }
    errEl.style.display = 'none';
    await checkSession();
  };

  document.getElementById('logoutBtn').onclick = async () => {
    await supabaseClient.auth.signOut();
    await checkSession();
  };

  // ===== ADD PRODUCT (with optional image upload) =====
  document.getElementById('pFulfillment').addEventListener('change', (e) => {
    document.getElementById('prodigiSkuWrap').style.display = e.target.value === 'prodigi' ? 'block' : 'none';
  });

  document.getElementById('addProductBtn').onclick = async () => {
    const name = document.getElementById('pName').value.trim();
    const priceVal = document.getElementById('pPrice').value;
    const costVal = document.getElementById('pCost').value;
    const inventoryVal = document.getElementById('pInventory').value;
    const shop = document.getElementById('pShop').value;
    const category = document.getElementById('pCategory').value.trim();
    const status = document.getElementById('pStatus').value;
    const fulfillment_type = document.getElementById('pFulfillment').value;
    const prodigi_sku = document.getElementById('pProdigiSku').value.trim() || null;
    const file = document.getElementById('pImage').files[0];
    const imageUrlInput = document.getElementById('pImageUrl').value.trim();
    const errEl = document.getElementById('addError');
    const confirmEl = document.getElementById('addConfirm');
    errEl.style.display = 'none';
    confirmEl.style.display = 'none';

    if (!name) { errEl.textContent = 'Name is required.'; errEl.style.display = 'block'; return; }
    if (!category) { errEl.textContent = 'Category is required.'; errEl.style.display = 'block'; return; }
    if (fulfillment_type === 'prodigi' && !prodigi_sku) {
      errEl.textContent = 'Prodigi SKU is required for print-on-demand items.';
      errEl.style.display = 'block';
      return;
    }

    let image_url = null;
    if (imageUrlInput) {
      // A pasted link takes priority — skip the upload entirely
      image_url = imageUrlInput;
    } else if (file) {
      const fileName = `${Date.now()}-${file.name.replace(/\s+/g, '-')}`;
      const { error: uploadError } = await supabaseClient.storage
        .from('product-images')
        .upload(fileName, file);
      if (uploadError) {
        errEl.textContent = 'Image upload failed: ' + uploadError.message;
        errEl.style.display = 'block';
        return;
      }
      const { data: urlData } = supabaseClient.storage.from('product-images').getPublicUrl(fileName);
      image_url = urlData.publicUrl;
    }

    const { error } = await supabaseClient.from('products').insert([{
      name,
      price: priceVal ? parseFloat(priceVal) : null,
      cost: costVal ? parseFloat(costVal) : null,
      inventory_count: fulfillment_type === 'prodigi' ? null : (inventoryVal ? parseInt(inventoryVal) : null),
      shop,
      category,
      status,
      fulfillment_type,
      prodigi_sku,
      image_url
    }]);

    if (error) {
      errEl.textContent = 'Error saving: ' + error.message;
      errEl.style.display = 'block';
      return;
    }

    document.getElementById('pName').value = '';
    document.getElementById('pPrice').value = '';
    document.getElementById('pCost').value = '';
    document.getElementById('pInventory').value = '';
    document.getElementById('pCategory').value = '';
    document.getElementById('pProdigiSku').value = '';
    document.getElementById('pImage').value = '';
    document.getElementById('pImageUrl').value = '';
    confirmEl.style.display = 'block';
    setTimeout(() => { confirmEl.style.display = 'none'; }, 3000);
    await loadCategoryOptions();
    await loadProducts();
  };

  // Autocomplete: every category that already exists, across all shops
  async function loadCategoryOptions() {
    const { data } = await supabaseClient.from('products').select('category');
    const unique = [...new Set((data || []).map(p => p.category).filter(Boolean))];
    const datalist = document.getElementById('categoryOptions');
    datalist.innerHTML = unique.map(c => `<option value="${c}">`).join('');
  }
  loadCategoryOptions();

  // ===== SHOP FILTER TOGGLE =====
  let activeShopFilter = 'all';
  document.querySelectorAll('#shopFilterRow .cat-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#shopFilterRow .cat-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeShopFilter = btn.dataset.shop;
      loadProducts();
    });
  });

  // ===== PRODUCT LIST + VOTE ANALYTICS =====
  async function loadProducts() {
    const listEl = document.getElementById('productList');
    listEl.innerHTML = '<p style="opacity:.5;">Loading...</p>';

    let query = supabaseClient.from('products').select('*').order('created_at', { ascending: false });
    if (activeShopFilter !== 'all') query = query.eq('shop', activeShopFilter);

    const { data: products, error } = await query;

    if (error || !products) {
      listEl.innerHTML = '<p style="opacity:.5;">Could not load products.</p>';
      return;
    }

    const { data: votes } = await supabaseClient.from('product_votes').select('product_id');
    const voteCounts = {};
    (votes || []).forEach(v => { voteCounts[v.product_id] = (voteCounts[v.product_id] || 0) + 1; });

    listEl.innerHTML = '';
    if (products.length === 0) {
      listEl.innerHTML = '<p style="opacity:.5;">Nothing in this shop yet.</p>';
      return;
    }
    products.forEach(p => {
      const row = document.createElement('div');
      row.className = 'product-row';
      row.dataset.id = p.id;
      renderRowView(row, p, voteCounts[p.id] || 0);
      listEl.appendChild(row);
    });
  }

  function renderRowView(row, p, voteCount) {
    const imgHtml = p.image_url
      ? `<img src="${p.image_url}" alt="${p.name}">`
      : `<div class="no-img">no photo</div>`;
    row.innerHTML = `
      ${imgHtml}
      <div class="info">
        <div class="name">${p.name}</div>
        <div class="meta">${p.shop} · ${p.category} · ${p.status === 'for_sale' ? 'For Sale' : 'Coming Soon'} · ${p.price ? '$' + p.price : 'no price set'} · cost $${p.cost ?? '—'} · stock: ${p.fulfillment_type === 'prodigi' ? 'unlimited (Prodigi)' : (p.inventory_count ?? 'not tracked')} · ${p.fulfillment_type === 'prodigi' ? 'Prodigi SKU: ' + (p.prodigi_sku || 'none set') : 'In-House'}</div>
        <div class="votes">${voteCount} votes</div>
      </div>
      <button class="edit-btn" data-id="${p.id}">Edit</button>
      <button class="del-btn" data-id="${p.id}">Delete</button>
    `;

    row.querySelector('.del-btn').addEventListener('click', async () => {
      if (!confirm('Delete this product?')) return;
      await supabaseClient.from('products').delete().eq('id', p.id);
      await loadProducts();
    });

    row.querySelector('.edit-btn').addEventListener('click', () => {
      renderRowEdit(row, p);
    });
  }

  function renderRowEdit(row, p) {
    row.innerHTML = `
      <div class="info" style="width:100%;">
        <label style="font-size:0.75rem; opacity:.7; display:block; margin-bottom:2px;">Name</label>
        <input type="text" class="edit-name" value="${p.name}" style="width:100%; margin-bottom:8px; padding:6px;">
        <div style="display:flex; gap:8px; margin-bottom:8px;">
          <div style="flex:1;">
            <label style="font-size:0.75rem; opacity:.7; display:block;">Price</label>
            <input type="number" step="0.01" class="edit-price" value="${p.price ?? ''}" style="width:100%; padding:6px;">
          </div>
          <div style="flex:1;">
            <label style="font-size:0.75rem; opacity:.7; display:block;">Cost</label>
            <input type="number" step="0.01" class="edit-cost" value="${p.cost ?? ''}" style="width:100%; padding:6px;">
          </div>
          <div style="flex:1;">
            <label style="font-size:0.75rem; opacity:.7; display:block;">Stock</label>
            <input type="number" class="edit-inventory" value="${p.inventory_count ?? ''}" style="width:100%; padding:6px;">
          </div>
        </div>
        <div style="display:flex; gap:8px; margin-bottom:10px;">
          <select class="edit-shop" style="flex:1; padding:6px;">
            <option value="clothing" ${p.shop === 'clothing' ? 'selected' : ''}>Clothing</option>
            <option value="tech" ${p.shop === 'tech' ? 'selected' : ''}>Tech</option>
            <option value="zines" ${p.shop === 'zines' ? 'selected' : ''}>Zines</option>
            <option value="art" ${p.shop === 'art' ? 'selected' : ''}>Art</option>
          </select>
          <input type="text" class="edit-category" list="categoryOptions" value="${p.category}" style="flex:1; padding:6px;">
          <select class="edit-status" style="flex:1; padding:6px;">
            <option value="for_sale" ${p.status === 'for_sale' ? 'selected' : ''}>For Sale</option>
            <option value="coming_soon" ${p.status === 'coming_soon' ? 'selected' : ''}>Coming Soon</option>
          </select>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="save-edit-btn" style="flex:1; background:var(--red); color:#fff; border:none; padding:8px; cursor:pointer;">Save</button>
          <button class="cancel-edit-btn" style="flex:1; background:#eee; border:1px solid #ccc; padding:8px; cursor:pointer;">Cancel</button>
        </div>
      </div>
    `;

    row.querySelector('.cancel-edit-btn').addEventListener('click', () => loadProducts());

    row.querySelector('.save-edit-btn').addEventListener('click', async () => {
      const updated = {
        name: row.querySelector('.edit-name').value.trim(),
        price: row.querySelector('.edit-price').value ? parseFloat(row.querySelector('.edit-price').value) : null,
        cost: row.querySelector('.edit-cost').value ? parseFloat(row.querySelector('.edit-cost').value) : null,
        inventory_count: row.querySelector('.edit-inventory').value ? parseInt(row.querySelector('.edit-inventory').value) : null,
        shop: row.querySelector('.edit-shop').value,
        category: row.querySelector('.edit-category').value.trim(),
        status: row.querySelector('.edit-status').value,
      };
      const { error } = await supabaseClient.from('products').update(updated).eq('id', p.id);
      if (error) { alert('Error saving: ' + error.message); return; }
      await loadProducts();
    });
  }

  // ===== ORDERS =====
  async function loadOrders() {
    const orderListEl = document.getElementById('orderList');
    orderListEl.innerHTML = '<p style="opacity:.5;">Loading...</p>';

    const { data: orders, error } = await supabaseClient
      .from('orders')
      .select('*, products(name)')
      .order('created_at', { ascending: false });

    if (error || !orders || orders.length === 0) {
      orderListEl.innerHTML = '<p style="opacity:.5;">No orders yet.</p>';
      return;
    }

    orderListEl.innerHTML = '';
    orders.forEach(o => {
      const row = document.createElement('div');
      row.className = 'product-row';
      row.innerHTML = `
        <div class="info">
          <div class="name">${o.products?.name || 'Product #' + o.product_id}</div>
          <div class="meta">$${o.amount_paid ?? '—'} · ${o.customer_email || 'no email'} · ${new Date(o.created_at).toLocaleString()}</div>
        </div>
      `;
      orderListEl.appendChild(row);
    });
  }

  // ===== PROCESS ALBUM =====
  document.getElementById('addAlbumBtn').onclick = async () => {
    const file = document.getElementById('albumImage').files[0];
    const caption = document.getElementById('albumCaption').value.trim() || null;
    const errEl = document.getElementById('albumAddError');
    const confirmEl = document.getElementById('albumAddConfirm');
    errEl.style.display = 'none';
    confirmEl.style.display = 'none';

    if (!file) { errEl.textContent = 'Choose a photo first.'; errEl.style.display = 'block'; return; }

    const fileName = `${Date.now()}-${file.name.replace(/\s+/g, '-')}`;
    const { error: uploadError } = await supabaseClient.storage
      .from('album-photos')
      .upload(fileName, file);
    if (uploadError) {
      errEl.textContent = 'Upload failed: ' + uploadError.message;
      errEl.style.display = 'block';
      return;
    }
    const { data: urlData } = supabaseClient.storage.from('album-photos').getPublicUrl(fileName);

    const { error } = await supabaseClient.from('album_photos').insert([{
      image_url: urlData.publicUrl,
      caption
    }]);
    if (error) {
      errEl.textContent = 'Error saving: ' + error.message;
      errEl.style.display = 'block';
      return;
    }

    document.getElementById('albumImage').value = '';
    document.getElementById('albumCaption').value = '';
    confirmEl.style.display = 'block';
    setTimeout(() => { confirmEl.style.display = 'none'; }, 3000);
    await loadAlbum();
  };

  async function loadAlbum() {
    const listEl = document.getElementById('albumList');
    listEl.innerHTML = '<p style="opacity:.5;">Loading...</p>';

    const { data: photos, error } = await supabaseClient
      .from('album_photos')
      .select('*')
      .order('created_at', { ascending: false });

    if (error || !photos || photos.length === 0) {
      listEl.innerHTML = '<p style="opacity:.5;">No photos yet.</p>';
      return;
    }

    listEl.innerHTML = '';
    photos.forEach(p => {
      const row = document.createElement('div');
      row.className = 'product-row';
      row.innerHTML = `
        <img src="${p.image_url}" alt="${p.caption || 'Process photo'}">
        <div class="info">
          <div class="name">${p.caption || '(no caption)'}</div>
          <div class="meta">${new Date(p.created_at).toLocaleDateString()}</div>
        </div>
        <button class="del-btn" data-id="${p.id}">Delete</button>
      `;
      row.querySelector('.del-btn').addEventListener('click', async () => {
        if (!confirm('Delete this photo?')) return;
        await supabaseClient.from('album_photos').delete().eq('id', p.id);
        await loadAlbum();
      });
      listEl.appendChild(row);
    });
  }
</script>

</body>
</html>
