<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clothing — NOCIV.CO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<style>
  .flip-wrap {
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    align-items: start;
  }
  @media (max-width: 640px) {
    .flip-wrap { grid-template-columns: 1fr; }
  }

  /* --- Photo album, plug-and-play --- */
  .album {
    position: relative;
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    aspect-ratio: 1229 / 1513;
  }
  .album-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    user-select: none;
  }
  .album-slot {
    position: absolute;
    object-fit: cover;
    display: none;
  }
  .album-slot.show { display: block; }

  .flip-nav {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin: 16px 0 30px;
  }
  .flip-nav button {
    background: none;
    border: none;
    font-size: 1.4rem;
    cursor: pointer;
    opacity: 0.5;
  }
  .flip-nav button:hover { opacity: 1; }
  .popup-note {
    background: var(--gold);
    color: #1a1a1a;
    padding: 14px;
    font-size: 0.85rem;
    text-align: center;
    margin: 20px 0;
  }
  #signupForm input {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    border: 1px solid #999;
    font-size: 1rem;
  }
  #signupForm button {
    width: 100%;
    padding: 12px;
    background: var(--black);
    color: var(--white);
    border: none;
    font-weight: 700;
    letter-spacing: 0.05em;
    cursor: pointer;
  }
  .vinted-link {
    display: block;
    background: var(--black);
    color: var(--white);
    text-align: center;
    padding: 16px;
    font-weight: 700;
    letter-spacing: 0.05em;
    margin-top: 30px;
  }
</style>
</head>
<body>

<header class="nociv-header">
  <a href="index.html"><img class="torn-header-img" src="header.png" alt="NOCIV.CO — Nothing Of Civilization"></a>
</header>

<nav class="tabs">
  <a href="about.html" class="img-tab"><img src="nav-about.png" alt="About"></a>
  <a href="clothing.html" class="img-tab active"><img src="nav-clothing.png" alt="Clothing"></a>
  <a href="tech.html" class="img-tab"><img src="nav-tech.png" alt="Tech"></a>
  <a href="books.html" class="img-tab"><img src="nav-books.png" alt="Books"></a>
  <a href="community.html" class="img-tab"><img src="community button.PNG" alt="Community"></a>
</nav>

<div class="wrap">

  <div class="flip-wrap">

    <!-- Photo album card -->
    <div>
      <div class="album" id="albumEl">
        <img class="album-bg" id="albumBg" src="photo gallery closed.PNG" alt="Nociv photo album">
        <img class="album-slot" id="slotA" alt="">
        <img class="album-slot" id="slotB" alt="">
      </div>
      <div class="flip-nav">
        <button id="prevPhoto" aria-label="Previous">&#8592;</button>
        <button id="nextPhoto" aria-label="Next">&#8594;</button>
      </div>
    </div>

    <!-- Pop-up shop card -->
    <div>
      <img class="popup-card-img" src="pop-up-shop.png" alt="Pop-up shop — posting soon">

      <div class="popup-note">
        Enter your email or phone # to get notified of next location & time. Nothing else.
      </div>

      <form id="signupForm">
        <input type="text" placeholder="Email or phone number" required>
        <button type="submit" class="join-btn-img" style="padding:0; border:none; background:none;">
          <img src="join-button.png" alt="Join List" style="width:100%;">
        </button>
      </form>
      <p id="signupConfirm" style="display:none; text-align:center; color:var(--green); font-weight:700;">
        You're on the list.
      </p>

      <div style="margin-top:20px; font-size:0.9rem;">
        <strong>Next Location:</strong> TBD<br>
        <strong>Date:</strong> TBD<br>
        <strong>Time:</strong> TBD
      </div>
    </div>

  </div>

  <a class="vinted-link" href="#" target="_blank" rel="noopener">Vinted Online Store →</a>


</div>

<footer class="nociv-footer">NOCIV.CO — Nothing Of Civilization</footer>

<script>
  // ===== PHOTO ALBUM — plug and play =====
  // Drop your garment photo URLs in here, two per page.
  // Add more pages by copying the { bg, slots: [...] } pattern below.
  const albumPages = [
    { bg: "photo gallery closed.PNG", slots: [] }, // closed cover, no photos
    {
      bg: "photo ablum flipped 1.PNG",
      slots: [
        { src: "", left: "27.42%", top: "12.75%", width: "49.15%", height: "23.66%" },
        { src: "", left: "27.42%", top: "53.40%", width: "49.15%", height: "23.66%" }
      ]
    },
    {
      bg: "photo album flip 2.PNG",
      slots: [
        { src: "", left: "23.35%", top: "12.75%", width: "49.15%", height: "23.66%" },
        { src: "", left: "23.35%", top: "53.40%", width: "49.15%", height: "23.66%" }
      ]
    }
  ];
  // ========================================

  let pageIdx = 0;
  const albumBg = document.getElementById('albumBg');
  const slotEls = [document.getElementById('slotA'), document.getElementById('slotB')];

  function renderAlbum() {
    const page = albumPages[pageIdx];
    albumBg.src = page.bg;
    slotEls.forEach((el, i) => {
      const slot = page.slots[i];
      if (slot && slot.src) {
        el.src = slot.src;
        el.style.left = slot.left;
        el.style.top = slot.top;
        el.style.width = slot.width;
        el.style.height = slot.height;
        el.classList.add('show');
      } else {
        el.classList.remove('show');
      }
    });
  }
  document.getElementById('nextPhoto').onclick = () => {
    pageIdx = (pageIdx + 1) % albumPages.length;
    renderAlbum();
  };
  document.getElementById('prevPhoto').onclick = () => {
    pageIdx = (pageIdx - 1 + albumPages.length) % albumPages.length;
    renderAlbum();
  };
  renderAlbum();

  document.getElementById('signupForm').addEventListener('submit', function(e){
    e.preventDefault();
    // TODO: wire this to your actual mailing list service (e.g. Mailchimp, Buttondown)
    const btn = this.querySelector('.join-btn-img');
    btn.classList.add('clicked');
    document.getElementById('signupConfirm').style.display = 'block';
    this.querySelector('input').disabled = true;
  });
</script>

</body>
</html>
