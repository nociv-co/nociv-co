<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>NOCIV Phone Test</title>
<style>
  @font-face { font-family: 'Anton'; src: url('fonts/anton.woff') format('woff'); font-display: swap; }
  :root { --ink:#1d1c1a; --paper:#f6eedb; --note:#f2ecd6; --red:#c8412f; --green:#3c6b4a; --line:#d9d3c4; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: -apple-system, system-ui, 'Helvetica Neue', Arial, sans-serif; }
  body { padding: 16px 16px calc(40px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  h1 { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; font-weight: 900; font-size: 2.1rem; letter-spacing: .02em; text-transform: uppercase; margin: 8px 0 4px; line-height: 1; }
  .lede { margin: 0 0 14px; font-size: .95rem; line-height: 1.4; }
  .bar { height: 10px; background: var(--line); margin: 6px 0 4px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .25s; }
  .count { font-size: .8rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 14px; }
  .t { position: relative; background: var(--note); border: 2px solid var(--ink); padding: 18px 14px 14px; margin: 0 0 14px; }
  .t::before { content: ''; position: absolute; top: -9px; left: 50%; width: 64px; height: 14px; margin-left: -32px; background: var(--ink); }
  .t.pass { border-color: var(--green); } .t.fail { border-color: var(--red); }
  .t h2 { margin: 0 0 2px; font-size: 1.05rem; }
  .where { font-size: .78rem; opacity: .7; margin: 0 0 8px; }
  ol { margin: 0 0 10px; padding-left: 22px; font-size: .92rem; line-height: 1.45; }
  .expect { font-size: .9rem; margin: 0 0 12px; padding: 8px 10px; background: #fff; border: 1.5px solid var(--ink); }
  .expect b { text-transform: uppercase; font-size: .7rem; letter-spacing: .08em; display: block; margin-bottom: 2px; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button { font: inherit; font-weight: 900; letter-spacing: .05em; text-transform: uppercase; font-size: .85rem; padding: 14px 8px; border: 2px solid var(--ink); background: #fff; color: var(--ink); cursor: pointer; border-radius: 0; }
  button:active { transform: scale(.98); }
  .ok.on { background: var(--green); color: #fff; border-color: var(--green); }
  .no.on { background: var(--red); color: #fff; border-color: var(--red); }
  textarea { width: 100%; margin-top: 8px; font: inherit; font-size: 16px; padding: 10px; border: 2px solid var(--ink); background: #fff; border-radius: 0; min-height: 70px; display: none; }
  .fail textarea { display: block; }
  .big { width: 100%; background: var(--red); color: #fff; border-color: var(--red); padding: 16px; font-size: .95rem; margin-top: 4px; }
  .ghost { width: 100%; margin-top: 10px; }
  .msg { font-size: .85rem; margin: 8px 0 0; min-height: 1.2em; font-weight: 700; }
  .ver { font-size: .72rem; opacity: .6; margin-top: 18px; }
</style>
</head>
<body>
<h1>Phone test</h1>
<p class="lede">Open each link on your phone, do the steps, then tap Works or Broken. When you are done, tap Copy my results and paste it to the team. Your answers are saved on this phone.</p>
<div class="bar"><i id="barFill"></i></div>
<div class="count" id="count"></div>
<div id="list"></div>
<button class="big" id="copy" type="button">Copy my results</button>
<button class="ghost" id="reset" type="button">Start over</button>
<p class="msg" id="msg" role="status"></p>
<p class="ver" id="ver"></p>

<script>
// ===== THE TEST LIST. Claude rewrites this block after every delivery. Keep each test to a few taps. =====
var BATCH = '2026-11-03 from scratch';
var TESTS = [
  { id: 'fsstart', title: 'From Scratch: pick on the landing, Studio opens on Look, no pop up', where: 'nociv.co/scratch',
    steps: ['Tap Archive. Pick Producer.', 'In the Studio check the tabs. Tap Shuffle once.', 'Tap back, pick Shop.', 'Tap back, Archive, Producer again.'],
    expect: 'Archive opens a small Finds / Producer / Log choice right on the landing page. The Studio has only Look, Pages, Info (no Start, no numbers, no repeated heading). No pop up ever asks to replace your site. Your Shop and your Producer site each keep their own work, so going back to Producer shows your shuffled look.' },
  { id: 'stencillock', title: 'Stencil + Halftone: tabs on top of the console, small console, big picture', where: 'Tools, Stencil + Halftone',
    steps: ['Close the site fully and reopen it once (new version).', 'Load the Sample. In Start, Photo, tap Halftone.', 'Tap Start, Ink, Dots, Print on the bottom bar.', 'In each step tap every tab across the top of the console.', 'In Dots tap Style, then Ellipse and Grain.', 'Tap ? (top right of the console).'],
    expect: 'The picture is big and stays the same size on every step. The console is short and never changes size. Its top row is the tabs for that step (symbol over a word, picked one is black), with i and ? at the end. No card inside a card. Nothing scrolls. Dot styles are 6 name buttons with one picture of the picked style under them. ? opens Learn on Make a screen.' },
  { id: 'stencilmix', title: 'Stencil + Halftone: Mix (stencil and dots together)', where: 'Tools, Stencil + Halftone',
    steps: ['Load the Sample. Tap Mix on the bottom bar.', 'In Looks tap Red shadow, then Ghost, then Misprint.', 'Tap Move. Drag your finger on the picture, then drag the red dot in the square. Tap 45, then XL.', 'Tap Layers: make Layer 2 blue, Paper Cream.', 'Tap Save, Make my files, then Save Mix picture and Save Screen A.', 'Tap Print on the bottom bar.'],
    expect: 'Mix is in both Stencil and Halftone. Each look changes the picture right away. Dragging slides the second layer and it stays where you let go. The Save buttons open the share sheet with a PNG. Screen A and B are black on white and line up the way you slid them. Going to Print shows your normal stencil or halftone again.' },
  { id: 'stencilcrop', title: 'Stencil + Halftone: knobs and crop', where: 'Tools, Stencil + Halftone',
    steps: ['Choose a photo. In the crop screen pick Free, then 4:5, drag a corner, tap Done.', 'Tap Halftone, then Dots, then the sun symbol. Turn Contrast by dragging up. Double tap it.'],
    expect: 'Crop shows the photo with its real shape and every crop shape button fits. Knobs turn and the picture updates; double tap puts a knob back.' },
  { id: 'fseditor', title: 'From Scratch: tap to select, Layers, Insert, Publish', where: 'nociv.co/scratch/studio.html',
    steps: ['Tap a product in the preview.', 'Tap the play button at the top, tap a product, then tap the arrow.', 'Open Layers and tap a product under Shop.', 'Open Insert and add a Log page. Tap Publish (top right).'],
    expect: 'Tapping in the preview draws a red box with a name tag and opens that thing\'s settings below. Play mode lets you click around like a visitor. Layers shows every page with its items nested under it. Insert adds pages. Publish opens the checklist and download.' },
  { id: 'fsarchive', title: 'From Scratch: Archive versions and real fonts', where: 'nociv.co/scratch/studio.html, Insert',
    steps: ['Under Archive tap Finds, then Producer, then Log.', 'In Producer, open a beat and add a short mp3. Tap play in the preview.', 'In Design, Fine tune, Type: try Space Grotesk, Syne and Special Elite.'],
    expect: 'Finds is a numbered collage with "via site" links. Producer is a list with round play buttons and Buy $ buttons. Log is a dated timeline. The real fonts change the headings right away.' },
  { id: 'fslooks', title: 'From Scratch: 30 looks, Shuffle, 8 starts', where: 'nociv.co/scratch/studio.html',
    steps: ['Open Look. Tap Street, then Stencil.', 'Tap Shuffle three times, then Undo last look.', 'Open Start and pick Music, then Food.'],
    expect: 'Each look changes colors, type, buttons and background in the preview while every page and word stays. Shuffle always gives readable text. Music and Food load full starter sites.' },
  { id: 'advhelp', title: 'Back and help on Case Zero and From Scratch', where: 'nociv.co/casezero, the Builder, nociv.co/scratch, the Studio',
    steps: ['On each page tap the ? button, read, tap Done.', 'Tap Back.'],
    expect: 'A cream help sheet slides up with numbered steps. Back goes one level up: Case Zero and From Scratch go to Tools, the Builder goes to Case Zero, the Studio goes to From Scratch.' },
  { id: 'nofont', title: 'Tall poster font gone, section lines', where: 'nociv.co/about.html, Tools, Case Zero, From Scratch',
    steps: ['Open About, Philosophy.', 'Open Tools, then Case Zero and From Scratch.'],
    expect: 'Big headings use the same heavy bold letters as the Directory card name, not the tall skinny poster font. On About a thin grey line runs between sections. Nothing is cut off on the sides.' },
  { id: 'baseheading', title: 'Base: lined paper heading card', where: 'nociv.co/community.html',
    steps: ['Open Base.'],
    expect: 'The top Base card is lined paper with blue lines and a red margin line, like the About list, tape still on top.' },
  { id: 'aboutcopy', title: 'About: every page in the new voice', where: 'nociv.co/about.html',
    steps: ['Open each item on the list, using Next at the bottom.'],
    expect: 'Each page opens with one huge line (Normal was made by someone. / Pick your way in. / Arizona based. Not Arizona limited. / I make things. / Write to me.), then short plain sentences, a bold line, and small grey facts. The two bottom buttons stay on one line.' },
  { id: 'aboutlist', title: 'About: to-do list, Next and Back', where: 'nociv.co/about.html',
    steps: ['Tap the box next to Philosophy.', 'At the bottom tap Next twice.', 'Tap Back to About.', 'Tap Uncheck all under the list.'],
    expect: 'No dark bar under the tabs. Next walks Philosophy, Participate, Culture. Back to About lands on the list in one tap with those three checked. Uncheck all clears them and hides itself.' },
  { id: 'toptabs', title: 'Top tabs fit the screen', where: 'any page, for example nociv.co/shop.html',
    steps: ['Look at the About, Shop, Tools, Base tabs.'],
    expect: 'All four tabs are the same width with a little space on both sides. About does not touch the left edge and Base is not cut off on the right.' },
  { id: 'shopbar', title: 'Shop: floating section icons', where: 'nociv.co/shop.html',
    steps: ['Tap Clothing, Art, then Zines.'],
    expect: 'Three big floating icons: tee with black pants, an easel, an open zine, word under each. Not picked: grey outlines and grey word. Picked: black outlines, red fill (pants black, no seams), floats, dashed ring around the word. A thin grey line runs above the icons and a dashed grey line below. No arrow, no sentences. The right products show.' },
  { id: 'remix', title: 'Remix a look (From Scratch)', where: 'nociv.co/scratch/studio.html, Publish',
    steps: ['Make a site with your colors and pages.', 'Publish tab, tap Copy my remix link (or the share sheet opens).', 'Text the link to yourself and open it in a private Safari tab.'],
    expect: 'The private tab opens the studio with your colors, type, menu and page names, but none of your words, photos, prices or email. Its footer says Remixed from your site name.' },
  { id: 'storage', title: 'Clear unused files', where: 'Admin, Tools and Setup, Storage',
    steps: ['Open Storage.', 'Tap Delete unused files, then OK.'],
    expect: 'Before: about 566 MB used, 20 unused files about 289 MB. After: about 277 MB used, no unused files. Nothing on the site changes.' },
  { id: 'speed', title: 'Tools page loads faster', where: 'nociv.co/creator-tools.html',
    steps: ['Open Tools once, then close Safari fully.', 'Open Tools again and pull down to refresh.', 'Tap between Paper, Wear and Video.'],
    expect: 'Header and buttons show right away on the second visit. Switching categories feels instant. Header and BASE tab look the same as before.' },
  { id: 'textures', title: 'Category buttons with texture', where: 'nociv.co/creator-tools.html, Select a category',
    steps: ['Look at Paper, Wear and Video.', 'Tap each one.'],
    expect: 'Paper is graph paper, Wear is denim with orange stitching, Video is black and white TV static. Every word sits on a cream tag. Only the one you picked turns into a black tilted tag and lifts up. Nothing moves on Video.' },
  { id: 'appicons', title: 'App buttons shaped like what they make', where: 'nociv.co/creator-tools.html, Select application',
    steps: ['Tap Paper, then each app. Then Wear, then Video.'],
    expect: 'Zine is an open booklet, Cards a card, QR a code, Stencil a star cut out, Cut & Sew a T-shirt, Camera a camcorder, Cartoon a face, Billboard a sign. The one you pick fills with color (Video apps are green), floats and gets a black label. Video apps do not bob. Camera, Cartoon and Billboard previews start still with a round play bubble. Tap plays, the bubble moves to a small stop button in the corner, tap stops. A thin solid line sits under the categories. A grey dashed line sits under the apps.' },
  { id: 'footer', title: 'New simple footer', where: 'Bottom of Home, Tools and Shop',
    steps: ['Scroll to the very bottom of each page.', 'Tap Add to home screen.'],
    expect: 'A thin line, then one small quiet line and a small outline button, centered. Smaller than the page content, same color as the page above. Tapping shows the Share steps and the details.' },
  { id: 'advanced', title: 'New Advanced area', where: 'nociv.co/creator-tools.html, under the zine preview',
    steps: ['Tap anywhere on the ADVANCED line.', 'Tap Case Zero, then From Scratch.', 'Open a tool, come back.'],
    expect: 'One tap opens it. Two floating icons like the apps above: the picked one fills with color and gets the black tag, its description and an OPEN button show under the dashed line. Coming back, it is still open on what you picked.' },
  { id: 'fsguide', title: 'From Scratch page', where: 'Tools, TECH, From Scratch (nociv.co/scratch)',
    steps: ['Tap the arrow under ADVANCED, then TECH, then From Scratch.', 'Tap the black HOW IT WORKS bar.'],
    expect: 'Page opens on just the three cards (Shop, Archive, App) and a HOW IT WORKS bar. Tapping it opens what you can change, costs, two accounts and 8 steps. Tap again to close.' },
  { id: 'fsstudio', title: 'Build a site in the studio', where: 'From Scratch, tap the Shop card',
    steps: ['Preview on top, editor under it.', 'Look: tap Menu, then Slide, then Watch it.', 'Pages: tap Shop, tap an item, add a photo from your camera roll, type a price.', 'Tap Full view, then Close.'],
    expect: 'Preview changes as you tap. Watch it flips through the pages with the slide. Your photo shows on the item page in the preview.' },
  { id: 'fszip', title: 'Download and upload the zip', where: 'Studio, Publish tab',
    steps: ['Tap Download my site.', 'Open Files, Downloads and check the zip is there.', 'Optional: in Cloudflare, Workers and Pages, Create, Pages, Upload assets, pick the zip.'],
    expect: 'A zip named after your site lands in Downloads. If you try Cloudflare, tell me if it took the zip from your phone. That is the one step I could not test.' },
  { id: 'hometools', title: 'Free tools line on the home page', where: 'nociv.co home, under Shop clothing',
    steps: ['Scroll to the red Shop clothing button.', 'Look under the dashed line.', 'Tap See the tools.'],
    expect: 'Dashed line, then the See the tools button, then one line under it: We sell clothes. We give away tools. The button opens the Tools page.' }
];
// ===== end of list =====

var KEY = 'nocivPhoneTest:' + BATCH;
var S = {};
try { S = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { S = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function el(tag, cls, txt) { var d = document.createElement(tag); if (cls) d.className = cls; if (txt != null) d.textContent = txt; return d; }

function render() {
  var list = document.getElementById('list'); list.innerHTML = '';
  TESTS.forEach(function (t) {
    var st = S[t.id] || {}, box = el('div', 't' + (st.r === 'ok' ? ' pass' : st.r === 'no' ? ' fail' : ''));
    box.appendChild(el('h2', null, t.title));
    box.appendChild(el('p', 'where', t.where));
    var ol = el('ol'); t.steps.forEach(function (s) { ol.appendChild(el('li', null, s)); }); box.appendChild(ol);
    var ex = el('div', 'expect'); ex.appendChild(el('b', null, 'You should see')); ex.appendChild(document.createTextNode(t.expect)); box.appendChild(ex);
    var bt = el('div', 'btns');
    var ok = el('button', 'ok' + (st.r === 'ok' ? ' on' : ''), 'Works'), no = el('button', 'no' + (st.r === 'no' ? ' on' : ''), 'Broken');
    ok.type = no.type = 'button';
    ok.onclick = function () { S[t.id] = { r: S[t.id] && S[t.id].r === 'ok' ? '' : 'ok', n: (S[t.id] || {}).n || '' }; save(); render(); };
    no.onclick = function () { S[t.id] = { r: S[t.id] && S[t.id].r === 'no' ? '' : 'no', n: (S[t.id] || {}).n || '' }; save(); render(); };
    bt.appendChild(ok); bt.appendChild(no); box.appendChild(bt);
    var ta = el('textarea'); ta.placeholder = 'What happened? One line is enough.'; ta.value = st.n || '';
    ta.oninput = function () { S[t.id] = { r: 'no', n: ta.value }; save(); };
    box.appendChild(ta);
    list.appendChild(box);
  });
  var done = TESTS.filter(function (t) { return S[t.id] && S[t.id].r; }).length;
  document.getElementById('barFill').style.width = Math.round(done / TESTS.length * 100) + '%';
  document.getElementById('count').textContent = done + ' of ' + TESTS.length + ' checked';
  document.getElementById('ver').textContent = 'Test list: ' + BATCH;
}
function report() {
  var lines = ['PHONE TEST ' + BATCH];
  TESTS.forEach(function (t) {
    var st = S[t.id] || {};
    lines.push((st.r === 'ok' ? 'WORKS  ' : st.r === 'no' ? 'BROKEN ' : 'SKIPPED ') + t.title + (st.r === 'no' && st.n ? ' - ' + st.n : ''));
  });
  return lines.join('\n');
}
document.getElementById('copy').onclick = function () {
  var txt = report(), m = document.getElementById('msg');
  function done() { m.textContent = 'Copied. Paste it to the team.'; }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function () { window.prompt('Copy this, then paste it to the team', txt); });
  else window.prompt('Copy this, then paste it to the team', txt);
};
document.getElementById('reset').onclick = function () { if (confirm('Clear all your answers?')) { S = {}; save(); render(); document.getElementById('msg').textContent = ''; } };
render();
</script>
</body>
</html>
