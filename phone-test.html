<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>NOCIV Phone Test</title>
<style>
  @font-face { font-family: 'Anton'; src: url('fonts/anton.woff') format('woff'); font-display: swap; }
  :root { --ink:#1d1c1a; --paper:#f6eedb; --note:#f2ecd6; --red:#c8412f; --green:#3c6b4a; --line:#d9d3c4; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: -apple-system, system-ui, 'Helvetica Neue', Arial, sans-serif; }
  body { padding: 16px 16px calc(40px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  h1 { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; font-weight: 900; font-size: 2.1rem; letter-spacing: .02em; text-transform: uppercase; margin: 8px 0 4px; line-height: 1; }
  .lede { margin: 0 0 14px; font-size: .95rem; line-height: 1.4; }
  .bar { height: 10px; background: var(--line); margin: 6px 0 4px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .25s; }
  .count { font-size: .8rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 14px; }
  .t { position: relative; background: var(--note); border: 2px solid var(--ink); padding: 18px 14px 14px; margin: 0 0 14px; }
  .t::before { content: ''; position: absolute; top: -9px; left: 50%; width: 64px; height: 14px; margin-left: -32px; background: var(--ink); }
  .t.pass { border-color: var(--green); } .t.fail { border-color: var(--red); }
  .t h2 { margin: 0 0 2px; font-size: 1.05rem; }
  .where { font-size: .78rem; opacity: .7; margin: 0 0 8px; }
  ol { margin: 0 0 10px; padding-left: 22px; font-size: .92rem; line-height: 1.45; }
  .expect { font-size: .9rem; margin: 0 0 12px; padding: 8px 10px; background: #fff; border: 1.5px solid var(--ink); }
  .expect b { text-transform: uppercase; font-size: .7rem; letter-spacing: .08em; display: block; margin-bottom: 2px; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button { font: inherit; font-weight: 900; letter-spacing: .05em; text-transform: uppercase; font-size: .85rem; padding: 14px 8px; border: 2px solid var(--ink); background: #fff; color: var(--ink); cursor: pointer; border-radius: 0; }
  button:active { transform: scale(.98); }
  .ok.on { background: var(--green); color: #fff; border-color: var(--green); }
  .no.on { background: var(--red); color: #fff; border-color: var(--red); }
  textarea { width: 100%; margin-top: 8px; font: inherit; font-size: 16px; padding: 10px; border: 2px solid var(--ink); background: #fff; border-radius: 0; min-height: 70px; display: none; }
  .fail textarea { display: block; }
  .big { width: 100%; background: var(--red); color: #fff; border-color: var(--red); padding: 16px; font-size: .95rem; margin-top: 4px; }
  .ghost { width: 100%; margin-top: 10px; }
  .msg { font-size: .85rem; margin: 8px 0 0; min-height: 1.2em; font-weight: 700; }
  .ver { font-size: .72rem; opacity: .6; margin-top: 18px; }
</style>
</head>
<body>
<h1>Phone test</h1>
<p class="lede">Open each link on your phone, do the steps, then tap Works or Broken. When you are done, tap Copy my results and paste it to the team. Your answers are saved on this phone.</p>
<div class="bar"><i id="barFill"></i></div>
<div class="count" id="count"></div>
<div id="list"></div>
<button class="big" id="copy" type="button">Copy my results</button>
<button class="ghost" id="reset" type="button">Start over</button>
<p class="msg" id="msg" role="status"></p>
<p class="ver" id="ver"></p>

<script>
// ===== THE TEST LIST. Claude rewrites this block after every delivery. Keep each test to a few taps. =====
var BATCH = '2026-11-03 from scratch';
var TESTS = [
  { id: 'czwiring', title: 'Case Zero: wiring map and starter code for the Pico', where: 'Case Zero Builder, Brain, Wiring',
    steps: ['Close the site fully and reopen it. Brain, Parts: add a Pico, the 2.8 in screen, 4 Tact 12 buttons and a Knob.', 'Tap Wiring. Look at the Pico picture and the list.', 'Change one button to the pin you really soldered.', 'Tap Save code.py. On a computer: put CircuitPython on the Pico, copy the libraries named at the top of the file into CIRCUITPY/lib, save code.py on the drive.'],
    expect: 'The picture shows every used pin in red with its part number. Changing a pin moves it in the picture and the code. On the Pico: the screen says NOCIV, each button shows its name when pressed, the knob shows 0 to 100.' },
  { id: 'toolspattern', title: 'Tools page: Patterns icon, card and preview', where: 'nociv.co Tools, Clothes, Patterns',
    steps: ['Close the site fully and reopen it once (new version).', 'Tap Tools. The categories read PRINTOUTS, CLOTHES, VIDEO. Tap Clothes.', 'Look at the middle button over the word PATTERNS, then tap it.'],
    expect: 'The Patterns button shows three fabric rolls (a striped one leaning left with fabric coming off it, a tall dotted one, a short one leaning right). Picked, the rolls turn brown and float. The big card is three flat panels side by side: red plaid, NC logo repeat, camo. The Preview is the small tall picture of fabric rolls to the right of the words, like the other tools.' },
  { id: 'czpanel', title: 'Case Zero: the briefcase panel (holds, raised, notches you drag)', where: 'Case Zero Builder, start screen, A panel for a box I have',
    steps: ['Close the site fully and reopen it. On the start screen tap A panel for a box I have. (Or Body, Shape, What am I making.)', 'Size: Measure the inside of my box with the card, or type it. Sits: On a lip (or On legs) if the screen sits on standoffs, set the height to the screen front. Holds by: Screws or Glue.', 'Brain, Screens: 7 in. Arrange: drag it where it sits.', 'Body, Notches: tap the bottom edge of the picture where your wires are and drag. Pick Rounded or Round.', 'Print, Split, then Files.'],
    expect: 'One panel 1 mm smaller than the box. On a lip: a dashed line around the edge on the picture and a wall underneath, cut open at each notch, window the size of the picture. On the floor: a window the size of the whole screen. The notch follows your finger along any edge. On your 220 mm bed it is 2 puzzle pieces.' },
  { id: 'czaddons', title: 'Case Zero: start screen and Add-ons (stand, feet, standoffs, clips), Deck shape', where: 'Case Zero Builder',
    steps: ['On the start screen tap One part. It opens Files, Add-ons.', 'Clip-on stand: Fits shows your case. Pick 25. Save STL. Do the same for Feet.', 'Body, Shape: pick Deck, add the 7 in screen, a Pi and a thumb stick.'],
    expect: 'Each Save STL gives one file with all the pieces laid out (2 stands, 4 feet, 4 standoffs, 6 clips). The stand prints lying on its side. Deck is a big lid and base; on your bed it splits into puzzle pieces.' },
  { id: 'czboard', title: 'Case Zero: photo your built board (tap a part, say what it is, board goes inside)', where: 'Case Zero Builder, Brain, Snap',
    steps: ['Close the site fully and reopen it. Brain, Snap: Photo my board, front and back, card next to the board.', 'Drag the orange dots until the white outline sits on the card edge, rounded corners too (not on the curve). Then the green dots onto the board. Watch the close-up. Two fingers zoom the photo, Fit photo zooms back.', 'Tap outside the board: nothing should happen. Tap a part: the What is it sheet opens. Tap Hide, see the green cross on your spot, Show, pick.', 'Press on the screen, slide, let go, pick 2.8 in. Slide the box over the screen. Do each button, the knob or click wheel, and the Pico (pick Pico, tap Turn until the USB arrow points at the plug).', 'Tap one tag, tap Change, pick something else. Tap Front done: the Your photos screen opens. Tap Change the front photo: your tags are all still there. Front done again. Set the tallest button height. Add it to my parts, Just my board.', 'Arrange: tap one part, change what it is in its menu, and its Height: the note says how far it pokes through. Tap the board: Tallest button moves the top. Drag a part: the whole board moves. Tap Unlock and nudge it alone.'],
    expect: 'The page never highlights while you place tags and the photo never jumps. Arrange shows your board dashed underneath, each part separate on top, no red errors. Board width and length match a ruler within 1 mm. Brain, Wiring lists each part and says Raspberry Pi Pico. In 3D the screen and buttons come through the top.' },
  { id: 'czside', title: 'Case Zero: side photo for heights, and Back on every photo screen', where: 'Case Zero Builder, Brain, Snap, after the front photo',
    steps: ['On Your photos tap Take the side photo, then Back: you land on Your photos again, nothing lost.', 'Take the side photo: board flat on the table, card standing on its long edge against the board side (lean it on something), phone low and level, looking straight at them.', 'Orange dots: white outline on the card. Next. Green line on the board top face, yellow dot on top of the tallest part, blue dot on the lowest pin or wire under the board. Side done.', 'Done with photos, Add it to my parts. Arrange, tap the board: Under shows your number from the photo. Tap + and the case gets 0.5 mm taller.'],
    expect: 'Every photo screen has a Back. The title says which step of how many. The side numbers match a ruler within 1 mm, and the tallest button is filled in for you.' },
  { id: 'cz3dbox', title: 'Case Zero: 3D box in the corner, logo in 3D', where: 'Case Zero Builder, Brain, Arrange, Style, Print',
    steps: ['Add a few parts in Brain. Look top right.', 'Arrange: tap a part, then look at the 3D box. Tap the box, then Back to flat.', 'Style, Logo: My PNG with a white or colored logo. Then Words. Tap the 3D box.'],
    expect: 'A small 3D case shows top right and the flat picture moves aside for it. The part you just added or picked is a see-through yellow box. Tapping makes it big. Any PNG (white, colored, clear background) shows on the case. With Lid out, the 3D shows the lid closed with the logo on top, readable.' },
  { id: 'czprint', title: 'Case Zero: my printer by QR, strength and print time', where: 'Case Zero Builder, Print',
    steps: ['Printer: tap Scan the QR sticker on my printer and photo the whole sticker on your Ender-3 S1.', 'It should say Creality printer and open the Creality list. Tap Ender-3 S1 / S1 Pro.', 'Strength: switch Walls and Finish and watch the time.'],
    expect: 'Either it finds your printer and sets a 220 x 220 mm bed, or it shows the text from the code. The time and grams change with Finish and Walls. Thick walls make the case a little bigger outside.' },
  { id: 'patternblock', title: 'Patterns: Block builder (grid, many pictures, layers, mix)', where: 'Tools, Clothes, Patterns, Start, Block',
    steps: ['Close the site fully and reopen it. Tap Start, then Block.', 'Grid (left toolbar): tap + on Squares until it says 5 x 5.', 'Tap a square on the picture. It zooms in. Element: tap Picture and pick 3 photos at once, crop each one.', 'Ink, Shape and Back open on their own after each pick. Pick a circle and a color.', 'Under Change tap Row, then tap a red color in Ink.', 'Drag your finger on the zoomed square to nudge the element. Tap outside the block to zoom out.', 'Mix: tap Rows, then 3 kinds. Repeat: Mirror, Words: Readable. Tap Swatch, then Yard. Tap + and - on the right side.', 'Color step: change one color and watch it change everywhere. Board, Files, Make my files, save the Tile.'],
    expect: 'The left toolbar shows Grid, Mix, Repeat, Ground, Pictures when nothing is picked and Element, Ink, Shape, Back, Size when a square is picked. Every photo you added shows up as its own element. Row changes only that row. The element moves with your finger. In Mirror with Readable the words still read. Swatch shows 8 in across. The toolbar is not cut off on an iPhone SE and nothing scrolls except a long picture list.' },
  { id: 'patternmirror', title: 'Patterns: mirror that keeps words readable, nudge, Tile view', where: 'Tools, Clothes, Patterns, Logo',
    steps: ['Tap Logo, type NOCIV in Words. Tap Repeat, then Mirror.', 'Tap Tile at the top. Try Words: True mirror, Readable, Shapes only.', 'In Tile view, drag on the picture to nudge where the copies meet.', 'Try Mirror: Left-right and Up-down.', 'Tap Size and use Nudge Across and Down, then Center it again.', 'Tap Half-drop. Check every logo reads the right way.'],
    expect: 'True mirror reads backwards, Readable and Shapes only read the right way. Dragging moves the copies toward or away from each other. Tile view shows one tile with a red dashed box and the repeats faded around it. Half-drop never flips the logo.' },
  { id: 'fsstart', title: 'From Scratch: pick on the landing, Studio opens on Look, no pop up', where: 'nociv.co/scratch',
    steps: ['Tap Archive. Pick Producer.', 'In the Studio check the tabs. Tap Shuffle once.', 'Tap back, pick Shop.', 'Tap back, Archive, Producer again.'],
    expect: 'Archive opens a small Finds / Producer / Log choice right on the landing page. The Studio has only Look, Pages, Info (no Start, no numbers, no repeated heading). No pop up ever asks to replace your site. Your Shop and your Producer site each keep their own work, so going back to Producer shows your shuffled look.' },
  { id: 'stencillock', title: 'Stencil + Halftone: tabs above the step bar, drop down button', where: 'Tools, Stencil + Halftone',
    steps: ['Close the site fully and reopen it once (new version).', 'Load the Sample. Tap Start, Cut or Ink, Layers or Dots, Mix, Print.', 'In each step tap every tab in the row just above the step bar.', 'Tap the round down arrow next to ?. Then tap it again.', 'Drop it down again, then tap any tab.'],
    expect: 'The part tabs sit right above Start / Cut / Layers / Mix / Print, the controls sit above them. The picture stays one size while you work. The down arrow hides the controls so the picture gets big; the arrow flips up, and tapping it or any tab brings the controls back. No sliding animation. Nothing scrolls.' },
  { id: 'stencilcloseup', title: 'Stencil + Halftone: close-up as it prints, my screens, ink order', where: 'Tools, Stencil + Halftone',
    steps: ['Choose a real photo. Tap Halftone, then Dots, then Tone.', 'Look at the AS IT PRINTS box. Tap another spot on the photo. Turn Contrast.', 'Tap Soft, Punchy, Auto fix.', 'Tap Dot size, then My screens. Tap the meshes you own, then Done.', 'Tap Ink, then CMYK.', 'Switch to Stencil, Cut, Light/dark, tap Auto split.'],
    expect: 'The box shows clean round dots exactly as the film will print, the red square on the photo shows where, and it starts on a spot with real detail. The mesh advice only uses the screens you picked and says if your finest screen is too coarse for the dot size. Ink shows the 4 screens in print order (A Yellow, B Magenta, C Cyan, D Black) next to the close-up of all four colors. Buttons and knobs are big, nothing scrolls.' },
  { id: 'casezerostyle', title: 'Case Zero Style: logo, button labels, textures by side, colors, snap clips, spring buttons', where: 'Case Zero Builder, step Style (and Body, Fit)',
    steps: ['Style, Logo: pick Words, type your brand, Where: Lid out, How: Pressed in. Drag it on the picture. Try My PNG with your logo.', 'Labels: Under. Change a letter in the list.', 'Texture: Side Top, pick Tread. Side Sides, pick | | |. Side Lid out, pick Wood.', 'Colors: 2 or more, pick a marks color. Spin the 3D.', 'Body, Fit: Deck on Snap clips, Buttons Printed springs.', 'Files: Make my files. Look for the marks color files, glue-on pieces and the 1 mm test fit.'],
    expect: 'The logo, letters and texture show on the picture in the marks color and in 3D. Raised marks say glue-on pieces. The test fit file prints in minutes and every hole lines up with the real case.' },
  { id: 'casezero7', title: 'Case Zero Builder: brain first, arrange, 8 shapes, measure with your phone, fit your printer', where: 'Tools, Case Zero, Body, Open (nociv.co/casezero/build/)',
    steps: ['Brain: tap Snap and take a photo of your parts. Then Parts: pick Brains in the drop down, swipe the row, add a Pico. Add Screens, 2.8 in and Buttons.', 'Arrange: tap Lid and Base. Drag a part. Tap a part, then Turn. Tap Arrange for me.', 'Body: try every shape. Tap Fit, change the hinge and Height. Tap the lid button top right.', 'Body, Measure: lay a bank card next to a board, tap Measure a part, follow the green outline and arrows until it snaps, drag the dots onto the card and the board, tap a hole, Done, Add it to my parts.', 'Print: pick Bambu A1 mini, then Split: try | and 2.', 'Files: Make my files, save one box STL and open it in your slicer.'],
    expect: 'Nothing on the page scrolls. Parts show NO SOLDER or SOLDER labels. Every part gets a number (L1, B2, I1). The 3D lid opens and closes. Phone measuring gives a size within about 1 mm of a ruler. On a 180 mm bed the case comes out in numbered puzzle pieces that each fit. The STL opens in the slicer at the right size.' },
  { id: 'hardware', title: 'Hardware: plaques and cut out emblems for bags', where: 'Tools, Clothes, Patterns, Start, Hardware',
    steps: ['Tap Hardware. Try Bar, Shield and Badge, then make it wider with Width +.', 'Tap Mark. Type your brand and a small line. Try Engraved, Raised, Cut through and Enamel fill. Set Logo to Beside words.', 'Tap Details. Try Beads, then Screws, then Prongs.', 'Tap Color and pick Gunmetal, then Polished.', 'Tap Fabric and pick Pebbled leather, then a red color.', 'Tap Board, then Files, then Make my files. Save the Cut file SVG.'],
    expect: 'The plate looks like metal on a stitched leather patch, with a 10 mm ruler top left. Every change shows right away. The Board shows the render, an actual size outline with mm, and the spec list. Files gives 6 saves, and the SVG opens at the right size in mm.' },
  { id: 'cutsewsource', title: 'Cut and Sew: proven styles and buy a blank or get it made', where: 'Tools, Clothes, Cut and Sew',
    steps: ['On What, open Or start from a proven style. Tap Baggy fleece shorts.', 'Check the flat turned into extra wide shorts with an elastic waist.', 'Tap Source at the bottom. Tap Put in tech pack on the Shaka card, then Find it.', 'Tap Get it made and read the list.', 'Back on What, tap Mechanic jacket.'],
    expect: 'The 7 tabs at the bottom all fit with no cut off words. The shorts style fills the tech pack style name and fabric. Find it opens a search in a new tab. Mechanic jacket jumps to Source and shows only the jacket blank.' },
  { id: 'patterngap', title: 'Patterns: gaps, border, clear background, crop again', where: 'Tools, Clothes, Patterns',
    steps: ['Close the site fully and reopen it (the header must say PATTERNS).', 'Tap My picture, pick a photo. The crop screen opens. Crop it.', 'In Picture tap Crop it to crop again.', 'Tap Gaps. Tap + on Across and - on Down.', 'Tap Border at the top right on and off.', 'Tap Color, then Background: None, clear. Then Board, Files, download the tile.'],
    expect: 'Crop opens every time. Across and Down change the space between pictures and the red box (one tile) changes size with them. Border turns the red lines on and off. With None the preview shows a gray checker and the downloaded tile PNG has no background. No panel scrolls.' },
  { id: 'patternmix', title: 'Patterns: mix and match, crop your picture', where: 'Tools, Clothes, Patterns',
    steps: ['Tap Checks, then Fill. Tap Mix 3. Set square 1 to Dots, 2 to Lines, 3 to Logo.', 'Tap Stripes, then Bands. Tap the Solid button on a band until it says Logo, then Dots.', 'Go to Start, tap My picture, pick a photo. Crop it square and tap the done button.', 'Tap Repeat, then Mix: Icon, then Space, then Logo.', 'Tap Logo, Repeat, Mirror: triangle. Then Camo, Bubble.'],
    expect: 'The checker squares take turns: dots, lines, your logo. Bands show your logo or dots running along them. The crop screen opens before the picture is used and only the cropped part repeats. Mix puts an icon, a gap or your logo between your pictures so no two neighbors match. Triangle mirror has no thin lines between the shapes. Bubble camo blobs melt into each other. No panel scrolls, even on an iPhone SE.' },
  { id: 'pattern', title: 'Patterns: logo, plaid, stripes, checks, camo, fabric, mood board', where: 'Tools, Clothes, Patterns',
    steps: ['Tap Logo. Type your initials in Words, pick a shape and an icon.', 'Tap Repeat and try Half-drop, Mirror, then Mirror: hexagon. Tap Size and Fade, then Watermark.', 'Go back to Start. Tap Plaid, then Heritage. Tap Color and try a palette, then My colors.', 'Tap Fabric, pick Flannel, then Swatch, Close and Yard at the top.', 'Try Stripes (Rep stripe), Checks (Houndstooth, Corners: My logo) and Camo (Bubble, Shuffle).', 'Tap Board. Type a name and a Pantone code. Files, Make my files, Save Tile and Save Mood board PDF. Open Print it.', 'In Stencil + Halftone, Print, Files, tap Make it a pattern.'],
    expect: 'Nothing on the page scrolls and no panel needs scrolling. Every pattern repeats with no visible seam. Fabric shows the weave texture over your pattern. The Board shows your mood board with the swatch, the tile outlined in red, the colorway (hex, RGB, CMYK, your Pantone code) and notes. The tile saves as a PNG that reads 150 DPI. The halftone button opens the pattern app with your halftone ready to repeat.' },
  { id: 'stencilmix', title: 'Stencil + Halftone: Mix with your own design, a new picture, Apply to print', where: 'Tools, Stencil + Halftone',
    steps: ['Make a halftone first (pick Ink colors and a Dot size).', 'Tap Mix. Tap Use mine at the top.', 'Tap Layers, then Layer 2. Pick Stencil or Dots, tap + New picture and choose another photo. Pick a color.', 'Tap Move, then Layer 1. Drag on the picture. Tap Layer 2 and drag again. Tap 45.', 'Tap Apply to print. On the Files tab tap Make my files.', 'Tap Print without the mix.'],
    expect: 'Ink has one Colors tab with Grayscale / One color / CMYK beside the close-up, the colors and the screens all on one panel. In Mix, Use mine puts your exact halftone (your colors and dot size) as layer 1. You choose which layer you are editing and which one you move. Layer 2 can be the same picture or a new one. Apply to print jumps to Print, the picture shows your Mix, and Files gives the mix picture plus one film per screen, lined up. Print without the mix goes back to normal.' },
  { id: 'stencilcrop', title: 'Stencil + Halftone: knobs and crop', where: 'Tools, Stencil + Halftone',
    steps: ['Choose a photo. In the crop screen pick Free, then 4:5, drag a corner, tap Done.', 'Tap Halftone, then Dots, then the sun symbol. Turn Contrast by dragging up. Double tap it.'],
    expect: 'Crop shows the photo with its real shape and every crop shape button fits. Knobs turn and the picture updates; double tap puts a knob back.' },
  { id: 'fseditor', title: 'From Scratch: tap to select, Layers, Insert, Publish', where: 'nociv.co/scratch/studio.html',
    steps: ['Tap a product in the preview.', 'Tap the play button at the top, tap a product, then tap the arrow.', 'Open Layers and tap a product under Shop.', 'Open Insert and add a Log page. Tap Publish (top right).'],
    expect: 'Tapping in the preview draws a red box with a name tag and opens that thing\'s settings below. Play mode lets you click around like a visitor. Layers shows every page with its items nested under it. Insert adds pages. Publish opens the checklist and download.' },
  { id: 'fsarchive', title: 'From Scratch: Archive versions and real fonts', where: 'nociv.co/scratch/studio.html, Insert',
    steps: ['Under Archive tap Finds, then Producer, then Log.', 'In Producer, open a beat and add a short mp3. Tap play in the preview.', 'In Design, Fine tune, Type: try Space Grotesk, Syne and Special Elite.'],
    expect: 'Finds is a numbered collage with "via site" links. Producer is a list with round play buttons and Buy $ buttons. Log is a dated timeline. The real fonts change the headings right away.' },
  { id: 'fslooks', title: 'From Scratch: 30 looks, Shuffle, 8 starts', where: 'nociv.co/scratch/studio.html',
    steps: ['Open Look. Tap Street, then Stencil.', 'Tap Shuffle three times, then Undo last look.', 'Open Start and pick Music, then Food.'],
    expect: 'Each look changes colors, type, buttons and background in the preview while every page and word stays. Shuffle always gives readable text. Music and Food load full starter sites.' },
  { id: 'advhelp', title: 'Back and help on Case Zero and From Scratch', where: 'nociv.co/casezero, the Builder, nociv.co/scratch, the Studio',
    steps: ['On each page tap the ? button, read, tap Done.', 'Tap Back.'],
    expect: 'A cream help sheet slides up with numbered steps. Back goes one level up: Case Zero and From Scratch go to Tools, the Builder goes to Case Zero, the Studio goes to From Scratch.' },
  { id: 'nofont', title: 'Tall poster font gone, section lines', where: 'nociv.co/about.html, Tools, Case Zero, From Scratch',
    steps: ['Open About, Philosophy.', 'Open Tools, then Case Zero and From Scratch.'],
    expect: 'Big headings use the same heavy bold letters as the Directory card name, not the tall skinny poster font. On About a thin grey line runs between sections. Nothing is cut off on the sides.' },
  { id: 'baseheading', title: 'Base: lined paper heading card', where: 'nociv.co/community.html',
    steps: ['Open Base.'],
    expect: 'The top Base card is lined paper with blue lines and a red margin line, like the About list, tape still on top.' },
  { id: 'aboutcopy', title: 'About: every page in the new voice', where: 'nociv.co/about.html',
    steps: ['Open each item on the list, using Next at the bottom.'],
    expect: 'Each page opens with one huge line (Normal was made by someone. / Pick your way in. / Arizona based. Not Arizona limited. / I make things. / Write to me.), then short plain sentences, a bold line, and small grey facts. The two bottom buttons stay on one line.' },
  { id: 'aboutlist', title: 'About: to-do list, Next and Back', where: 'nociv.co/about.html',
    steps: ['Tap the box next to Philosophy.', 'At the bottom tap Next twice.', 'Tap Back to About.', 'Tap Uncheck all under the list.'],
    expect: 'No dark bar under the tabs. Next walks Philosophy, Participate, Culture. Back to About lands on the list in one tap with those three checked. Uncheck all clears them and hides itself.' },
  { id: 'toptabs', title: 'Top tabs fit the screen', where: 'any page, for example nociv.co/shop.html',
    steps: ['Look at the About, Shop, Tools, Base tabs.'],
    expect: 'All four tabs are the same width with a little space on both sides. About does not touch the left edge and Base is not cut off on the right.' },
  { id: 'shopbar', title: 'Shop: floating section icons', where: 'nociv.co/shop.html',
    steps: ['Tap Clothing, Art, then Zines.'],
    expect: 'Three big floating icons: tee with black pants, an easel, an open zine, word under each. Not picked: grey outlines and grey word. Picked: black outlines, red fill (pants black, no seams), floats, dashed ring around the word. A thin grey line runs above the icons and a dashed grey line below. No arrow, no sentences. The right products show.' },
  { id: 'remix', title: 'Remix a look (From Scratch)', where: 'nociv.co/scratch/studio.html, Publish',
    steps: ['Make a site with your colors and pages.', 'Publish tab, tap Copy my remix link (or the share sheet opens).', 'Text the link to yourself and open it in a private Safari tab.'],
    expect: 'The private tab opens the studio with your colors, type, menu and page names, but none of your words, photos, prices or email. Its footer says Remixed from your site name.' },
  { id: 'storage', title: 'Clear unused files', where: 'Admin, Tools and Setup, Storage',

var KEY = 'nocivPhoneTest:' + BATCH;
var S = {};
try { S = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { S = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function el(tag, cls, txt) { var d = document.createElement(tag); if (cls) d.className = cls; if (txt != null) d.textContent = txt; return d; }

function render() {
  var list = document.getElementById('list'); list.innerHTML = '';
  TESTS.forEach(function (t) {
    var st = S[t.id] || {}, box = el('div', 't' + (st.r === 'ok' ? ' pass' : st.r === 'no' ? ' fail' : ''));
    box.appendChild(el('h2', null, t.title));
    box.appendChild(el('p', 'where', t.where));
    var ol = el('ol'); t.steps.forEach(function (s) { ol.appendChild(el('li', null, s)); }); box.appendChild(ol);
    var ex = el('div', 'expect'); ex.appendChild(el('b', null, 'You should see')); ex.appendChild(document.createTextNode(t.expect)); box.appendChild(ex);
    var bt = el('div', 'btns');
    var ok = el('button', 'ok' + (st.r === 'ok' ? ' on' : ''), 'Works'), no = el('button', 'no' + (st.r === 'no' ? ' on' : ''), 'Broken');
    ok.type = no.type = 'button';
    ok.onclick = function () { S[t.id] = { r: S[t.id] && S[t.id].r === 'ok' ? '' : 'ok', n: (S[t.id] || {}).n || '' }; save(); render(); };
    no.onclick = function () { S[t.id] = { r: S[t.id] && S[t.id].r === 'no' ? '' : 'no', n: (S[t.id] || {}).n || '' }; save(); render(); };
    bt.appendChild(ok); bt.appendChild(no); box.appendChild(bt);
    var ta = el('textarea'); ta.placeholder = 'What happened? One line is enough.'; ta.value = st.n || '';
    ta.oninput = function () { S[t.id] = { r: 'no', n: ta.value }; save(); };
    box.appendChild(ta);
    list.appendChild(box);
  });
  var done = TESTS.filter(function (t) { return S[t.id] && S[t.id].r; }).length;
  document.getElementById('barFill').style.width = Math.round(done / TESTS.length * 100) + '%';
  document.getElementById('count').textContent = done + ' of ' + TESTS.length + ' checked';
  document.getElementById('ver').textContent = 'Test list: ' + BATCH;
}
function report() {
  var lines = ['PHONE TEST ' + BATCH];
  TESTS.forEach(function (t) {
    var st = S[t.id] || {};
    lines.push((st.r === 'ok' ? 'WORKS  ' : st.r === 'no' ? 'BROKEN ' : 'SKIPPED ') + t.title + (st.r === 'no' && st.n ? ' - ' + st.n : ''));
  });
  return lines.join('\n');
}
document.getElementById('copy').onclick = function () {
  var txt = report(), m = document.getElementById('msg');
  function done() { m.textContent = 'Copied. Paste it to the team.'; }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function () { window.prompt('Copy this, then paste it to the team', txt); });
  else window.prompt('Copy this, then paste it to the team', txt);
};
document.getElementById('reset').onclick = function () { if (confirm('Clear all your answers?')) { S = {}; save(); render(); document.getElementById('msg').textContent = ''; } };
render();
</script>
