<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Patterns | NOCIV</title>
<meta name="theme-color" content="#1a1a1a">
<link rel="icon" href="/favicon.ico">
<style>
@font-face{font-family:'FS Archivo Black';src:url('../scratch/kit/fonts/archivo-black.woff') format('woff');font-display:swap}
@font-face{font-family:'FS Syne';src:url('../scratch/kit/fonts/syne-800.woff') format('woff');font-weight:800;font-display:swap}
@font-face{font-family:'FS DM Serif Display';src:url('../scratch/kit/fonts/dm-serif-display.woff') format('woff');font-display:swap}
@font-face{font-family:'FS Rubik Mono One';src:url('../scratch/kit/fonts/rubik-mono-one.woff') format('woff');font-display:swap}
@font-face{font-family:'FS Permanent Marker';src:url('../scratch/kit/fonts/permanent-marker.woff') format('woff');font-display:swap}
@font-face{font-family:'FS Fraunces';src:url('../scratch/kit/fonts/fraunces-700.woff') format('woff');font-weight:700;font-display:swap}
@font-face{font-family:'FS Barlow Condensed';src:url('../scratch/kit/fonts/barlow-condensed-700.woff') format('woff');font-weight:700;font-display:swap}
@font-face{font-family:'FS Special Elite';src:url('../scratch/kit/fonts/special-elite.woff') format('woff');font-display:swap}
@font-face{font-family:'FS Tenor Sans';src:url('../scratch/kit/fonts/tenor-sans.woff') format('woff');font-display:swap}
@font-face{font-family:'FS Bricolage';src:url('../scratch/kit/fonts/bricolage-grotesque-800.woff') format('woff');font-weight:800;font-display:swap}
:root{--ink:#1a1a1a;--paper:#f3efe6;--panel:#fbf9f4;--line:#d9d4c8;--mute:#6f6a60;--red:#c8412f;--sys:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:500 15px/1.35 var(--sys);-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit}
input{-webkit-user-select:text;user-select:text}
.top{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:var(--ink);color:#fff}
.top a{color:#fff;text-decoration:none;font:800 22px/1 var(--sys);padding:4px 8px}
.top b{font:900 14px/1 var(--sys);letter-spacing:.1em;text-transform:uppercase;flex:1}
html.embedded .top{display:none}
.stage{flex:1 1 auto;min-height:0;position:relative;background:#e7e2d6;overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.fl{position:absolute;z-index:2;display:flex;gap:4px}
.chip{all:unset;box-sizing:border-box;cursor:pointer;height:36px;min-width:36px;padding:0 10px;display:grid;place-items:center;border:1.5px solid var(--ink);border-radius:10px;background:#fff;font:800 12px/1 var(--sys);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.chip[aria-pressed=true]{background:var(--ink);color:#fff}
.chip:disabled{opacity:.35}
.chip svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.seg3{display:flex;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg3 button{all:unset;cursor:pointer;padding:0 10px;height:33px;display:grid;place-items:center;font:800 12px/1 var(--sys)}
.seg3 button[aria-pressed=true]{background:var(--ink);color:#fff}
#tools{left:8px;top:52px;flex-direction:column}
html.righty #tools{left:auto;right:8px}
#tools button{all:unset;box-sizing:border-box;cursor:pointer;width:50px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1.5px solid var(--ink);border-radius:12px;background:#fff;font:800 9.5px/1 var(--sys);box-shadow:0 1px 3px rgba(0,0,0,.18)}
#tools button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#tools button[aria-pressed=true]{background:var(--ink);color:#fff}
#tools button.done{background:var(--red);border-color:var(--red);color:#fff}
.lbl{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);padding:4px 9px;border-radius:8px;background:rgba(26,26,26,.82);color:#fff;font:700 11.5px/1.2 var(--sys);pointer-events:none;white-space:nowrap;z-index:2}
.lbl:empty{display:none}
.menu{position:absolute;z-index:4;display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.menu button{all:unset;cursor:pointer;color:#fff;padding:9px 10px;font:800 12px/1 var(--sys);border-radius:9px}
.menu[hidden]{display:none}
.panel{flex:none;height:222px;overflow-y:auto;background:var(--panel);border-top:1.5px solid var(--ink);padding:10px 12px}
.steps{flex:none;display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-top:1.5px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
.steps button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:50px;color:#8d887d;font:900 13px/1 var(--sys);letter-spacing:.08em;text-transform:uppercase}
.steps button[aria-pressed=true]{color:var(--ink);box-shadow:inset 0 4px 0 var(--red)}
.h{margin:0 0 6px;font:900 11px/1 var(--sys);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.row{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.row>b{flex:0 0 64px;font:800 12.5px/1.1 var(--sys)}
.seg{flex:1;display:flex;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff;min-width:0}
.seg button{all:unset;cursor:pointer;flex:1 1 0;min-width:0;text-align:center;padding:9px 2px;font:800 12px/1.1 var(--sys);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.st{flex:1;display:flex;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff}
.st button{all:unset;cursor:pointer;width:44px;height:36px;display:grid;place-items:center;font:900 18px/1 var(--sys)}
.st output{flex:1;display:grid;place-items:center;border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink);font:800 13px/1 var(--sys)}
.grid{display:grid;gap:6px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.pick{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;padding:4px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font:700 11px/1.1 var(--sys);text-align:center;overflow:hidden}
.pick canvas{width:100%;height:36px;display:block}
.pick[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.pick svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sw{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.sw button{all:unset;cursor:pointer;width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px #b9b5ab}
.sw button[aria-pressed=true]{box-shadow:0 0 0 3px var(--ink)}
.sw label{position:relative;width:30px;height:30px;border-radius:50%;border:1.5px dashed var(--ink);display:grid;place-items:center;font:900 16px/1 var(--sys);overflow:hidden}
.sw label input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.txt{flex:1;min-width:0;height:40px;padding:0 10px;border:1.5px solid var(--ink);border-radius:10px;background:#fff;font:700 16px/1 var(--sys)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;text-align:center;padding:11px;border:1.5px solid var(--ink);border-radius:10px;background:#fff;font:900 13px/1 var(--sys);margin:0 0 8px}
.btn.dark{background:var(--ink);color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.tabs5{display:flex;gap:4px;margin:0 0 8px}
.tabs5 button{all:unset;cursor:pointer;flex:1;text-align:center;padding:8px 0;border-radius:9px;font:800 11.5px/1 var(--sys);color:var(--mute)}
.tabs5 button[aria-pressed=true]{background:var(--ink);color:#fff}
/* first screen and starters */
.home{position:fixed;inset:0;z-index:8;padding-top:max(24px,env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;background:var(--paper);text-align:center}
.home[hidden]{display:none}
.home h1{margin:0;font:900 22px/1.1 var(--sys);letter-spacing:.06em;text-transform:uppercase}
.home .drop{all:unset;cursor:pointer;width:min(320px,86%);padding:30px 16px;border:2px dashed var(--ink);border-radius:18px;background:#fff;font:900 17px/1.2 var(--sys)}
.home .drop small{display:block;margin-top:6px;font:600 12.5px/1.3 var(--sys);color:var(--mute)}
.home .alt{all:unset;cursor:pointer;font:800 13px/1 var(--sys);text-decoration:underline;color:var(--mute);padding:6px}
.starters{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;background:var(--paper);padding:12px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}
.starters[hidden]{display:none}
.starters .grid{flex:1;min-height:0;overflow-y:auto;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start}
.starters .grid button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:4px;font:800 12px/1 var(--sys);text-align:center}
.starters .grid canvas{position:static;height:auto;width:100%;aspect-ratio:1;border:1.5px solid var(--ink);border-radius:12px;display:block}
.starters .bar{display:flex;gap:8px;margin-top:10px}
.starters .bar .btn{margin:0}
/* help sheet */
.sheet{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.4);display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.sheet .in{width:100%;max-height:86%;overflow-y:auto;background:var(--panel);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));position:relative}
.sheet h2{margin:0 0 8px;font:900 16px/1.2 var(--sys);letter-spacing:.06em;text-transform:uppercase}
.sheet .x{all:unset;cursor:pointer;position:absolute;right:12px;top:10px;width:36px;height:36px;display:grid;place-items:center;border:1.5px solid var(--ink);border-radius:50%;font:900 18px/1}
.sheet li{margin:0 0 6px}
.note{margin:0 0 8px;font:600 12px/1.35 var(--sys);color:var(--mute)}
/* session 2: colorways, cloths, shelf */
#clothChip::before{content:'';width:9px;height:9px;margin-right:6px;border-radius:2px;background:repeating-linear-gradient(45deg,#1a1a1a 0 1.5px,#fff 1.5px 3px);display:inline-block;vertical-align:-1px}
#clothChip{display:block;line-height:33px}
#clothChip[hidden]{display:none}
.ways{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ways .pick canvas{height:auto;aspect-ratio:1;border-radius:6px}
.crow{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px;-webkit-overflow-scrolling:touch}
.crow .pick{flex:0 0 74px;min-height:0;position:relative}
.crow .pick canvas{position:static;width:100%;height:54px;border-radius:6px}
.pick.fit::after{content:'';position:absolute;right:5px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px #fff}
.cloths{position:absolute;left:0;right:0;bottom:0;z-index:3;background:rgba(251,249,244,.97);border-top:1.5px solid var(--ink);padding:8px}
.cloths[hidden]{display:none}
.shelf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.shelf .pick img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block}
.shelf .pick{min-height:0;font-size:10.5px}
.sw .hex{font:700 10px/1 ui-monospace,Menlo,monospace;color:var(--mute);margin:0 4px 0 -3px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cmp figure{margin:0}.cmp canvas{width:100%;height:auto;border:1.5px solid var(--ink);border-radius:8px;display:block}.cmp figcaption{font:800 12px/1.2 var(--sys);margin-top:4px}
.btn:disabled{opacity:.4}
@media(max-height:620px){.panel{height:190px}#tools button{height:34px;width:44px}#tools button span{display:none}#tools{top:48px;gap:3px}}
/* v2 look (11-10): soft white-grey ground, white cards, navy icons, cream only on what is picked, springy controls (Fraqtals style) */
:root{--bg:#f2f2f7;--card:#ffffff;--tile:#eef0f6;--navy:#1f2a44;--sub:#6b7390;--line:#e3e5ee;--cream:#f3efe6;--yel:#fdee4f;--spring:cubic-bezier(.34,1.4,.5,1);--ink:#1f2a44;--mute:#6b7390;--paper:#f2f2f7;--panel:#ffffff}
html,body{background:var(--bg);color:var(--navy)}
*{-webkit-tap-highlight-color:transparent}
.top{background:var(--card);color:var(--navy);border-bottom:1px solid var(--line)}
.top a{color:var(--navy)}.top b{letter-spacing:.04em}
.stage{background:var(--bg)}
.chip{border:0!important;border-radius:13px!important;background:var(--card)!important;color:var(--navy)!important;box-shadow:0 2px 10px rgba(31,42,68,.12)!important;transition:transform .18s var(--spring)}
.chip:active{transform:scale(.93)}
.chip[aria-pressed=true]{background:var(--cream)!important;box-shadow:0 0 0 1.5px var(--navy)!important}
.seg3{border:0!important;padding:3px;gap:2px;border-radius:13px!important;background:var(--card)!important;box-shadow:0 2px 10px rgba(31,42,68,.12)}
.seg3 button{border-radius:10px;color:var(--sub)!important;transition:background .2s,color .2s}
.seg3 button[aria-pressed=true]{background:var(--cream)!important;color:var(--navy)!important;box-shadow:0 0 0 1.5px var(--navy)}
#tools{gap:4px!important;padding:5px;border-radius:18px;background:var(--card);box-shadow:0 2px 14px rgba(31,42,68,.14);transform:translateX(-140%);opacity:0;pointer-events:none;transition:transform .42s var(--spring),opacity .25s}
#tools.on{transform:none;opacity:1;pointer-events:auto}
html.righty #tools{transform:translateX(140%)}html.righty #tools.on{transform:none}
#tools button{border:0!important;box-shadow:none!important;background:transparent!important;color:var(--navy)!important;border-radius:13px!important;transition:background .2s,transform .18s var(--spring)}
#tools button span{color:var(--sub)}
#tools button:active{transform:scale(.93)}
#tools button[aria-pressed=true]{background:var(--cream)!important;box-shadow:0 0 0 1.5px var(--navy)!important}
#tools button[aria-pressed=true] span{color:var(--navy)}
#tools button.done{background:var(--tile)!important;color:var(--navy)!important}
#ctx{position:absolute;z-index:3;left:0;top:0;display:flex;gap:2px;padding:4px;border-radius:15px;background:var(--card);box-shadow:0 4px 18px rgba(31,42,68,.18);opacity:0;transform:translate(-50%,6px) scale(.9);pointer-events:none;transition:opacity .2s,transform .3s var(--spring)}
#ctx.on{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
#ctx button{all:unset;cursor:pointer;height:36px;padding:0 10px;border-radius:11px;color:var(--navy);font:700 12px/36px var(--sys)}
#ctx button:active{background:var(--tile)}
#ctx button.del{color:#e5484d}
#fab{all:unset;position:absolute;z-index:3;right:14px;bottom:14px;width:58px;height:58px;border-radius:50%;background:var(--yel);color:var(--navy);display:grid;place-items:center;box-shadow:0 4px 16px rgba(31,42,68,.24);cursor:pointer;transition:transform .2s var(--spring)}
#fab:active{transform:scale(.9)}
#fab svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
#fab[hidden]{display:none}
#fab.pulse{animation:pulse 1.4s ease 2}
@keyframes pulse{50%{transform:scale(1.14)}}
.lbl{background:var(--card)!important;color:var(--sub)!important;box-shadow:0 2px 10px rgba(31,42,68,.10);border-radius:11px!important;bottom:14px!important}
.panel{background:var(--card)!important;border-top:0!important;border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(31,42,68,.10);position:relative;z-index:2}
.ptitle{margin:0 0 10px;font:800 13px/1 var(--sys);color:var(--sub);letter-spacing:.02em}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 12px}
.tile{all:unset;cursor:pointer;height:62px;border-radius:16px;background:var(--tile);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--navy);transition:transform .18s var(--spring),box-shadow .2s,background .2s}
.tile svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile small{font:650 11px/1 var(--sys);color:var(--sub)}
.tile:active{transform:scale(.93)}
.tile[aria-pressed=true]{background:var(--cream);box-shadow:0 0 0 1.5px var(--navy)}
.tile[aria-pressed=true] small{color:var(--navy)}
.steps{background:var(--card)!important;border-top:1px solid var(--line)!important;height:calc(62px + env(safe-area-inset-bottom))}
.steps button{flex-direction:column!important;gap:3px!important;color:var(--navy)!important;opacity:.55;box-shadow:none!important;font:650 10.5px/1 var(--sys)!important;letter-spacing:0!important;text-transform:none!important;transition:opacity .25s}
.steps button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.steps button[aria-pressed=true]{opacity:1}
.h{color:var(--sub)!important}
.row>b{color:var(--sub)!important;font-weight:650!important}
.seg{border:0!important;padding:3px;gap:2px;border-radius:12px!important;background:var(--tile)!important}
.seg button{border:0!important;border-radius:9px!important;color:var(--navy)!important;transition:background .2s}
.seg button[aria-pressed=true]{background:var(--cream)!important;box-shadow:0 0 0 1.5px var(--navy)}
.st{border:0!important;border-radius:12px!important;background:var(--tile)!important}
.st button{color:var(--navy);transition:transform .18s var(--spring)}.st button:active{transform:scale(.88)}
.st output{border:0!important}
.pick{border:0!important;border-radius:14px!important;background:var(--tile)!important;color:var(--navy)!important;transition:transform .18s var(--spring),box-shadow .2s}
.pick:active{transform:scale(.93)}
.pick[aria-pressed=true]{background:var(--cream)!important;box-shadow:0 0 0 1.5px var(--navy)!important}
.sw button{border:0!important;box-shadow:inset 0 0 0 1px rgba(31,42,68,.14)!important;transition:transform .18s var(--spring)}
.sw button:active{transform:scale(.88)}
.sw button[aria-pressed=true]{box-shadow:0 0 0 2.5px #fff,0 0 0 4px var(--navy)!important}
.sw label{border:0!important;background:var(--tile);color:var(--navy)}
.txt{border:0!important;background:var(--tile)!important;color:var(--navy)}
.txt:focus{outline:none;box-shadow:0 0 0 1.5px var(--navy)}
.btn{border:0!important;border-radius:14px!important;background:var(--tile)!important;color:var(--navy)!important;transition:transform .18s var(--spring)}
.btn:active{transform:scale(.97)}
.btn.dark{background:var(--navy)!important;color:#fff!important}
.btn.red{background:var(--tile)!important;color:#e5484d!important}
.btn.yel{background:var(--yel)!important}
.tabs5{padding:3px;border-radius:13px;background:var(--tile)}
.tabs5 button{color:var(--navy)!important;transition:background .2s}
.tabs5 button[aria-pressed=true]{background:var(--cream)!important;color:var(--navy)!important;box-shadow:0 0 0 1.5px var(--navy)}
.note{color:var(--sub)!important}
.sheet{background:rgba(20,24,40,.32)!important;z-index:50!important}
.sheet .in{background:var(--card)!important;border-radius:26px 26px 0 0!important;box-shadow:0 -10px 40px rgba(31,42,68,.14);animation:sheetUp .42s var(--spring)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.sheet h2{color:var(--navy);letter-spacing:.02em!important;text-transform:none!important}
.sheet .x{border:0!important;background:var(--tile)!important;color:var(--navy)}
.sheet .grip{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.starters{background:var(--bg)!important}
.starters .grid canvas{border:0!important;border-radius:16px!important;box-shadow:0 2px 10px rgba(31,42,68,.12)}
.cloths{background:rgba(255,255,255,.97)!important;border-top:0!important;box-shadow:0 -6px 24px rgba(31,42,68,.10)}
.pick.nocol{width:100%}
.clear{display:inline-block;width:22px;height:22px;border-radius:50%;background:repeating-conic-gradient(#d9dce6 0 25%,#fff 0 50%) 0 0/10px 10px;box-shadow:inset 0 0 0 1px rgba(31,42,68,.18)}
</style>
</head>
<body>
<header class="top"><a href="/creator-tools.html" aria-label="Back to tools">&lsaquo;</a><b>Patterns</b></header>
<div class="stage" id="stage">
  <canvas id="view"></canvas>
  <div class="fl" style="left:8px;top:8px"><button class="chip" id="undo" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button><button class="chip" id="redo" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button></div>
  <div class="fl" style="right:8px;top:8px"><div class="seg3" id="views"><button data-v="tile">Tile</button><button data-v="swatch">Swatch</button><button data-v="yard">Yard</button></div><button class="chip" id="help" aria-label="Help">?</button></div>
  <div class="fl" style="right:8px;top:50px"><button class="chip" id="clothChip" hidden aria-label="Printed on">Poplin</button></div>
  <div class="fl" id="tools"></div>
  <div class="cloths" id="cloths" hidden></div>
  <div class="lbl" id="lbl"></div>
  <div class="menu" id="menu" hidden></div>
  <div id="ctx"><button data-m="copy">Copy</button><button data-m="front">Front</button><button data-m="back">Back</button><button data-m="del" class="del">Delete</button></div>
  <button id="fab" aria-label="Add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <div class="home" id="home" hidden>
    <a class="alt" href="/creator-tools.html" style="position:absolute;left:14px;top:max(14px,env(safe-area-inset-top))">&lsaquo; Tools</a><h1>Patterns</h1>
    <button class="drop" id="drop">Drop your logo or art<small>PNG works best. We make 6 patterns from it.</small></button>
    <button class="alt" id="blank">Start blank</button>
  </div>
  <div class="starters" id="starters" hidden>
    <p class="h" style="margin:4px 0 10px">Pick one to start</p>
    <div class="grid" id="sgrid"></div>
    <div class="bar"><button class="btn" id="shuffle">Shuffle</button><button class="btn" id="sclose">Keep mine</button></div>
  </div>
</div>
<div class="panel" id="panel"></div>
<nav class="steps" id="steps"><button data-s="make"><svg viewBox="0 0 24 24"><path d="M12 20l8-8-4-4-8 8v4z"/><path d="M14 6l4 4"/></svg>Make</button><button data-s="look"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Look</button><button data-s="save"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>Save</button></nav>
<input type="file" id="artfile" accept="image/*" multiple hidden>
<input type="file" id="lfile" accept="image/png,image/*" hidden>
<div class="sheet" id="helpSheet" hidden><div class="in" id="helpIn"></div></div>
<div class="sheet" id="lsheet" hidden><div class="in" id="lsIn"></div></div>
<div class="sheet" id="addSheet" hidden><div class="in"><div class="grip"></div><div id="addIn"></div></div></div>
<script src="/crop.js"></script>
<script src="engine.js"></script>
<script src="letters.js"></script>
<script src="v2.js"></script>
</body>
</html>
