<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repeating Pattern | NOCIV</title>
<meta name="theme-color" content="#161616">
<link rel="manifest" href="/manifest.webmanifest">
<style>
@font-face{font-family:'FS Archivo Black';src:url('../scratch/kit/fonts/archivo-black.woff') format('woff');font-display:swap}
@font-face{font-family:'FS Syne';src:url('../scratch/kit/fonts/syne-800.woff') format('woff');font-weight:800;font-display:swap}
@font-face{font-family:'FS DM Serif Display';src:url('../scratch/kit/fonts/dm-serif-display.woff') format('woff');font-display:swap}
@font-face{font-family:'FS Rubik Mono One';src:url('../scratch/kit/fonts/rubik-mono-one.woff') format('woff');font-display:swap}
@font-face{font-family:'FS Permanent Marker';src:url('../scratch/kit/fonts/permanent-marker.woff') format('woff');font-display:swap}
@font-face{font-family:'FS Fraunces';src:url('../scratch/kit/fonts/fraunces-700.woff') format('woff');font-weight:700;font-display:swap}
@font-face{font-family:'FS Barlow Condensed';src:url('../scratch/kit/fonts/barlow-condensed-700.woff') format('woff');font-weight:700;font-display:swap}
@font-face{font-family:'FS Special Elite';src:url('../scratch/kit/fonts/special-elite.woff') format('woff');font-display:swap}
@font-face{font-family:'FS Tenor Sans';src:url('../scratch/kit/fonts/tenor-sans.woff') format('woff');font-display:swap}
@font-face{font-family:'FS Bricolage';src:url('../scratch/kit/fonts/bricolage-grotesque-800.woff') format('woff');font-weight:800;font-display:swap}
:root{--ink:#1a1a1a;--paper:#f3efe6;--panel:#fbf9f4;--line:#d9d4c8;--mute:#6f6a60;--red:#c8412f;--sys:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:500 15px/1.35 var(--sys);-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit}
/* top bar */
.top{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:var(--ink);color:#fff}
.top a.back{color:#fff;text-decoration:none;font:800 22px/1 var(--sys);padding:4px 8px}
.top b{font:900 14px/1 var(--sys);letter-spacing:.1em;text-transform:uppercase}
.top .sp{flex:1}
.top .tb{all:unset;cursor:pointer;width:36px;height:36px;display:grid;place-items:center;border:1.5px solid #fff;border-radius:10px;font:900 17px/1 var(--sys)}
html.embedded .top{display:none}
/* the picture: one fixed size while you work */
.stage{flex:1 1 auto;min-height:0;position:relative;background:#e7e2d6;overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.stage .tag{position:absolute;left:8px;bottom:8px;padding:4px 8px;border-radius:8px;background:rgba(26,26,26,.82);color:#fff;font:700 11.5px/1.2 var(--sys);pointer-events:none;max-width:calc(100% - 16px)}
.stage .views{position:absolute;right:8px;top:8px;display:flex;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff}
.stage .views button{all:unset;cursor:pointer;padding:7px 10px;font:800 12px/1 var(--sys)}
.stage .views button[aria-pressed=true]{background:var(--ink);color:#fff}
/* console */
.con{flex:none;height:318px;display:flex;flex-direction:column;background:var(--panel);border-top:1.5px solid var(--ink)}
.con.down{height:auto}
.con.down .pane{display:none}
.pane{flex:1 1 auto;min-height:0;overflow-y:auto;padding:10px 12px 10px}
.tabs{flex:none;display:flex;align-items:stretch;gap:4px;padding:6px 8px;border-top:1px solid var(--line)}
.con.down .tabs{border-top:0}
.tabs .tl{flex:1;min-width:0;display:flex;gap:4px}
.tabs .tl button{all:unset;cursor:pointer;flex:1 1 0;min-width:0;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:10px;color:#6f6a60;font:700 11px/1 var(--sys);-webkit-tap-highlight-color:transparent}
.tabs .tl button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs .tl button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs .tl button[aria-pressed=true]{background:var(--ink);color:#fff}
.tabs .rb{all:unset;cursor:pointer;flex:0 0 38px;width:38px;height:38px;align-self:center;display:grid;place-items:center;border-radius:50%;border:1.5px solid var(--ink);background:#fff}
.tabs .rb svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.con.down .tabs .rb.drop svg{transform:rotate(180deg)}
.tabs .rb.q{background:var(--ink);color:#fff;font:900 18px/1 var(--sys)}
/* bottom steps */
.bbar{flex:none;position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#fff;border-top:1.5px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
.bbar i{position:absolute;top:-1.5px;left:0;height:4px;background:var(--red)}
.bbar button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;color:#8d887d;font:800 11px/1 var(--sys)}
.bbar button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bbar button[aria-current=step]{color:var(--ink)}
.bbar button:disabled{opacity:.35}
/* controls */
.h{margin:0 0 6px;font:800 11px/1 var(--sys);letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.grid{display:grid;gap:7px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.pick{all:unset;cursor:pointer;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:7px 4px;min-height:44px;border:2px solid var(--ink);border-radius:12px;background:#fff;font:800 12.5px/1.15 var(--sys);-webkit-tap-highlight-color:transparent}
.pick small{font-weight:600;font-size:10.5px;color:var(--mute)}
.pick canvas,.pick svg.ic{width:100%;height:38px;border-radius:6px;display:block}
.grid.tight{gap:6px}.grid.tight .pick{padding:5px 3px;min-height:0;font-size:11.5px;border-width:1.5px;border-radius:10px;gap:3px}
.grid.tight .pick canvas{height:34px}
.grid.fabs{grid-template-columns:repeat(6,minmax(0,1fr))}.fabs .pick{font-size:10px!important;padding:4px 2px!important}.fabs .pick canvas{height:30px}.fabs .pick{position:relative}.fabs .pick.fit::after{content:'';position:absolute;top:4px;right:4px;width:9px;height:9px;border-radius:50%;background:var(--red);border:1.5px solid #fff}
.bands{gap:3px}.bands + .btn{padding:7px!important;margin-top:4px!important}.band .step button{height:28px}.band .step output{padding:6px 2px}.band .sw button{width:20px;height:20px}
.pick svg.sm{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pick[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.pick[aria-pressed=true] small{color:#d8d2c4}
.pick.big{min-height:86px;font-size:14px}
.pick.big svg.sm{width:32px;height:32px}
.row{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.row > b{flex:0 0 76px;font:800 12px/1.15 var(--sys)}
.step{display:flex;align-items:center;flex:1;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff}
.step button{all:unset;cursor:pointer;width:44px;height:38px;display:grid;place-items:center;font:900 20px/1 var(--sys);-webkit-tap-highlight-color:transparent}
.step output{flex:1;text-align:center;font:800 14px/1 var(--sys);border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink);padding:11px 2px}
.seg{display:flex;flex:1;min-width:0;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{all:unset;cursor:pointer;flex:1;text-align:center;padding:10px 2px;font:700 12.5px/1 var(--sys);background:#fff;white-space:nowrap}
.seg button + button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.txt{flex:1;min-width:0;height:40px;border:1.5px solid var(--ink);border-radius:10px;padding:0 10px;font:700 16px var(--sys);background:#fff}
.btn{all:unset;cursor:pointer;box-sizing:border-box;display:block;text-align:center;padding:12px 8px;border:2px solid var(--ink);border-radius:12px;background:#fff;font:800 13.5px/1.15 var(--sys)}
.btn.dark{background:var(--ink);color:#fff}.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.note{margin:6px 0 0;font:500 12px/1.35 var(--sys);color:var(--mute)}
.pals{display:flex;flex-direction:column;gap:6px}
.pals.two{display:grid;grid-template-columns:1fr 1fr}.pals.two .pal i{width:15px;height:15px}.pals.two .pal span{gap:2px}
.pal{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:5px 10px;border:2px solid var(--ink);border-radius:12px;background:#fff;font:800 13px/1 var(--sys)}
.pal span{display:flex;gap:4px;margin-left:auto}.pal i{width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(0,0,0,.25)}
.pal[aria-pressed=true]{outline:3px solid var(--red);outline-offset:1px}
.mine{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mine label{display:flex;align-items:center;gap:6px;padding:5px 7px;border:1.5px solid var(--ink);border-radius:10px;background:#fff;font:800 11.5px/1 var(--sys)}
.mine input[type=color]{width:30px;height:30px;border:0;padding:0;background:none;flex:none}
.bands{display:flex;flex-direction:column;gap:5px}
.band{display:flex;align-items:center;gap:6px}
.band .sw{display:flex;gap:4px}.band .sw button{all:unset;cursor:pointer;width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px #b9b5ab}
.band .sw button[aria-pressed=true]{box-shadow:0 0 0 2.5px var(--ink)}
.band .step{flex:1}.band .step button{width:36px;height:32px;font-size:17px}.band .step output{padding:8px 2px;font-size:12.5px}
.band .x{all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;font:900 16px var(--sys);color:var(--mute)}
.list{display:flex;flex-direction:column;gap:6px}
.list.two{display:grid;grid-template-columns:1fr 1fr;gap:5px}.list.two a{font-size:11px;padding:6px 8px;line-height:1.3}.list.two b{font-size:12.5px}
.list a,.list .it{display:block;padding:9px 11px;border:1.5px solid var(--ink);border-radius:11px;background:#fff;color:var(--ink);text-decoration:none;font:600 12.5px/1.35 var(--sys)}
.list b{display:block;font:800 13.5px/1.2 var(--sys);margin-bottom:2px}
.files{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pcodes{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}.pcodes .pcode code{display:none}
.pcode{display:flex;align-items:center;gap:6px;margin:0 0 5px}
.pcode i{width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(0,0,0,.3);flex:none}
.pcode code{font:700 11.5px/1 ui-monospace,Menlo,monospace;flex:0 0 66px}
.pcode input{flex:1;min-width:0;height:32px;border:1.5px solid var(--ink);border-radius:8px;padding:0 8px;font:600 14px var(--sys)}
/* help + learn sheet */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.sheet .in{width:100%;max-height:88dvh;overflow:auto;background:var(--panel);border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 8px;font:900 18px/1.1 var(--sys);text-transform:uppercase;letter-spacing:.04em}
.sheet .x{float:right;all:unset;cursor:pointer;float:right;width:36px;height:36px;display:grid;place-items:center;border:1.5px solid var(--ink);border-radius:50%;font:900 16px var(--sys)}
.sheet details{border:1.5px solid var(--ink);border-radius:12px;background:#fff;margin:0 0 8px;padding:0 12px}
.sheet summary{cursor:pointer;padding:12px 0;font:800 14.5px/1.2 var(--sys)}
.sheet details p,.sheet details li{font:500 13.5px/1.45 var(--sys);color:#2c2a26}
.sheet details ul{padding-left:18px;margin:0 0 12px}
.sheet a{color:var(--ink)}
@media(max-height:620px){.con{height:296px}.pick.big{min-height:70px}}
@media(min-width:900px){body{max-width:560px;margin:0 auto;border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink)}}
</style>
</head>
<body>
<header class="top"><a class="back" href="/creator-tools.html" aria-label="Back to tools">&lsaquo;</a><b>Repeating Pattern</b><span class="sp"></span><button class="tb" id="helpTop" aria-label="Help and Learn">?</button></header>
<section class="stage" id="stage" aria-label="Your pattern">
  <canvas id="view"></canvas>
  <div class="tag" id="tag">Pick what you are making</div>
  <div class="views" id="views" role="group" aria-label="How close"><button data-v="close">Close</button><button data-v="swatch" aria-pressed="true">Swatch</button><button data-v="yard">Yard</button></div>
</section>
<section class="con" id="con">
  <div class="pane" id="pane"></div>
  <div class="tabs"><div class="tl" id="parts" role="tablist"></div><button class="rb drop" id="drop" aria-label="Hide the controls"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button><button class="rb q" id="help" aria-label="Help and Learn">?</button></div>
</section>
<nav class="bbar" id="bbar" aria-label="Steps"></nav>
<input type="file" id="file" accept="image/*" hidden>
<div class="sheet" id="sheet" hidden><div class="in" id="sheetIn"></div></div>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
