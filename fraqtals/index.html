:root{
  --bg:#f2f2f7; --card:#ffffff; --tile:#eef0f6; --tile2:#e4e6ef; --icon:#7c7fa3; --ink:#1c1d2b; --sub:#8b8ea8; --line:#e3e5ee;
  --yel:#fdee4f; --red:#e3262e; --blue:#2d6cf6;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.4,.5,1);
  --top:58px; --panelH:206px; --dock:62px; --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font:500 13px/1.25 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.press{transition:transform .18s var(--spring)}
.press:active{transform:scale(.9)}

/* top */
#top{height:var(--top);flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:0 10px;padding-top:env(safe-area-inset-top,0px);box-sizing:content-box}
.ib{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--card);color:var(--icon);box-shadow:0 1px 2px rgba(28,29,43,.06);transition:transform .18s var(--spring),opacity .2s}
.ib:active{transform:scale(.88)}
.ib[disabled]{opacity:.35;pointer-events:none}
#itemChip{height:40px;border-radius:20px;background:var(--card);display:flex;align-items:center;gap:6px;padding:0 10px 0 5px;margin:0 auto;box-shadow:0 1px 2px rgba(28,29,43,.06);transition:transform .18s var(--spring)}
#itemChip:active{transform:scale(.94)}
#itemChip .sw{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
#itemChip .sw svg{width:17px;height:17px;stroke-width:1.6}
#itemChip b{font-size:14px;font-weight:650}
#itemChip svg.chev{width:16px;height:16px;color:var(--sub)}
#resetBtn.armed{background:#ffe1e1;color:#a11d22}
#mockBtn{width:46px;height:46px;border-radius:15px;background:var(--card);overflow:hidden;position:relative;box-shadow:0 1px 2px rgba(28,29,43,.06),0 0 0 1px var(--line);transition:transform .2s var(--spring)}
#mockBtn:active{transform:scale(.9)}
#mockBtn canvas{width:100%;height:100%;display:block}

/* stage */
#stage{position:relative;flex:1 1 auto;min-height:0;touch-action:none;overflow:hidden}
#cv,#fade{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fade{pointer-events:none;opacity:0}
#ctx{position:absolute;left:50%;top:6px;transform:translate(-50%,-6px) scale(.92);opacity:0;pointer-events:none;
  display:flex;gap:2px;background:var(--card);padding:5px;border-radius:18px;box-shadow:0 8px 24px rgba(28,29,43,.12),0 1px 2px rgba(28,29,43,.08);
  transition:opacity .2s,transform .3s var(--spring)}
#ctx.on{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
#ctx button{width:42px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--icon)}
#ctx button:active{background:var(--tile)}
#ctx button.on{background:var(--ink);color:#fff}
#ctx button.del{color:#e5484d}
#nudge{position:absolute;left:50%;top:58px;transform:translate(-50%,-6px) scale(.92);opacity:0;pointer-events:none;background:var(--card);border-radius:18px;padding:6px;box-shadow:0 8px 24px rgba(28,29,43,.12);
  display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,40px);gap:2px;transition:opacity .2s,transform .3s var(--spring)}
#nudge.on{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
#nudge button{border-radius:12px;display:grid;place-items:center;color:var(--icon)}
#nudge button:active{background:var(--tile)}
.fab{position:absolute;width:44px;height:44px;border-radius:15px;background:var(--card);color:var(--icon);display:grid;place-items:center;box-shadow:0 2px 10px rgba(28,29,43,.10);transition:transform .2s var(--spring)}
.fab:active{transform:scale(.88)}
#zoomBtn{right:12px;bottom:4px;width:40px;height:40px;border-radius:13px}
#rail{position:absolute;right:8px;top:58px;display:flex;flex-direction:column;gap:4px;padding:5px;background:var(--card);border-radius:18px;box-shadow:0 8px 24px rgba(28,29,43,.12),0 1px 2px rgba(28,29,43,.08);
  transform:translateX(80px);opacity:0;pointer-events:none;transition:transform .38s var(--spring),opacity .2s}
#rail.on{transform:none;opacity:1;pointer-events:auto}
#rail button{width:48px;height:48px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--icon);transition:background .2s,color .2s,transform .18s var(--spring)}
#rail button svg{width:21px;height:21px}
#rail button small{font-size:9px;font-weight:700;color:var(--sub)}
#rail button .tx{font-size:17px;font-weight:700;line-height:21px;color:inherit}
#rail button.on{background:var(--ink);color:#fff}
#rail button.on small{color:#fff}
#rail button:active{transform:scale(.9)}
body.editing #panel, body.editing #dock, body.editing #rail, body.editing #ctx, body.editing #sizePill, body.editing #zoomBtn{display:none}
body.editing #app{height:var(--vvh,100%);top:var(--vvt,0)}
#sizePill{position:absolute;left:12px;bottom:9px;height:30px;padding:0 10px;border-radius:12px;background:rgba(255,255,255,.9);color:var(--sub);display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;pointer-events:none}
#sizePill svg{width:16px;height:16px}
#warnDot{position:absolute;left:50%;transform:translateX(-50%);bottom:9px;height:30px;padding:0 10px;border-radius:12px;background:#fff6c7;color:#7a5b00;display:none;align-items:center;gap:6px;font-size:12px;font-weight:600}
#warnDot.red{background:#ffe1e1;color:#a11d22}
#warnDot svg{width:16px;height:16px}

/* panel */
#panel{height:var(--panelH);flex:0 0 auto;background:var(--card);border-radius:24px 24px 0 0;position:relative;overflow:hidden;box-shadow:0 -4px 24px rgba(28,29,43,.06)}
.pv{position:absolute;inset:0;display:flex;flex-direction:column;padding:12px 0 0;opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .22s,transform .38s var(--spring)}
.pv.on{opacity:1;transform:none;pointer-events:auto}
.subs{display:flex;gap:6px;padding:0 12px 10px;flex:0 0 auto}
.sb{flex:1 1 0;height:42px;min-width:0;border-radius:14px;background:var(--tile);display:grid;place-items:center;color:var(--icon);transition:background .22s,color .22s,transform .18s var(--spring)}
.sb.on{background:var(--ink);color:#fff}
.sb:active{transform:scale(.92)}
.sb .tx{font-size:16px;font-weight:700}
.body{flex:1 1 auto;position:relative;min-height:0}
.sec{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:0 12px 6px;opacity:0;pointer-events:none;transform:translateX(18px);transition:opacity .2s,transform .32s var(--spring)}
.sec.on{opacity:1;pointer-events:auto;transform:none}
.grid{display:grid;gap:8px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}.g7{grid-template-columns:repeat(7,minmax(0,1fr))}
.tile{height:64px;border-radius:16px;background:var(--tile);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--icon);position:relative;transition:transform .18s var(--spring),box-shadow .2s,background .2s}
.tile:active{transform:scale(.93)}
.tile.on{box-shadow:0 0 0 2.5px var(--ink);background:#fff}
.tile small{font-size:10.5px;color:var(--sub);font-weight:600}
.tile.big{height:auto;flex-direction:row;gap:10px;padding:14px;justify-content:flex-start}
.tile.cta{background:var(--yel);color:var(--ink)}
.tile.cta small,.tile.cta b{color:var(--ink)}
.tile b{font-size:15px;font-weight:700;color:var(--ink)}
.tile canvas{border-radius:10px;display:block}
.tile.dim{opacity:.4}
.catbtn{justify-content:center;gap:10px;height:64px}
.catbtn b{font-size:17px}
.catbtn svg:last-child{width:18px;height:18px;margin-left:auto}
.catbtn svg:first-child{margin-left:4px}
.fontT{height:46px;border-radius:14px;background:var(--tile);display:grid;place-items:center;font-size:22px;line-height:1;color:var(--ink);transition:box-shadow .2s,transform .18s var(--spring);overflow:hidden}
.fontT.on{box-shadow:0 0 0 2.5px var(--ink);background:#fff}
.fontT:active{transform:scale(.92)}
.dots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;justify-items:center}
.dot{width:36px;height:36px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);transition:transform .18s var(--spring),box-shadow .2s;position:relative}
.dot.on{box-shadow:0 0 0 2.5px #fff,0 0 0 4.5px var(--ink)}
.dot:active{transform:scale(.86)}
.dot.auto{background:conic-gradient(#fff 0 50%,#1c1d2b 0)}
.dot.pick{background:conic-gradient(#ff3b30,#ffcc00,#34c759,#00c7ff,#5856d6,#ff2d92,#ff3b30);display:grid;place-items:center}
.dot.pick i{width:18px;height:18px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--ink)}
.dot.pick i svg{width:14px;height:14px;stroke-width:2.6}
.pal{height:42px;border-radius:14px;background:var(--tile);display:flex;align-items:center;justify-content:center;gap:4px;transition:box-shadow .2s,transform .18s var(--spring)}
.pal i{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.pal.on{box-shadow:0 0 0 2.5px var(--ink);background:#fff}
.pal:active{transform:scale(.93)}
.pal svg{width:16px;height:16px;color:var(--icon)}
.slide{display:flex;align-items:center;gap:12px;padding:0 4px;color:var(--icon)}
.slide svg{flex:0 0 auto;width:22px;height:22px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:34px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--tile2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;margin-top:-11px;box-shadow:0 1px 2px rgba(0,0,0,.2),0 2px 10px rgba(28,29,43,.18)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--tile2)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(28,29,43,.2)}
.tog{height:52px;border-radius:16px;background:var(--tile);display:flex;align-items:center;justify-content:center;gap:8px;color:var(--icon);font-weight:650;transition:background .2s,color .2s,transform .18s var(--spring)}
.tog span{color:var(--ink);font-size:13px}
.tog.on{background:var(--ink);color:#fff}
.tog.on span{color:#fff}
.tog:active{transform:scale(.95)}
.tog.busy{opacity:.6}

/* dock */
#dock{height:calc(var(--dock) + var(--sb));flex:0 0 auto;background:var(--card);display:flex;padding:0 6px var(--sb);border-top:1px solid var(--line);position:relative}
#dock button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--icon);position:relative;transition:color .25s}
#dock button small{font-size:10.5px;font-weight:650;color:var(--sub);transition:color .25s}
#dock button.on{color:var(--ink)}
#dock button.on small{color:var(--ink)}
#dockBar{position:absolute;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--ink);transition:transform .45s var(--spring),width .35s var(--ease)}

/* sheets */
.sheet{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end;pointer-events:none}
.sheet .scrim{position:absolute;inset:0;background:rgba(20,21,33,.32);opacity:0;transition:opacity .25s}
.sheet .card{position:relative;background:var(--card);border-radius:26px 26px 0 0;padding:10px 14px calc(18px + var(--sb));transform:translateY(105%);transition:transform .42s var(--spring);box-shadow:0 -10px 40px rgba(28,29,43,.12)}
.sheet.on{pointer-events:auto}
.sheet.on .scrim{opacity:1}
.sheet.on .card{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:#d6d8e3;margin:0 auto 12px}
.shead{display:flex;align-items:center;gap:10px;margin:0 0 12px;min-height:36px}
.shead h3{margin:0;font-size:18px;font-weight:750;flex:1}
.giftT{height:96px;border-radius:18px;background:var(--tile);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--icon);transition:box-shadow .2s,transform .18s var(--spring)}
.giftT svg{width:32px;height:32px;stroke-width:1.7}
.giftT b{font-size:12px;color:var(--ink)}
.giftT small{color:var(--sub);font-size:10px;font-weight:600}
.giftT.on{box-shadow:0 0 0 2.5px var(--ink);background:#fff}
.giftT:active{transform:scale(.94)}

/* templates browser */
#tplSheet .card{height:calc(100% - 44px - env(safe-area-inset-top,0px));display:flex;flex-direction:column}
#tplWrap{position:relative;flex:1;min-height:0;overflow:hidden}
.tpage{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,minmax(0,1fr));gap:10px;transition:transform .42s var(--spring),opacity .3s}
.tcard{border-radius:18px;background:var(--tile);overflow:hidden;position:relative;display:flex;flex-direction:column;transition:transform .18s var(--spring),box-shadow .2s;min-height:0}
.tcard:active{transform:scale(.96)}
.tcard canvas{flex:1;min-height:0;width:100%;display:block}
.tcard .lab{height:34px;display:flex;align-items:center;gap:6px;padding:0 10px;font-weight:700;font-size:13px;background:var(--card);color:var(--ink)}
.tcard .lab svg{width:18px;height:18px;color:var(--icon)}
.tcard.on{box-shadow:0 0 0 3px var(--ink)}

/* color picker */
#cpSV{width:100%;height:170px;border-radius:16px;display:block;touch-action:none}
#cpHue{width:100%;height:26px;border-radius:13px;display:block;margin:12px 0;touch-action:none}
.cprow{display:flex;gap:8px;align-items:center}
#cpSw{width:44px;height:44px;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
#cpHex{flex:1;height:44px;border-radius:14px;border:0;background:var(--tile);padding:0 12px;font:600 16px ui-monospace,Menlo,monospace;color:var(--ink);outline:none;-webkit-user-select:text;user-select:text;text-transform:uppercase}
#cpRecent{display:flex;gap:8px;margin:12px 0;min-height:30px;align-items:center}
#cpRecent .dot{width:30px;height:30px}
.cta{height:52px;border-radius:16px;background:var(--yel);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:15px;width:100%;transition:transform .18s var(--spring)}
.cta:active{transform:scale(.96)}
.ghost{height:46px;border-radius:14px;background:var(--tile);display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink);font-weight:650;width:100%}
#natColor{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}

#mockSheet{position:fixed;inset:0;z-index:60;background:rgba(242,242,247,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;opacity:0;pointer-events:none;transition:opacity .25s}
#mockSheet.on{opacity:1;pointer-events:auto}
#mockBig{width:min(92vw,60vh);height:min(92vw,60vh);border-radius:26px;background:#eee;box-shadow:0 20px 50px rgba(28,29,43,.15);transform:scale(.5) translate(40%,-70%);transition:transform .5s var(--spring)}
#mockSheet.on #mockBig{transform:none}
#mockClose{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px}
#mockColors{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:92vw}

#editBar{position:fixed;left:0;right:0;top:0;z-index:70;background:var(--card);padding:10px 12px;display:flex;gap:10px;align-items:flex-end;transform:translateY(-120%);transition:transform .3s var(--ease);box-shadow:0 -6px 24px rgba(28,29,43,.10);border-radius:20px 20px 0 0}
#editBar:not(.on){display:none}
#editBar.on{transform:none}
#editTxt{flex:1;min-height:48px;max-height:120px;border-radius:14px;border:0;background:var(--tile);color:var(--ink);padding:12px;font:650 18px/1.25 -apple-system,system-ui,sans-serif;resize:none;outline:none;-webkit-user-select:text;user-select:text}
#editDone{width:48px;height:48px;border-radius:14px;background:var(--ink);color:#fff;display:grid;place-items:center}

#toast{position:fixed;left:50%;bottom:calc(var(--panelH) + var(--dock) + var(--sb) + 14px);transform:translate(-50%,16px);opacity:0;z-index:80;background:var(--ink);color:#fff;border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;transition:opacity .25s,transform .35s var(--spring);pointer-events:none;max-width:90vw;box-shadow:0 8px 24px rgba(28,29,43,.25)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast svg{width:18px;height:18px;flex:0 0 auto}
.hrow{display:flex;align-items:center;gap:12px;padding:6px 2px;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow .hi{width:40px;height:40px;border-radius:13px;background:var(--tile);color:var(--icon);display:grid;place-items:center;flex:0 0 auto}
.hrow .hi svg{width:21px;height:21px}
.hrow b{display:block;font-size:14px;font-weight:700}
.hrow span{display:block;font-size:12.5px;color:var(--sub);font-weight:500;margin-top:1px}
.issue{display:flex;align-items:center;gap:12px;background:var(--tile);border-radius:16px;padding:12px;color:var(--icon);margin-bottom:8px}
.issue span{flex:1;font-size:13.5px;color:var(--ink);font-weight:600}
.issue button{background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px;font-weight:700;font-size:12px}
.credit{font-size:10.5px;color:#a7a9bd;text-align:center;font-weight:600;letter-spacing:.02em}
.credit a{color:inherit;text-decoration:none}
#sent{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(242,242,247,.92);opacity:0;pointer-events:none;transition:opacity .3s}
#sent.on{opacity:1;pointer-events:auto}
#sent .ring{width:116px;height:116px;border-radius:50%;background:var(--ink);color:var(--yel);display:grid;place-items:center;transform:scale(.4);transition:transform .55s var(--spring)}
#sent.on .ring{transform:none}
#sent .ring svg{width:56px;height:56px;stroke-width:2.6}
#busy{position:fixed;inset:0;z-index:95;display:none;place-items:center;background:rgba(242,242,247,.7)}
#busy.on{display:grid}
#busy div{display:flex;flex-direction:column;align-items:center;gap:12px;font-weight:650;color:var(--sub)}
#busy i{width:44px;height:44px;border-radius:50%;border:4px solid var(--tile2);border-top-color:var(--ink);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#pickHint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:9px 14px;font-weight:650;display:none;align-items:center;gap:8px;z-index:5}
#pickHint.on{display:flex}
#pickHint svg{width:18px;height:18px}
@media (max-height:700px){:root{--panelH:192px;--top:52px}}
@media (min-width:700px){#app{max-width:520px;margin:0 auto;left:0;right:0;box-shadow:0 0 0 1px var(--line)}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button class="ib" id="undo" aria-label="Undo"></button>
    <button class="ib" id="redo" aria-label="Redo"></button>
    <button id="itemChip" aria-label="Choose item"><span class="sw" id="itemSw"></span><b id="itemName">Tee</b></button>
    <button class="ib" id="resetBtn" aria-label="Start over"></button>
    <button class="ib" id="helpBtn" aria-label="How it works"></button>
    <button id="mockBtn" aria-label="See it on the item"><canvas id="mockMini" width="100" height="100"></canvas></button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <canvas id="fade"></canvas>
    <div id="ctx"></div>
    <div id="nudge"></div>
    <div id="rail"></div>
    <div id="pickHint"></div>
    <div id="sizePill"></div>
    <div id="warnDot"></div>
    <button class="fab" id="zoomBtn" aria-label="Zoom"></button>
  </div>
  <div id="panel"></div>
  <div id="dock"><div id="dockBar"></div></div>
</div>

<div class="sheet" id="itemSheet"><div class="scrim"></div><div class="card">
  <div class="grab"></div>
  <div class="grid g5" id="itemGrid"></div>
  <div style="height:16px"></div>
  <div class="dots" id="garmentDots"></div>
</div></div>

<div class="sheet" id="tplSheet"><div class="scrim"></div><div class="card">
  <div class="grab"></div>
  <div class="shead"><button class="ib" id="tplBack" aria-label="Back" style="display:none"></button><h3 id="tplTitle">Templates</h3><button class="ib" id="tplClose" aria-label="Close"></button></div>
  <div id="tplWrap"></div>
</div></div>

<div class="sheet" id="cpSheet"><div class="scrim"></div><div class="card">
  <div class="grab"></div>
  <canvas id="cpSV"></canvas>
  <canvas id="cpHue"></canvas>
  <div class="cprow"><span id="cpSw"></span><input id="cpHex" maxlength="7" spellcheck="false" autocomplete="off" inputmode="text"><button class="ib" id="cpDrop" aria-label="Pick from the design"></button><button class="ib" id="cpMore" aria-label="More colors"></button></div>
  <div id="cpRecent"></div>
  <button class="cta" id="cpUse"></button>
  <input type="color" id="natColor">
</div></div>

<div class="sheet" id="palSheet"><div class="scrim"></div><div class="card">
  <div class="grab"></div>
  <div class="grid g3" id="palSlots" style="margin-bottom:14px"></div>
  <button class="cta" id="palUse"></button>
</div></div>

<div id="mockSheet">
  <button class="ib" id="mockClose" aria-label="Close"></button>
  <canvas id="mockBig" width="900" height="900"></canvas>
  <div id="mockColors"></div>
</div>

<div class="sheet" id="helpSheet"><div class="scrim"></div><div class="card">
  <div class="grab"></div>
  <div class="shead"><h3>How it works</h3><button class="ib" id="helpClose" aria-label="Close"></button></div>
  <div id="helpList"></div>
  <button class="cta" id="helpGo" style="margin-top:12px"></button>
</div></div>

<div class="sheet" id="doneSheet"><div class="scrim"></div><div class="card">
  <div class="grab"></div>
  <div id="issues"></div>

const MP_VER='0.10.14';

async function cutOutPerson(btn){
  const o=selObj(); if(!o||!o.src) return;

  if (im.derived){ o.src=im.derived; commit(); renderPanel(); dirty(); return; } // tap again to undo the cut
  btn.classList.add('busy'); busy(true,'Finding the person');
  try{
    if(!segmenter){
      const mp=await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}/vision_bundle.mjs`);
      const fs=await mp.FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}/wasm`);
      segmenter=await mp.ImageSegmenter.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite'},runningMode:'IMAGE',outputCategoryMask:false,outputConfidenceMasks:true});
    }

    mx.putImageData(md,0,0); res.close&&res.close();

    ox.imageSmoothingQuality='high'; ox.drawImage(mc,0,0,w,h); ox.globalCompositeOperation='source-in'; ox.drawImage(src,0,0);

async function renderPrint(){
  const W=PW(),Hh=PH(); const c=document.createElement('canvas'); c.width=W; c.height=Hh; const x=c.getContext('2d',{willReadFrequently:true});
  await document.fonts.ready;

  dtfClean(x,W,Hh);
  return c;
}
function dtfClean(x,W,Hh){
  const d=x.getImageData(0,0,W,Hh), a=d.data, n=W*Hh;
  // 1. no semi-transparent pixels: DTF prints them muddy or drops them
  const on=new Uint8Array(n);
  for(let i=0,j=3;i<n;i++,j+=4){ if(a[j]>=DTF.alphaCut){ a[j]=255; on[i]=1; } else { a[j]=0; } }
  // 2. remove specks too small to transfer (connected ink areas under DTF.speck pixels)
  const seen=new Uint8Array(n), stack=new Int32Array(n); let removed=0;
  for(let i=0;i<n;i++){ if(!on[i]||seen[i]) continue; let sp=0, cnt=0; stack[sp++]=i; seen[i]=1; const start=i; const list=[];
    while(sp){ const p=stack[--sp]; cnt++; if(cnt<=DTF.speck) list.push(p); const px=p%W;
      if(px>0){ const q=p-1; if(on[q]&&!seen[q]){ seen[q]=1; stack[sp++]=q; } } if(px<W-1){ const q=p+1; if(on[q]&&!seen[q]){ seen[q]=1; stack[sp++]=q; } }
      if(p>=W){ const q=p-W; if(on[q]&&!seen[q]){ seen[q]=1; stack[sp++]=q; } } if(p<n-W){ const q=p+W; if(on[q]&&!seen[q]){ seen[q]=1; stack[sp++]=q; } } }
    if(cnt<DTF.speck){ for(const p of list) a[p*4+3]=0; removed++; } void start; }
  x.putImageData(d,0,0);
  lastClean={removed};
}

  let g=x.createLinearGradient(0,0,W,0); g.addColorStop(0,'#fff'); g.addColorStop(1,'rgba(255,255,255,0)'); x.fillStyle=g; x.fillRect(0,0,W,Hh);
  g=x.createLinearGradient(0,0,0,Hh); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'#000'); x.fillStyle=g; x.fillRect(0,0,W,Hh);
  const px=cp.s*W, py=(1-cp.v)*Hh; x.lineWidth=6; x.strokeStyle='#fff'; x.beginPath(); x.arc(px,py,20,0,Math.PI*2); x.stroke(); x.lineWidth=2; x.strokeStyle='rgba(0,0,0,.35)'; x.beginPath(); x.arc(px,py,24,0,Math.PI*2); x.stroke();
  const hu=$('cpHue'), y=hu.getContext('2d'); const hg=y.createLinearGradient(0,0,hu.width,0); for(let i=0;i<=6;i++) hg.addColorStop(i/6,`hsl(${i*60},100%,50%)`);
  y.clearRect(0,0,hu.width,hu.height); y.fillStyle=hg; y.beginPath(); roundRect(y,0,0,hu.width,hu.height,hu.height/2); y.fill();
  const hx=cp.h/360*hu.width; y.fillStyle='#fff'; y.shadowColor='rgba(0,0,0,.35)'; y.shadowBlur=6; y.beginPath(); y.arc(Math.min(hu.width-hu.height/2,Math.max(hu.height/2,hx)),hu.height/2,hu.height/2-2,0,Math.PI*2); y.fill(); y.shadowColor='transparent';
  const hex=cpHex(); $('cpSw').style.background=hex; if(document.activeElement!==$('cpHex')) $('cpHex').value=hex.toUpperCase();
  const r=$('cpRecent'); r.innerHTML=''; (S.recent||[]).slice(0,8).forEach(c=>{ const d=el('button','dot'); d.style.background=c; d.onclick=()=>{ [cp.h,cp.s,cp.v]=rgb2hsv(...hexRgb(c)); drawCp(); }; r.append(d); });

function dragOn(c,fn){ c.addEventListener('pointerdown',e=>{ c.setPointerCapture(e.pointerId); fn(e); const mv=ev=>fn(ev), up=()=>{ c.removeEventListener('pointermove',mv); c.removeEventListener('pointerup',up); }; c.addEventListener('pointermove',mv); c.addEventListener('pointerup',up); }); }
dragOn($('cpSV'),e=>{ const r=$('cpSV').getBoundingClientRect(); cp.s=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)); cp.v=Math.max(0,Math.min(1,1-(e.clientY-r.top)/r.height)); drawCp(); });
dragOn($('cpHue'),e=>{ const r=$('cpHue').getBoundingClientRect(); cp.h=Math.max(0,Math.min(359.9,(e.clientX-r.left)/r.width*360)); drawCp(); });
$('cpHex').oninput=()=>{ const v=$('cpHex').value.trim(); if(/^#?[0-9a-f]{6}$/i.test(v)){ [cp.h,cp.s,cp.v]=rgb2hsv(...hexRgb(v)); drawCp(); } };
$('cpUse').onclick=()=>{ const hex=cpHex(); S.recent=[hex,...(S.recent||[]).filter(c=>c!==hex)].slice(0,8); closeSheet('cpSheet'); cp.cb&&cp.cb(hex); };
$('cpMore').onclick=()=>{ const n=$('natColor'); n.value=cpHex(); n.click(); };
$('natColor').oninput=e=>{ [cp.h,cp.s,cp.v]=rgb2hsv(...hexRgb(e.target.value)); drawCp(); };

let pickMode=false;
$('cpDrop').onclick=()=>{ closeSheet('cpSheet'); pickMode=true; const h=$('pickHint'); h.innerHTML=ic('picker')+'<span>Tap the design to pick a color</span>'; h.classList.add('on'); };
function samplePick(X,Y){ const r=cv.getBoundingClientRect(); const px=Math.round((X-r.left)*DPR), py=Math.round((Y-r.top)*DPR);
  const d=cx.getImageData(Math.max(0,px-1),Math.max(0,py-1),3,3).data; let R=0,Gc=0,B=0; for(let i=0;i<d.length;i+=4){ R+=d[i];Gc+=d[i+1];B+=d[i+2]; }
  const hex=rgbHex(R/9,Gc/9,B/9); [cp.h,cp.s,cp.v]=rgb2hsv(...hexRgb(hex)); pickMode=false; $('pickHint').classList.remove('on'); openSheet('cpSheet'); requestAnimationFrame(drawCp); }

/* custom palette */
function openPalSheet(done){ const g=$('palSlots'); g.innerHTML='';
  ['a','b','c'].forEach(r=>{ const b=el('button','tile'); b.style.height='84px'; const d=el('span','dot'); d.style.width=d.style.height='44px'; d.style.background=resolve(S.custom[r]); b.append(d); b.insertAdjacentHTML('beforeend',`<small>${r==='a'?'Main':r==='b'?'Second':'Accent'}</small>`);
    b.onclick=()=>{ closeSheet('palSheet'); openPicker(S.custom[r],hex=>{ S.custom[r]=hex; openPalSheet(done); }); }; g.append(b); });
  $('palUse').innerHTML=ic('check')+'<span>Use my colors</span>'; $('palUse').onclick=()=>{ closeSheet('palSheet'); done(); }; openSheet('palSheet'); }

  const k=Math.min((c.width-14)/W,(c.height-14)/Hh), ox=(c.width-W*k)/2, oy=(c.height-Hh*k)/2;
  x.save(); x.translate(ox,oy); x.scale(k,k); x.shadowColor='rgba(28,29,43,.18)'; x.shadowBlur=10/k; x.shadowOffsetY=3/k; x.fillStyle=S.color; x.fillRect(0,0,W,Hh); x.shadowColor='transparent';
  x.beginPath(); x.rect(0,0,W,Hh); x.clip(); const objs=buildTemplate(t,true); if(noPhoto) objs.forEach(o=>{ if(o.type==='img') o.src=null; });
  for(const o of objs) drawObj(x,o,k,'thumb'); x.restore();
}
function applyTemplate(t){ crossfade(); const before=S.objs.map(o=>({x:o.x,y:o.y}));
  S.objs=buildTemplate(t,false); S.tpl=t.id; S.touched=false; sel=null; procCache.clear(); commit(); buildCtx(); updWarn();
  // pieces settle into place
  const fin=S.objs.map(o=>({x:o.x,y:o.y,s:o.scale})); S.objs.forEach((o,i)=>{ o.scale=fin[i].s*0.92; o.y=fin[i].y+PH()*0.015; });
  tween(420,e=>{ const sp=1+Math.sin(e*Math.PI)*0.03; S.objs.forEach((o,i)=>{ o.scale=fin[i].s*(0.92+0.08*e)*sp; o.y=fin[i].y+PH()*0.015*(1-e); }); dirty(); }, ()=>{ S.objs.forEach((o,i)=>{ o.scale=fin[i].s; o.y=fin[i].y; }); dirty(); });
  void before; renderPanel(); }

/* template browser: 6 categories on one screen, 6 templates inside each, nothing hidden */
let tplCat=null;
function openTemplates(){ tplCat=null; openSheet('tplSheet'); requestAnimationFrame(()=>renderTpl(0)); }
function renderTpl(dir){
  const wrap=$('tplWrap'); const pg=el('div','tpage'); const old=wrap.querySelector('.tpage');
  $('tplBack').style.display=tplCat?'grid':'none'; $('tplTitle').textContent=tplCat?CATS.find(c=>c[0]===tplCat)[1]:'Templates';
  const items = tplCat ? TEMPLATES.filter(t=>t.cat===tplCat) : CATS.map(c=>({cat:c, t:TEMPLATES.find(t=>t.cat===c[0] && t.id===({street:'s3',events:'e1',memory:'m1',words:'w3',photo:'p3',brand:'b4'})[c[0]])}));
  items.forEach(it=>{ const card=el('button','tcard'+((tplCat&&S.tpl===it.id)||(!tplCat&&curCat()===it.cat[0])?' on':'')); const c=document.createElement('canvas'); card.append(c);
    if(!tplCat) card.append(el('div','lab',ic(it.cat[2])+it.cat[1]));
    card.onclick=()=>{ if(!tplCat){ tplCat=it.cat[0]; renderTpl(1); } else { applyTemplate(it); closeSheet('tplSheet'); } };
    pg.append(card); });
  pg.style.transform=`translateX(${dir*40}px)`; pg.style.opacity=dir?'0':'1'; wrap.append(pg);
  requestAnimationFrame(()=>{ pg.querySelectorAll('canvas').forEach((c,i)=>{ const r=c.getBoundingClientRect(); c.width=Math.round(r.width*2); c.height=Math.round(r.height*2); const t=tplCat?items[i]:items[i].t; drawTemplateThumb(c,t); });
    pg.style.transform='none'; pg.style.opacity='1'; if(old){ old.style.transform=`translateX(${-dir*40}px)`; old.style.opacity='0'; setTimeout(()=>old.remove(),320); } });
}
function curCat(){ const t=TEMPLATES.find(t=>t.id===S.tpl); return t&&t.cat; }
$('tplBack').onclick=()=>{ tplCat=null; renderTpl(-1); };
$('tplClose').onclick=()=>closeSheet('tplSheet');

function noLayout(){ if(!S.objs.length&&!S.tpl) return; crossfade(); S.objs=[]; S.tpl=null; S.touched=false; sel=null; commit(); buildCtx(); updWarn(); dirty(); renderPanel(); toast('restart','Blank. Add text or a photo.'); }
/* shuffle: same template, new color set and matching fonts */
const FONT_FAMILY={bold:['anton','oswald','bebas','archivo','archivox','bowlby','grotesk','varsity','gothic','serif'],script:['script','graffiti']};
function shuffle(){ if(!S.tpl){ toast('shuffle','Pick a template first'); return; }
  S.shuffle=(S.shuffle||0)+1; const n=S.shuffle;
  S.pal = n % PALETTES.length; S.objs.forEach(o=>{ delete o.color; delete o.strokeColor; delete o.ringColor; });
  const texts=S.objs.filter(o=>o.type==='text'); if(texts.length){ const big=texts.reduce((a,b)=>a.size*a.scale>b.size*b.scale?a:b); const fam=FONT_FAMILY[FONTS[big.font].kind]; if(n%2===0) big.font=fam[(fam.indexOf(big.font)+1)%fam.length]; }
  procCache.clear(); crossfade(); commit(); dirty(); renderPanel(); toast('shuffle'); }

/* ---------- save on this phone ---------- */
let db=null;
function idb(){ return new Promise(res=>{ try{ const r=indexedDB.open('fraqtals-editor',1); r.onupgradeneeded=()=>{ r.result.createObjectStore('kv'); r.result.createObjectStore('img'); }; r.onsuccess=()=>{ db=r.result; res(db); }; r.onerror=()=>res(null); }catch(e){ res(null); } }); }
function put(store,key,val){ if(!db) return; try{ db.transaction(store,'readwrite').objectStore(store).put(val,key); }catch(e){} }
function get(store,key){ return new Promise(res=>{ if(!db) return res(null); try{ const r=db.transaction(store).objectStore(store).get(key); r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); }catch(e){ res(null); } }); }
let _st=0; function queueSave(){ clearTimeout(_st); _st=setTimeout(()=>put('kv','state2',snap()),400); }
function saveImage(id,blob){ put('img',id,blob); }
async function restore(){ await idb(); const raw=await get('kv','state2'); if(!raw) return false;
  try{ const st=JSON.parse(raw); const ids=[...new Set(st.objs.filter(o=>o.type==='img'&&o.src).map(o=>o.src))];
    for(const id of ids){ const blob=await get('img',id); if(!blob) continue; const img=await loadImg(blob); IMGS.set(id,{img,small:makeSmall(img,img.naturalWidth,img.naturalHeight),w:img.naturalWidth,h:img.naturalHeight,blob}); }
    st.objs.forEach(o=>{ if(o.type==='img'&&o.src&&!IMGS.has(o.src)) o.src=null; }); S=fixFonts(Object.assign(freshState(),st)); return true; }catch(e){ return false; } }


/* ---------- help guide (uses the real button names) ---------- */
const HELP=[
  ['tee','Pick your item','Tap the item at the top to change item and color.'],
  ['layout','Pick a template','Tap the yellow button. No layout starts blank.'],
  ['text','Change the words','Tap the words, then Edit words.'],
  ['photo','Add your photo','Tap an empty photo spot.'],
  ['move','Move and size','Drag to move. Pinch to resize and turn.'],
  ['zoomIn','See it for real','Tap the shirt in the top right.'],
  ['bag','Finish','Tap Done, then Add to order.'],
];
function openHelp(){ const l=$('helpList'); l.innerHTML=''; HELP.forEach(([icn,t,d])=>{ l.append(el('div','hrow',`<div class="hi">${ic(icn)}</div><div><b>${t}</b><span>${d}</span></div>`)); });
  $('helpGo').innerHTML=ic('check')+'<span>Got it</span>'; $('helpGo').onclick=()=>closeSheet('helpSheet'); openSheet('helpSheet'); }
function armReset(){ const b=$('resetBtn'); if(b.classList.contains('armed')){ b.classList.remove('armed'); startOver(); return; }
  b.classList.add('armed'); toast('restart','Tap again to start over'); setTimeout(()=>b.classList.remove('armed'),2600); }

/* ---------- boot ---------- */
function refreshAll(){ updItem(); buildCtx(); setTab(tab); updWarn(); resize(); drawMockMini(); }
async function boot(){
  $('undo').innerHTML=ic('undo'); $('redo').innerHTML=ic('redo'); $('mockClose').innerHTML=ic('close'); $('editDone').innerHTML=ic('check');
  $('tplBack').innerHTML=ic('chevL'); $('tplClose').innerHTML=ic('close'); $('cpDrop').innerHTML=ic('picker'); $('cpMore').innerHTML=ic('more'); $('cpUse').innerHTML=ic('check')+'<span>Use this color</span>';
  $('undo').onclick=undo; $('redo').onclick=redo;
  $('resetBtn').innerHTML=ic('restart'); $('helpBtn').innerHTML='<span style="font-size:19px;font-weight:800;line-height:1">?</span>'; $('helpClose').innerHTML=ic('close');
  $('resetBtn').onclick=armReset; $('helpBtn').onclick=openHelp;
  try{ if(!localStorage.getItem('fqHelpSeen')){ localStorage.setItem('fqHelpSeen','1'); setTimeout(openHelp,700); } }catch(e){}
  buildDock(); updZoom();
  const had=await restore();
  if(params.get('item')){ const g=GIFTS.find(x=>x.id===params.get('item')); if(g){ S.gift=g.id; if(!g.colors.some(c=>c[1]===S.color)) S.color=g.colors[0][1]; } }
  if(params.get('color')) S.color='#'+params.get('color').replace('#','');
  try{ await Promise.race([Promise.all(FONT_ORDER.map(f=>document.fonts.load(`40px ${FONTS[f].css}`))), new Promise(r=>setTimeout(r,2500))]); }catch(e){}
  if(!had){ const t=TEMPLATES.find(t=>t.id==='e1'); S.objs=buildTemplate(t,false); S.tpl=t.id; }
  H.stack=[snap()]; H.i=0; updUndo();
  refreshAll();
  window.addEventListener('resize',()=>{ resize(); setTab(tab); });
}
boot();
