:root{
  --bg:#121212; --panel:#1c1c1c; --tile:#262626; --tile2:#303030; --line:#3a3a3a;
  --text:#f2f2f2; --dim:#9a9a9a; --yel:#fdee4f; --red:#e3262e; --ok:#3ccf6e;
  --ease:cubic-bezier(.2,.8,.2,1);
  --top:56px; --panelH:184px; --dock:64px;
  --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  font:600 13px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* top bar */
#top{height:var(--top);flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:0 10px;padding-top:env(safe-area-inset-top,0px);box-sizing:content-box}
.rb{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--tile);transition:transform .15s var(--ease),opacity .2s,background .2s}
.rb:active{transform:scale(.9)}
.rb[disabled]{opacity:.3;pointer-events:none}
#giftChip{height:42px;border-radius:21px;background:var(--tile);display:flex;align-items:center;gap:8px;padding:0 14px 0 8px;margin:0 auto;transition:transform .15s var(--ease)}
#giftChip:active{transform:scale(.95)}
#giftChip .sw{width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
#giftChip .sw svg{width:20px;height:20px}
#giftChip b{font-size:13px;letter-spacing:.06em}
#giftChip small{color:var(--dim);font-weight:600}
#mockBtn{width:52px;height:52px;border-radius:14px;background:#2a2a2a;overflow:hidden;position:relative;box-shadow:0 0 0 2px var(--yel);transition:transform .2s var(--ease)}
#mockBtn:active{transform:scale(.92)}
#mockBtn canvas{width:100%;height:100%;display:block}
#mockBtn i{position:absolute;right:2px;bottom:2px;width:14px;height:14px;border-radius:50%;background:var(--yel);color:#111;display:grid;place-items:center}
#mockBtn i svg{width:10px;height:10px;stroke-width:3}

/* stage */
#stage{position:relative;flex:1 1 auto;min-height:0;touch-action:none;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fade{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity .3s ease}
#ctx{position:absolute;left:50%;top:8px;transform:translate(-50%,-8px) scale(.9);opacity:0;pointer-events:none;
  display:flex;gap:4px;background:rgba(28,28,28,.94);padding:5px;border-radius:18px;box-shadow:0 6px 20px rgba(0,0,0,.45);
  transition:opacity .2s,transform .25s var(--ease)}
#ctx.on{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
#ctx button{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
#ctx button:active{background:var(--tile2)}
#ctx button.del{color:#ff6a6a}
#ctx button.on{background:var(--yel);color:#111}
#zoomBtn{position:absolute;right:12px;bottom:12px;width:44px;height:44px;border-radius:50%;background:rgba(28,28,28,.92);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.4);transition:transform .2s var(--ease)}
#zoomBtn:active{transform:scale(.88)}
#sizePill{position:absolute;left:12px;bottom:12px;height:28px;padding:0 10px;border-radius:14px;background:rgba(28,28,28,.85);color:var(--dim);display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.04em;pointer-events:none}
#sizePill svg{width:14px;height:14px}
#warnDot{position:absolute;left:12px;bottom:46px;height:28px;padding:0 10px;border-radius:14px;background:#3a2f00;color:var(--yel);display:none;align-items:center;gap:6px;font-size:11px}
#warnDot.red{background:#3a0d0d;color:#ff7a7a}
#warnDot svg{width:15px;height:15px}

/* panel */
#panel{height:var(--panelH);flex:0 0 auto;background:var(--panel);border-radius:22px 22px 0 0;position:relative;overflow:hidden;box-shadow:0 -6px 24px rgba(0,0,0,.35)}
.pv{position:absolute;inset:0;display:flex;flex-direction:column;padding:10px 0 0;opacity:0;transform:translateY(14px);pointer-events:none;transition:opacity .22s,transform .3s var(--ease)}
.pv.on{opacity:1;transform:none;pointer-events:auto}
.subs{display:flex;gap:6px;padding:0 12px 8px;overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
.subs::-webkit-scrollbar,.row::-webkit-scrollbar{display:none}
.sb{flex:0 0 auto;height:38px;min-width:46px;border-radius:12px;background:var(--tile);display:grid;place-items:center;padding:0 10px;color:var(--dim);transition:background .2s,color .2s,transform .15s var(--ease)}
.sb.on{background:var(--yel);color:#111}
.sb:active{transform:scale(.92)}
.sb .tx{font-size:15px;font-weight:800}
.body{flex:1 1 auto;position:relative;min-height:0}
.sec{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:10px;opacity:0;pointer-events:none;transform:translateX(16px);transition:opacity .2s,transform .28s var(--ease)}
.sec.on{opacity:1;pointer-events:auto;transform:none}
.row{display:flex;gap:10px;overflow-x:auto;padding:2px 12px 4px;scroll-snap-type:x proximity;scrollbar-width:none;align-items:center}
.row>*{scroll-snap-align:start;flex:0 0 auto}
.tile{width:74px;height:84px;border-radius:16px;background:var(--tile);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative;transition:transform .15s var(--ease),box-shadow .2s}
.tile:active{transform:scale(.93)}
.tile.on{box-shadow:0 0 0 3px var(--yel)}
.tile small{font-size:10px;color:var(--dim);letter-spacing:.05em;text-transform:uppercase}
.tile.big{width:96px}
.tile.yel{background:var(--yel);color:#111}
.tile.yel small{color:#111}
.tile canvas{border-radius:10px;display:block}
.thumb{width:84px;height:106px;border-radius:14px;overflow:hidden;background:var(--tile);position:relative;transition:transform .15s var(--ease),box-shadow .2s}
.thumb:active{transform:scale(.94)}
.thumb.on{box-shadow:0 0 0 3px var(--yel)}
.thumb canvas{width:100%;height:100%;display:block}
.cat{width:44px;height:44px;border-radius:14px;background:var(--tile);display:grid;place-items:center;color:var(--dim);transition:background .2s,color .2s}
.cat.on{background:#fff;color:#111}
.vsep{width:2px;height:28px;background:#333;border-radius:1px}
.dot{width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18);transition:transform .15s var(--ease),box-shadow .2s;position:relative}
.dot.on{box-shadow:0 0 0 3px var(--panel),0 0 0 6px var(--yel)}
.dot:active{transform:scale(.88)}
.dot.auto{background:conic-gradient(#fff 0 50%,#111 0)}
.pal{height:48px;padding:0 10px;border-radius:24px;background:var(--tile);display:flex;align-items:center;gap:4px;transition:box-shadow .2s,transform .15s var(--ease)}
.pal i{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}
.pal.on{box-shadow:0 0 0 3px var(--yel)}
.pal:active{transform:scale(.93)}

/* ---------- history ---------- */
function snap(){ return JSON.stringify(S); }
function commit(){
  const s = snap();
  if (H.stack[H.i] === s) return;
  H.stack = H.stack.slice(0, H.i+1); H.stack.push(s);
  if (H.stack.length > 80) H.stack.shift();
  H.i = H.stack.length-1; updUndo(); queueSave();
}
function undo(){ if (H.i<=0) return; H.i--; S = JSON.parse(H.stack[H.i]); afterLoad(); }
function redo(){ if (H.i>=H.stack.length-1) return; H.i++; S = JSON.parse(H.stack[H.i]); afterLoad(); }
function afterLoad(){ if (sel && !byId(sel)) sel=null; cropMode=false; fitView(false); updUndo(); refreshAll(); queueSave(); }
function updUndo(){ $('undo').disabled = H.i<=0; $('redo').disabled = H.i>=H.stack.length-1; }

/* ---------- measuring ---------- */
const mctx = document.createElement('canvas').getContext('2d');
function fontStr(o, size){ return `${size}px ${FONTS[o.font]?.css||'sans-serif'}, sans-serif`; }
function textInfo(o){
  const lines = String(o.text||'').split('\n');
  let size = o.size;
  mctx.font = fontStr(o, size);
  let ws = lines.map(l => mctx.measureText(l).width);
  let w = Math.max(1, ...ws);
  if (o.fit && w > o.fit){ const f = o.fit / w; size *= f; ws = ws.map(x=>x*f); w = o.fit; }
  const lh = size * (FONTS[o.font]?.lh || 1.1) * (o.lh || 1);
  const sw = o.sw ? o.sw : 0;
  let bw = w + sw*2, bh = lh*lines.length + sw*2;
  let arc = (lines.length===1 && o.arc) ? o.arc*Math.PI/180 : 0;
  let R = 0, sag = 0;
  if (Math.abs(arc) > 0.02){
    R = w/Math.abs(arc);
    sag = R*(1-Math.cos(Math.abs(arc)/2));
    bw = 2*R*Math.sin(Math.min(Math.PI/2, Math.abs(arc)/2)) + size*0.6 + sw*2;
    if (Math.abs(arc) > Math.PI) bw = 2*R + size;
    bh = sag + lh + sw*2;
  }
  return {lines, ws, w, size, lh, bw, bh, arc, R, sag, sw};
}
function boxOf(o){
  if (o.type === 'text'){ const t = textInfo(o); return {w:t.bw, h:t.bh}; }
  return {w:o.fw, h:o.fh};
}

/* ---------- photo processing ---------- */
const procCache = new Map();
function procKey(o, pw, ph){ return [o.src,o.look,o.amt,o.ink,o.ink2,o.knock?1:0,o.fit,(o.cz||1).toFixed(3),(o.cx||0).toFixed(3),(o.cy||0).toFixed(3),pw,ph,S.color,S.pal].join('|'); }
function srcRect(o, im){
  const iw = im.w, ih = im.h;
  if (o.fit === 'contain') return {sx:0, sy:0, sw:iw, sh:ih, contain:true};
  const c0 = Math.max(o.fw/iw, o.fh/ih), z = c0*(o.cz||1);
  const sw = Math.min(iw, o.fw/z), sh = Math.min(ih, o.fh/z);
  const sx = (iw-sw)/2 + (o.cx||0)*(iw-sw)/2;
  const sy = (ih-sh)/2 + (o.cy||0)*(ih-sh)/2;
  return {sx, sy, sw, sh};
}
function effDpi(o){
  const im = IMGS.get(o.src); if (!im) return 999;
  const r = srcRect(o, im);
  if (r.contain){
    const f = Math.min(o.fw/im.w, o.fh/im.h);
    return im.w / (im.w*f*o.scale/DPI);
  }
  return r.sw / (o.fw*o.scale/DPI);
}
function processed(o, pw, ph, forPrint){
  pw = Math.max(8, Math.round(pw)); ph = Math.max(8, Math.round(ph));
  const key = procKey(o,pw,ph);
  if (!forPrint && procCache.has(key)) return procCache.get(key);
  const im = IMGS.get(o.src); if (!im) return null;
  const c = document.createElement('canvas'); c.width = pw; c.height = ph;
  const x = c.getContext('2d', {willReadFrequently:true});
  const r = srcRect(o, im);
  const sfS = im.small ? im.small.width/im.w : 1;
  const useSmall = !forPrint && im.small && pw <= (r.contain? im.w : r.sw)*sfS*1.3;
  const source = useSmall ? im.small : im.img;
  const sf = useSmall ? sfS : 1;
  if (r.contain){
    const f = Math.min(pw/im.w, ph/im.h); const dw = im.w*f, dh = im.h*f;
    x.drawImage(source, (pw-dw)/2, (ph-dh)/2, dw, dh);
  } else {
    x.drawImage(source, r.sx*sf, r.sy*sf, r.sw*sf, r.sh*sf, 0, 0, pw, ph);
  }
  const look = o.look || 'orig';
  if (o.knock || look !== 'orig'){
    const d = x.getImageData(0,0,pw,ph), a = d.data;
    if (o.knock){
      for (let i=0;i<a.length;i+=4){
        const m = Math.min(a[i],a[i+1],a[i+2]);
        if (m > 236) a[i+3] = 0; else if (m > 214) a[i+3] = a[i+3]*(236-m)/22;
      }
    }
    if (look === 'orig'){ x.putImageData(d,0,0); }
    else if (look === 'bw'){
      const k = 0.6 + (o.amt??0.5)*1.6;
      for (let i=0;i<a.length;i+=4){ let L=(a[i]*.299+a[i+1]*.587+a[i+2]*.114)/255; L=Math.min(1,Math.max(0,(L-.5)*k+.5))*255; a[i]=a[i+1]=a[i+2]=L; }
      x.putImageData(d,0,0);
    }
    else if (look === 'duo'){
      const c1 = hexRgb(resolve(o.ink||'INK')), c2 = hexRgb(resolve(o.ink2||PALETTES[S.pal].b||'#e3262e'));
      const k = 0.6 + (o.amt??0.5)*1.6;
      for (let i=0;i<a.length;i+=4){ let L=(a[i]*.299+a[i+1]*.587+a[i+2]*.114)/255; L=Math.min(1,Math.max(0,(L-.5)*k+.5));
        // dark -> ink2, light -> ink (ink is the bright one on dark garments)
        const t = darkGarment()? L : 1-L;
        a[i]=c2[0]+(c1[0]-c2[0])*t; a[i+1]=c2[1]+(c1[1]-c2[1])*t; a[i+2]=c2[2]+(c1[2]-c2[2])*t; }
      x.putImageData(d,0,0);
    }
    else if (look === 'stencil'){
      const ink = hexRgb(resolve(o.ink||'INK')); const thr = 0.25 + (o.amt??0.5)*0.5;
      const dark = darkGarment();
      for (let i=0;i<a.length;i+=4){ const L=(a[i]*.299+a[i+1]*.587+a[i+2]*.114)/255;
        // on a dark garment the ink prints the light parts, on a light garment the dark parts
        const on = dark ? L > (1-thr) : L < thr;
        if (on && a[i+3]>128){ a[i]=ink[0];a[i+1]=ink[1];a[i+2]=ink[2];a[i+3]=255; } else a[i+3]=0; }
      x.putImageData(d,0,0);
    }
    else if (look === 'tone'){
      // halftone dots, 45 degree screen
      const dot = (8 + (o.amt??0.5)*34) * (pw/(o.fw*o.scale)); // print px -> canvas px
      const cell = Math.max(2.2, dot);
      const L = new Float32Array(pw*ph), A = new Float32Array(pw*ph);
      for (let i=0,j=0;i<a.length;i+=4,j++){ L[j]=(a[i]*.299+a[i+1]*.587+a[i+2]*.114)/255; A[j]=a[i+3]/255; }
      x.clearRect(0,0,pw,ph);
      x.fillStyle = resolve(o.ink||'INK');
      const dark = darkGarment();
      const ca = Math.cos(Math.PI/4), sa = Math.sin(Math.PI/4);
      const D = Math.hypot(pw,ph)/2 + cell, cxp = pw/2, cyp = ph/2;
      x.beginPath();
      for (let gy=-D; gy<D; gy+=cell){
        for (let gx=-D; gx<D; gx+=cell){
          const px = cxp + gx*ca - gy*sa, py = cyp + gx*sa + gy*ca;
          if (px<-cell||py<-cell||px>pw+cell||py>ph+cell) continue;
          const ix = Math.min(pw-1,Math.max(0,px|0)), iy = Math.min(ph-1,Math.max(0,py|0)), j = iy*pw+ix;
          let v = dark ? L[j] : 1-L[j];   // how much ink here
          v *= A[j];
          if (v < 0.04) continue;
          const rr = cell*0.71*Math.sqrt(v);
          x.moveTo(px+rr,py); x.arc(px,py,rr,0,Math.PI*2);
        }
      }
      x.fill();
    }
  }
  if (!forPrint){
    procCache.set(key, c);
    if (procCache.size > 40){ procCache.delete(procCache.keys().next().value); }
  }
  return c;
}
function hexRgb(h){ h=h.replace('#',''); if(h.length===3)h=h.split('').map(x=>x+x).join(''); const n=parseInt(h,16); return [n>>16&255,n>>8&255,n&255]; }

/* ---------- drawing ---------- */
function maskPath(x, o){
  const w=o.fw, h=o.fh;
  x.beginPath();
  if (o.mask === 'circle'){ x.ellipse(0,0,w/2,h/2,0,0,Math.PI*2); }
  else if (o.mask === 'round'){ const r=Math.min(w,h)*0.12; roundRect(x,-w/2,-h/2,w,h,r); }
  else if (o.mask === 'heart'){
    const s=Math.min(w,h)/2;
    x.moveTo(0, s*0.95);
    x.bezierCurveTo(-s*1.25, s*0.1, -s*1.0, -s*1.05, 0, -s*0.45);
    x.bezierCurveTo( s*1.0, -s*1.05,  s*1.25, s*0.1, 0, s*0.95);
  }

}
function roundRect(x,X,Y,w,h,r){ x.moveTo(X+r,Y); x.arcTo(X+w,Y,X+w,Y+h,r); x.arcTo(X+w,Y+h,X,Y+h,r); x.arcTo(X,Y+h,X,Y,r); x.arcTo(X,Y,X+w,Y,r); x.closePath(); }

function drawPlaceholder(x, o){
  const w=o.fw, h=o.fh;
  const ink = inkAuto();
  x.save(); maskPath(x,o); x.clip();
  x.fillStyle = darkGarment()? 'rgba(255,255,255,.10)' : 'rgba(0,0,0,.08)';
  x.fillRect(-w/2,-h/2,w,h);
  // simple mountains + sun
  x.fillStyle = darkGarment()? 'rgba(255,255,255,.16)':'rgba(0,0,0,.12)';
  x.beginPath(); x.moveTo(-w/2,h/2); x.lineTo(-w*.15,-h*.02); x.lineTo(w*.08,h*.2); x.lineTo(w*.25,h*.05); x.lineTo(w/2,h*.32); x.lineTo(w/2,h/2); x.fill();
  x.beginPath(); x.arc(w*.22,-h*.22,Math.min(w,h)*.09,0,Math.PI*2); x.fill();
  x.restore();
  // plus
  const r = Math.min(w,h)*0.13;
  x.save(); x.globalAlpha=.8;
  x.fillStyle = '#fdee4f'; x.beginPath(); x.arc(0,0,r,0,Math.PI*2); x.fill();
  x.strokeStyle='#111'; x.lineWidth=r*0.18; x.lineCap='round';
  x.beginPath(); x.moveTo(-r*.45,0); x.lineTo(r*.45,0); x.moveTo(0,-r*.45); x.lineTo(0,r*.45); x.stroke();
  x.restore();
  void ink;
}

function drawObj(x, o, k, mode){
  // mode: 'screen' | 'print' | 'thumb' ; k = device px per print px
  x.save();
  x.translate(o.x, o.y); x.rotate(o.rot||0); x.scale(o.scale||1, o.scale||1);
  if (o.op != null) x.globalAlpha *= o.op;
  if (o.type === 'shape'){
    x.fillStyle = colorOf(o,'color');
    x.beginPath();
    if (o.shape==='circle') x.ellipse(0,0,o.fw/2,o.fh/2,0,0,Math.PI*2);
    else if (o.shape==='round') roundRect(x,-o.fw/2,-o.fh/2,o.fw,o.fh,Math.min(o.fw,o.fh)*0.18);
    else x.rect(-o.fw/2,-o.fh/2,o.fw,o.fh);
    x.fill();
  }
  else if (o.type === 'img'){
    if (!o.src || !IMGS.has(o.src)){
      if (mode !== 'print') drawPlaceholder(x,o);
    } else {
      const s = k*(o.scale||1);
      let pw = o.fw*s, ph = o.fh*s;
      if (mode==='screen'){ const cap = 1400/Math.max(pw,ph); if (cap<1){pw*=cap;ph*=cap;} }
      const c = processed(o, pw, ph, mode==='print');
      if (c){ x.save(); maskPath(x,o); x.clip(); x.drawImage(c,-o.fw/2,-o.fh/2,o.fw,o.fh); x.restore(); }
    }
    if (o.ring){ x.lineWidth = o.ring; x.strokeStyle = colorOf(o,'ringColor'); maskPath(x,o); x.stroke(); }
  }
  else if (o.type === 'text'){
    const t = textInfo(o);
    x.font = fontStr(o, t.size);
    x.textBaseline = 'middle';
    const fill = colorOf(o,'color');
    const stroke = o.sw ? (o.strokeColor ? resolve(o.strokeColor) : (lum(fill)>0.5?'#111111':'#ffffff')) : null;
    x.lineJoin='round'; x.miterLimit=2;
    if (Math.abs(t.arc) > 0.02){
      const up = t.arc > 0, R = t.R;
      const chars = [...t.lines[0]];
      const cw = chars.map(ch => x.measureText(ch).width * (t.size/ t.size));
      const scaleW = t.w / Math.max(1, cw.reduce((a,b)=>a+b,0));
      let acc = -t.w/2;
      x.textAlign = 'center';
      const yoff = up ? -t.sag/2 : t.sag/2;
      const passes = stroke ? ['s','f'] : ['f'];
      for (const pass of passes){
        acc = -t.w/2;
        for (let i=0;i<chars.length;i++){
          const w = cw[i]*scaleW, mid = acc + w/2; acc += w;
          const th = mid / R;
          x.save();
          if (up){ x.translate(R*Math.sin(th), yoff + R - R*Math.cos(th)); x.rotate(th); }
          else   { x.translate(R*Math.sin(th), yoff - R + R*Math.cos(th)); x.rotate(-th); }
          if (pass==='s'){ x.lineWidth = t.sw*2; x.strokeStyle = stroke; x.strokeText(chars[i],0,0); }
          else { x.fillStyle = fill; x.fillText(chars[i],0,0); }
          x.restore();
        }
      }
    } else {
      const al = o.align||'center';
      x.textAlign = al;
      const ax = al==='left' ? -t.w/2 : al==='right' ? t.w/2 : 0;
      const n = t.lines.length;
      for (let i=0;i<n;i++){
        const y = (i-(n-1)/2)*t.lh;
        if (stroke){ x.lineWidth=t.sw*2; x.strokeStyle=stroke; x.strokeText(t.lines[i],ax,y); }
        x.fillStyle = fill; x.fillText(t.lines[i],ax,y);
      }
    }
  }
  x.restore();
}

/* render a whole design into a context whose transform maps print px */
function drawDesign(x, k, mode, clipTo){
  const W=PW(), Hh=PH();
  if (clipTo){ x.save(); x.beginPath(); x.rect(0,0,W,Hh); x.clip(); }
  for (const o of S.objs) drawObj(x,o,k,mode);
  if (clipTo) x.restore();
}

/* ---------- stage view ---------- */
const cv = $('cv'), cx = cv.getContext('2d');
let V = {z:1, px:0, py:0};   // zoom, pan (css px)
let SW=0, SH=0, DPR=1;
const TOPR = 54;
function base(){ const W=PW(), Hh=PH(); return Math.min((SW-24)/W, (SH-TOPR-20)/Hh); }
function view(){ const k = base()*V.z; return {k, ox: SW/2 - PW()*k/2 + V.px, oy: (SH+TOPR-8)/2 - PH()*k/2 + V.py}; }
function resize(){
  const r = $('stage').getBoundingClientRect();
  SW = r.width; SH = r.height; DPR = Math.min(window.devicePixelRatio||1, 2.5);
  cv.width = Math.round(SW*DPR); cv.height = Math.round(SH*DPR);
  const f = $('fade'); f.width = cv.width; f.height = cv.height;
  clampPan(); dirty();
}
function clampPan(){
  const {k} = view(); const W=PW()*k, Hh=PH()*k;
  const mx = Math.max(0,(W-SW)/2+40), my = Math.max(0,(Hh-SH)/2+40);
  V.px = Math.max(-mx, Math.min(mx, V.px)); V.py = Math.max(-my, Math.min(my, V.py));
}
let _dirty = false, _mockT = 0;
function dirty(mock=true){ if(!_dirty){ _dirty=true; requestAnimationFrame(render); } if(mock){ clearTimeout(_mockT); _mockT=setTimeout(drawMockMini, 90);} }
let guides = {x:false,y:false};
function render(){
  _dirty = false;
  const {k,ox,oy} = view();
  const W=PW(), Hh=PH();
  cx.setTransform(1,0,0,1,0,0);
  cx.clearRect(0,0,cv.width,cv.height);
  cx.fillStyle = '#121212'; cx.fillRect(0,0,cv.width,cv.height);
  cx.setTransform(DPR*k,0,0,DPR*k,DPR*ox,DPR*oy);
  // garment color behind print area, with a soft surround so it reads as the shirt
  cx.save();
  cx.shadowColor='rgba(0,0,0,.5)'; cx.shadowBlur=30/k*DPR/DPR; cx.fillStyle = S.color;
  const pad = 0;
  cx.fillRect(-pad,-pad,W+pad*2,Hh+pad*2);
  cx.restore();
  // outside parts faded, inside full
  cx.save(); cx.globalAlpha = .28; drawDesign(cx, k*DPR, 'screen', false); cx.restore();
  cx.save(); cx.beginPath(); cx.rect(0,0,W,Hh); cx.clip();
  cx.fillStyle = S.color; cx.fillRect(0,0,W,Hh);
  drawDesign(cx, k*DPR, 'screen', false);
  cx.restore();
  // print edge
  cx.save();
  cx.lineWidth = 1.5/k; cx.setLineDash([8/k,6/k]);
  cx.strokeStyle = darkGarment()? 'rgba(253,238,79,.85)':'rgba(227,38,46,.85)';
  cx.strokeRect(0,0,W,Hh);
  cx.restore();
  // guides
  if (guides.x || guides.y){
    cx.save(); cx.strokeStyle = '#ff3fa4'; cx.lineWidth = 1.5/k;
    if (guides.x){ cx.beginPath(); cx.moveTo(W/2,0); cx.lineTo(W/2,Hh); cx.stroke(); }
    if (guides.y){ cx.beginPath(); cx.moveTo(0,Hh/2); cx.lineTo(W,Hh/2); cx.stroke(); }
    cx.restore();
  }
  // selection
  const o = selObj();
  if (o){
    const b = boxOf(o);
    cx.save(); cx.translate(o.x,o.y); cx.rotate(o.rot||0);
    const w=b.w*o.scale, h=b.h*o.scale, p=10/k;
    cx.lineWidth = 2/k; cx.strokeStyle = cropMode? '#7cc8f2' : '#fdee4f';
    cx.setLineDash(cropMode? [6/k,4/k] : []);
    cx.strokeRect(-w/2-p,-h/2-p,w+p*2,h+p*2);
    cx.setLineDash([]);
    if (!cropMode){
      // scale/rotate handle
      const hr = 15/k;
      cx.fillStyle = '#fdee4f'; cx.beginPath(); cx.arc(w/2+p,h/2+p,hr,0,Math.PI*2); cx.fill();
      cx.strokeStyle='#111'; cx.lineWidth=2.2/k; cx.beginPath();
      cx.arc(w/2+p,h/2+p,hr*0.5,-0.3,Math.PI*1.2); cx.stroke();
    }
    cx.restore();
  }
}

/* ---------- hit testing ---------- */
function toPrint(clientX, clientY){
  const r = cv.getBoundingClientRect(); const {k,ox,oy} = view();
  return {x:(clientX-r.left-ox)/k, y:(clientY-r.top-oy)/k};
}
function local(o, p){
  const dx=p.x-o.x, dy=p.y-o.y, c=Math.cos(-(o.rot||0)), s=Math.sin(-(o.rot||0));
  return {x:(dx*c-dy*s)/o.scale, y:(dx*s+dy*c)/o.scale};
}
function hit(p){
  for (let i=S.objs.length-1;i>=0;i--){
    const o=S.objs[i]; if (o.lock) continue;
    const b=boxOf(o), l=local(o,p), pad = 14/view().k/o.scale;
    if (Math.abs(l.x)<=b.w/2+pad && Math.abs(l.y)<=b.h/2+pad) return o;
  }
  return null;
}
function onHandle(o, p){
  const b=boxOf(o), {k}=view(); const w=b.w*o.scale, h=b.h*o.scale, pd=10/k;
  const c=Math.cos(o.rot||0), s=Math.sin(o.rot||0);
  const hx = o.x + (w/2+pd)*c - (h/2+pd)*s, hy = o.y + (w/2+pd)*s + (h/2+pd)*c;
  return Math.hypot(p.x-hx,p.y-hy) < 26/k;
}

/* ---------- gestures ---------- */
const ptrs = new Map();
let G = null, lastTap = {t:0,id:null}, moved = false;
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  moved = false;
  if (ptrs.size === 1){
    const p = toPrint(e.clientX,e.clientY);
    const o = selObj();
    if (o && !cropMode && onHandle(o,p)){
      const b=boxOf(o);
      G = {mode:'handle', o, cx:o.x, cy:o.y, d0:Math.hypot(p.x-o.x,p.y-o.y), a0:Math.atan2(p.y-o.y,p.x-o.x), s0:o.scale, r0:o.rot||0, diag:Math.hypot(b.w,b.h)};
      return;
    }
    if (o && cropMode){
      G = {mode:'crop', o, sx:e.clientX, sy:e.clientY, cx0:o.cx||0, cy0:o.cy||0}; return;
    }
    const h = hit(p);
    if (h){
      if (sel !== h.id){ select(h.id); }
      G = {mode:'move', o:h, dx:p.x-h.x, dy:p.y-h.y};
    } else {
      G = {mode:'pan', sx:e.clientX, sy:e.clientY, px:V.px, py:V.py, tapEmpty:true};
    }
  } else if (ptrs.size === 2){
    const [a,b] = [...ptrs.values()];
    const d = Math.hypot(a.x-b.x,a.y-b.y), ang = Math.atan2(b.y-a.y,b.x-a.x);
    const o = selObj();

});
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;

  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (!G) return;
  if (Math.hypot(e.clientX-prev.x, e.clientY-prev.y) > 0.5) moved = true;
  const {k} = view();
  if (G.mode==='move' && ptrs.size===1){
    const p = toPrint(e.clientX,e.clientY);
    let nx = p.x-G.dx, ny = p.y-G.dy;
    const th = 10/k; guides = {x:false,y:false};
    if (Math.abs(nx-PW()/2) < th){ nx = PW()/2; guides.x=true; }
    if (Math.abs(ny-PH()/2) < th){ ny = PH()/2; guides.y=true; }
    G.o.x = nx; G.o.y = ny; dirty();
  }
  else if (G.mode==='handle'){
    const p = toPrint(e.clientX,e.clientY);

  }

    dirty();
  }
  else if (ptrs.size===2){
    const [a,b] = [...ptrs.values()];
    const d = Math.hypot(a.x-b.x,a.y-b.y), ang = Math.atan2(b.y-a.y,b.x-a.x);
    if (G.mode==='pinch'){ G.o.scale = Math.max(0.05, G.s0*d/G.d0); G.o.rot = snapRot(G.r0 + ang - G.a0); dirty(); }
    else if (G.mode==='cropz'){ G.o.cz = Math.max(1, Math.min(6, G.z0*d/G.d0)); dirty(); }
    else if (G.mode==='vzoom'){ V.z = Math.max(1, Math.min(5, G.z0*d/G.d0)); clampPan(); dirty(false); updZoomBtn(); }

});
function endPtr(e){
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (ptrs.size>0){ // keep going with one finger: restart as move/pan
    if (G && (G.mode==='pinch'||G.mode==='vzoom'||G.mode==='cropz')) G = null;
    return;
  }
  guides = {x:false,y:false};
  if (G){
    if (G.mode==='pan' && G.tapEmpty && !moved){ if (cropMode){ cropMode=false; } select(null); }
    else if (G.mode==='move' && !moved){
      // tap on selected object: double tap = edit
      const now = performance.now();
      if (lastTap.id===G.o.id && now-lastTap.t < 380){
        if (G.o.type==='text') openEdit();
        else if (G.o.type==='img'){ if (!G.o.src) pickPhoto(); else toggleCrop(); }
      } else if (G.o.type==='img' && !G.o.src){ pickPhoto(); }
      lastTap = {t:now, id:G.o.id};
    }
    if (moved && G.mode!=='pan' && G.mode!=='vzoom') commit();

  tween(0,1,320, e => { V.z = z0+(z-z0)*e; V.px = px0+(tx-px0)*e; V.py = py0+(ty-py0)*e; clampPan(); dirty(false); }, updZoomBtn);
}

function issues(){
  const out=[]; const W=PW(), Hh=PH();
  let outside=false;
  for (const o of S.objs){
    if (o.type==='img' && !o.src) continue;
    const b=boxOf(o); const w=b.w*o.scale, h=b.h*o.scale; const c=Math.abs(Math.cos(o.rot||0)), s=Math.abs(Math.sin(o.rot||0));
    const bw = w*c+h*s, bh = w*s+h*c;
    if (o.x-bw/2 < -2 || o.y-bh/2 < -2 || o.x+bw/2 > W+2 || o.y+bh/2 > Hh+2){ outside=true; }
  }
  if (outside) out.push({k:'out', icon:'fit', text:'Part of it is outside the print area', fix:'FIT', run:fitInside});
  const low = S.objs.filter(o=>o.type==='img'&&o.src&&effDpi(o)<100);
  if (low.length) out.push({k:'low', icon:'warn', text:'A photo may print blurry', fix:'SHOW', run:()=>{ closeSheet('doneSheet'); select(low[0].id); }});
  const empty = S.objs.filter(o=>o.type==='img'&&!o.src);
  if (empty.length) out.push({k:'empty', icon:'photo', text: empty.length+' empty photo spot'+(empty.length>1?'s':''), fix:'REMOVE', run:()=>{ S.objs=S.objs.filter(o=>!(o.type==='img'&&!o.src)); commit(); dirty(); }});
  if (!S.objs.some(o=>o.type!=='img'||o.src)) out.push({k:'blank', icon:'warn', text:'The design is empty', fix:null});
  return out;
}
function fitInside(){
  // scale the whole design around the center so every piece fits
  const W=PW(), Hh=PH(); let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  for (const o of S.objs){ if(o.type==='img'&&!o.src) continue; const b=boxOf(o); const w=b.w*o.scale, h=b.h*o.scale; const c=Math.abs(Math.cos(o.rot||0)), s=Math.abs(Math.sin(o.rot||0)); const bw=w*c+h*s, bh=w*s+h*c;
    minX=Math.min(minX,o.x-bw/2); maxX=Math.max(maxX,o.x+bw/2); minY=Math.min(minY,o.y-bh/2); maxY=Math.max(maxY,o.y+bh/2); }
  const f = Math.min(1, (W*0.98)/(maxX-minX), (Hh*0.98)/(maxY-minY));
  const cx0=(minX+maxX)/2, cy0=(minY+maxY)/2;
  const start = S.objs.map(o=>({x:o.x,y:o.y,s:o.scale}));
  tween(0,1,380,e=>{ S.objs.forEach((o,i)=>{ const st=start[i]; const ff=1+(f-1)*e; const nx=W/2+(st.x-cx0)*f, ny=Hh/2+(st.y-cy0)*f; o.x=st.x+(nx-st.x)*e; o.y=st.y+(ny-st.y)*e; o.scale=st.s*ff; }); dirty(); }, ()=>{ commit(); preflight(); });
}

  x.fillStyle=lg; const lx = rect.clipX ? rect.clipX[0] : rect.x, lw = rect.clipX ? rect.clipX[1]-rect.clipX[0] : rect.w;
  x.fillRect(lx,rect.y,lw,rect.h); x.restore();
  x.restore();
}

function buildTemplate(t, preview){
  const W=PW(), Hh=PH();
  const s = Math.min(W/1000, Hh/1272), ox=(W-1000*s)/2, oy=(Hh-1272*s)/2;
  // keep the user's photos and edited words when swapping layouts
  const myPhotos = S.objs.filter(o=>o.type==='img'&&o.src).map(o=>({src:o.src}));
  const myWords = S.objs.filter(o=>o.type==='text'&&o.edited).map(o=>o.text);
  let pi=0, wi=0;
  return t.objs.map(src=>{
    const o = JSON.parse(JSON.stringify(src));
    o.id = preview ? 'p'+Math.random() : nid();
    o.x = ox + o.x*s; o.y = oy + o.y*s; o.rot = o.rot||0; o.scale = 1;
    if (o.type==='text'){ o.size = o.size*s; if (o.fit) o.fit*=s; if (o.sw) o.sw*=s; if (wi<myWords.length){ o.text=myWords[wi++]; o.edited=true; } }
    else { o.fw*=s; o.fh*=s; if (o.ring) o.ring*=s; if (o.type==='img' && pi<myPhotos.length){ o.src=myPhotos[pi++].src; } }
    return o;
  });
}
function applyTemplate(t, keepSel){
  crossfade();
  S.objs = buildTemplate(t, false); S.tpl = t.id;
  sel=null; procCache.clear();

  dirty(); updWarn();
}

/* ---------- save on this phone (IndexedDB) ---------- */
let db=null;
function idb(){ return new Promise(res=>{ try{ const r=indexedDB.open('fraqtals-editor',1); r.onupgradeneeded=()=>{ r.result.createObjectStore('kv'); r.result.createObjectStore('img'); }; r.onsuccess=()=>{db=r.result;res(db);}; r.onerror=()=>res(null);}catch(e){res(null);} }); }
function put(store,key,val){ if(!db) return; try{ db.transaction(store,'readwrite').objectStore(store).put(val,key); }catch(e){} }
function get(store,key){ return new Promise(res=>{ if(!db) return res(null); try{ const r=db.transaction(store).objectStore(store).get(key); r.onsuccess=()=>res(r.result); r.onerror=()=>res(null);}catch(e){res(null);} }); }
let _st=0; function queueSave(){ clearTimeout(_st); _st=setTimeout(()=>put('kv','state',snap()), 400); }
function saveImage(id,blob){ put('img',id,blob); }
async function restore(){
  await idb();
  const raw = await get('kv','state'); if (!raw) return false;
  try{
    const st = JSON.parse(raw);
    const ids = [...new Set(st.objs.filter(o=>o.type==='img'&&o.src).map(o=>o.src))];
    for (const id of ids){
      const blob = await get('img',id); if (!blob) continue;
      const url = URL.createObjectURL(blob);
      const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
      IMGS.set(id, {img, small:makeSmall(img,img.naturalWidth,img.naturalHeight), w:img.naturalWidth, h:img.naturalHeight, blob});
    }
    st.objs.forEach(o=>{ if(o.type==='img' && o.src && !IMGS.has(o.src)) o.src=null; });
    S = st; return true;
  }catch(e){ return false; }
}

  if (!had){ const t=TEMPLATES.find(t=>t.id==='b1'); S.objs = buildTemplate(t,false); S.tpl=t.id; cat='bday'; }

  setTab('layout');

}
