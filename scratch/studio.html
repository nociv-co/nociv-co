<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio | From Scratch</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#161616">
<link rel="stylesheet" href="kit/studio.css">
</head>
<body data-dev="phone">
<header class="st-top">
  <a class="st-back" href="/scratch/" aria-label="Back to From Scratch">&lsaquo;</a><b class="st-logo">From<span>Scratch</span></b>
  <span class="st-saved" id="saved" aria-live="polite">Saved</span>
  <span class="sp"></span>
  <div class="st-tool" role="group" aria-label="Mode"><button type="button" data-mode="pick" class="on" aria-pressed="true" aria-label="Select: tap things in the preview to edit them"><svg viewBox="0 0 24 24"><path d="M5 2.5l13.5 11.2-6.1.6 3.6 6.9-2.6 1.3-3.6-7-4.8 3.9z"/></svg></button><button type="button" data-mode="view" aria-pressed="false" aria-label="Preview: use the site like a visitor"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg></button></div>
  <button type="button" class="th-q st-q" data-help="studio" aria-label="Studio help">?</button>
  <button type="button" class="st-pub" data-act="pane" data-v="publish">Publish</button>
</header>
<section class="st-prev" aria-label="Live preview">
  <div class="st-frame"><iframe id="pv" src="preview.html" title="Live preview of your site"></iframe><button type="button" id="full">Full view</button><div class="st-dev" role="group" aria-label="Preview size"><button type="button" data-dev="phone" class="on">Phone</button><button type="button" data-dev="wide">Wide</button></div></div>
</section>
<section class="st-ed">
  <nav class="st-tabs" role="tablist" aria-label="Studio">
    <button type="button" role="tab" data-p="start"><b>1</b>Start</button>
    <button type="button" role="tab" data-p="pages"><b>2</b>Pages</button>
    <button type="button" role="tab" data-p="look"><b>3</b>Look</button>
    <button type="button" role="tab" data-p="info"><b>4</b>Info</button>
  </nav>
  <div id="pane"></div>
</section>
<script>window.TOOL_HELP = Object.assign(window.TOOL_HELP || {}, {"studio": {"title": "Studio help", "items": [["1 Start", "Tap what you are making, then a picture tile to start from, then a color. You can come back and change the color any time."], ["2 Pages", "Your pages and everything on them. Tap one to fill it in. Add a page at the bottom. You can also tap things right in the preview."], ["3 Look", "Tap a look or Shuffle for a new mix. Your words and photos stay. Fine tune has every font and setting."], ["4 Info", "Your site name, logo, email and domain."], ["Preview", "The play button at the top lets you click around like a visitor. The arrow goes back to editing."], ["Publish", "Top right. Fix anything on the checklist, then download your site and put it online."], ["Saved", "Everything saves on this phone as you work. Make a backup file if you switch phones."]]}});</script>
<script src="/tool-help.js" defer></script>
<script src="kit/studio.js"></script>
</body>
</html>
